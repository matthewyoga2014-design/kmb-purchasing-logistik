const LEVELS=["Helper","Junior","Middle","Senior","Supervisor"];
const POSISI=[["Helper Mekanik","Helper"],["Junior Mekanik","Junior"],["Middle Mekanik","Middle"],["Pengawas / Foreman","Middle"],["Senior Mekanik","Senior"],["Supervisor Plant","Supervisor"]];
const DEF={wTeknis:60,wKinerja:40,gTop:85,gMid:75,gPass:60,showScore:false,linkDays:7,
  cat:[{k:"A",min:81,label:"Sangat Baik"},{k:"B",min:66,label:"Baik"},{k:"C",min:56,label:"Cukup"},{k:"D",min:41,label:"Kurang"},{k:"E",min:0,label:"Sangat Kurang"}],
  scale:[{min:86,h:"A",b:4,k:"A"},{min:81,h:"A-",b:3.67,k:"A"},{min:76,h:"B+",b:3.33,k:"B"},{min:71,h:"B",b:3,k:"B"},{min:66,h:"B-",b:2.67,k:"B"},{min:61,h:"C+",b:2.33,k:"C"},{min:56,h:"C",b:2,k:"C"},{min:41,h:"D",b:1,k:"D"},{min:0,h:"E",b:0,k:"E"}],
  bands:{Helper:["Helper"],Junior:["G1","G2","G3"],Middle:["G4","G5","G6"],Senior:["G7","G8","G9"],Supervisor:["G10"]},
  rekKontrak:{A:"Angkat karyawan tetap / layak naik grade",B:"Perpanjang kontrak",C:"Perpanjang kontrak dengan pembinaan",D:"Perpanjang singkat dengan evaluasi ketat",E:"Tidak diperpanjang"},
  rekNew:{A:"Diterima",B:"Diterima",C:"Dipertimbangkan (perlu pembinaan)",D:"Tidak direkomendasikan",E:"Tidak direkomendasikan"},
  gasUrl:"",
  proctorDef:{camera:true,photoSec:30,tabLimit:3,fullscreen:true,copyBlock:true,shuffle:false,shuffleOpt:true},
  timerDef:{mode:"total",perQ:60},
  perms:{editor:{link:true,bank:true,kinerja:true,hapus:true,pengaturan:true},viewer:{resume:true,excel:true,nik:true}}};
const PERM_LABEL={editor:{link:"Membuat & membagikan link tes",bank:"Mengelola bank soal",kinerja:"Mengisi penilaian kinerja & keputusan",hapus:"Menghapus peserta / reset tes",pengaturan:"Mengubah pengaturan nilai & pengawasan"},viewer:{resume:"Membuka resume per peserta",excel:"Mengunduh Excel",nik:"Melihat NIK peserta"}};
const TIMER_LABEL={total:"Total per sheet",per_soal:"Sama rata per soal",custom:"Berbeda tiap soal"};
const KMB_IND=[
 ["Disiplin","Menaati tata tertib & peraturan perusahaan; riwayat teguran/SP."],
 ["Tanggung Jawab","Menyelesaikan tugas atasan sesuai SOP, individu maupun tim."],
 ["Skill / Keahlian","Menguasai teknikal pekerjaan tanpa harus diarahkan atasan."],
 ["Knowledge","Cepat memahami dan tanggap dalam proses pengerjaan tugas."],
 ["Komunikasi","Mendengarkan dengan empati, menyampaikan pesan lisan/tulisan dengan jelas."],
 ["Kerjasama","Bekerja sama dan membantu tim menyelesaikan masalah pekerjaan."],
 ["Pengetahuan tentang Pekerjaan","Memahami tugas dan menerapkannya dalam pekerjaan sehari-hari."],
 ["Integritas","Jujur, dapat dipercaya, dan dapat diandalkan."],
 ["Problem Solving","Memunculkan ide penyelesaian masalah yang cepat, tepat, dan benar."],
 ["Kualitas Kerja (ATR)","4 = ATR 97–100% · 3 = 91–96% · 2 = 86–90% · 1 = < 85%"]];
const KMB_SCALE=[[4,"Sangat Baik"],[3,"Baik"],[2,"Kurang Baik"],[1,"Buruk"]];
const KMB_SP=[0,7.5,12.5,17.5];
const FPK_A=["Inisiatif & Kreativitas","Kedisiplinan & Kerajinan","Komunikasi & Etika Kerja","Tanggung Jawab & Motivasi","Tingkat Pemahaman & Kemampuan"];
const FPK_B=["Pengetahuan & Kemampuan","Efisiensi & Efektivitas Kerja","Kecepatan & Ketelitian Kerja","Kualitas & Kerjasama Tim","Hasil & Pencapaian Target Kerja","Penguasaan Sistem & Administrasi","Pencatatan, Penyimpanan & Pengarsipan","Pemahaman & Pengoperasian Unit","Perawatan Unit & Alat Kerja","Kebersihan & Kepedulian K3"];
const FPK_VAL={A:95,B:82,C:67,D:55,E:25};

let SB=null,ROLE="none",USER=null,TAB="ringkasan",BANKSEL=null;
let S={modules:[],sessions:[],attempts:[],settings:{...DEF},questions:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=1)=>n==null||isNaN(n)?"–":(+n).toFixed(d).replace(".",",");
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fdate=d=>d?new Date(d).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"–";
const fdt=d=>d?new Date(d).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"–";
const canEdit=()=>ROLE==="owner"||ROLE==="editor";
function can(p){if(ROLE==="owner")return true;const pm=S.settings.perms||DEF.perms;if(ROLE==="editor")return !!(pm.editor||{})[p]&&true;if(ROLE==="viewer")return !!(pm.viewer||{})[p];return false}
const showNik=()=>ROLE!=="viewer"||can("nik");
const fsec=s=>s>=3600?Math.floor(s/3600)+" jam "+Math.round(s%3600/60)+" mnt":s>=60?Math.round(s/60)+" menit":s+" detik";
async function gasPost(action,data){const url=S.settings.gasUrl||(Exam.info&&Exam.info.gas_url);if(!url)throw new Error("URL Apps Script belum diatur");
  const r=await fetch(url,{method:"POST",body:JSON.stringify({action,...data})});return r.json()}
function syncDrive(){if(S.settings.gasUrl)gasPost("sync",{}).catch(()=>{})}
function toast(m,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function openModal(html){$("mbox").innerHTML=html;$("modal").hidden=false;$("modal").scrollTop=0}
function closeModal(){$("modal").hidden=true;$("mbox").innerHTML="";document.body.classList.remove("printing")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Link disalin")}catch(e){prompt("Salin link ini:",t)}}
function linkFor(s){return location.origin+location.pathname+"?t="+s.token}

/* ====================== KALKULASI ====================== */
function setg(){return S.settings}
function scaleRows(){return [...(setg().scale||DEF.scale)].sort((a,b)=>b.min-a.min)}
function letterOf(score){if(score==null)return null;const r=scaleRows();return r.find(x=>score>=x.min)||r[r.length-1]}
function scaleMax(i){const r=scaleRows();return i===0?100:r[i-1].min-1}
function catMin(k){const r=scaleRows().filter(x=>x.k===k);return r.length?Math.min(...r.map(x=>x.min)):0}
function category(score){const L=letterOf(score);if(!L)return null;const c=setg().cat.find(x=>x.k===L.k)||setg().cat[setg().cat.length-1];return {...c,min:catMin(c.k),h:L.h,b:L.b}}
const catChip=(c,big)=>c?`<span class="chip cat-${c.k}"${big?' style="font-size:15px;padding:6px 12px"':""}>${esc(c.h)} · ${esc(c.label)}</span>`:"–";
function gradeRec(level,score){
  if(score==null||!level)return {grade:"–",note:""};
  const g=setg(),bands=g.bands,list=bands[level]||[];
  if(!list.length)return {grade:"–",note:""};
  if(score>=g.gPass){
    let i=0;
    if(list.length===1)i=0;else if(score>=g.gTop)i=list.length-1;else if(score>=g.gMid)i=Math.min(1,list.length-1);
    return {grade:list[i],note:"Memenuhi level "+level,ok:true};
  }
  const li=LEVELS.indexOf(level);
  if(li>0){const prev=bands[LEVELS[li-1]]||[];return {grade:prev[prev.length-1]||"–",note:"Belum memenuhi level "+level+" → disarankan level "+LEVELS[li-1],ok:false}}
  return {grade:"Belum memenuhi",note:"Belum memenuhi standar minimal",ok:false};
}
function kmbScore(k){if(!k||!Array.isArray(k.scores))return null;const v=k.scores.filter(x=>+x>0).map(Number);if(v.length<KMB_IND.length)return null;
  return Math.max(0,Math.min(100,v.reduce((a,b)=>a+b,0)/(KMB_IND.length*4)*100-(KMB_SP[+k.sp||0]||0)))}
function fpkParts(f){if(!f)return null;const A=(f.A||[]).filter(Boolean).map(x=>FPK_VAL[x]),B=(f.B||[]).filter(Boolean).map(x=>FPK_VAL[x]);
  if(A.length<FPK_A.length||B.length<FPK_B.length)return null;
  const nA=avg(A),nB=avg(B);
  const nC=Math.max(0,100-(+f.sakit||0)*2-(+f.izin||0)*3-(+f.alpa||0)*10);
  const nD=Math.max(0,100-(+f.teguran||0)*10-(+f.sp1||0)*20-(+f.sp2||0)*30-(+f.sp3||0)*40);
  const E=(f.E||[]).filter(x=>x&&x.v).map(x=>FPK_VAL[x.v]),F=(f.F||[]).filter(x=>x&&x.v).map(x=>FPK_VAL[x.v]);
  const base=(nA+nB)/2,nE=E.length?avg(E):base,nF=F.length?avg(F):base;
  return {nA,nB,nC,nD,nE,nF,total:nA*.3+nB*.3+nC*.15+nD*.15+nE*.05+nF*.05}}
function kinerjaScore(k){if(!k)return null;const parts=[];
  if(k.tpl==="KMB"||k.tpl==="Keduanya"){const s=kmbScore(k.kmb);if(s!=null)parts.push(s)}
  if(k.tpl==="FPK"||k.tpl==="Keduanya"){const p=fpkParts(k.fpk);if(p)parts.push(p.total)}
  return parts.length?avg(parts):null}
function calc(s){
  const now=Date.now();
  const atts=S.attempts.filter(a=>a.session_id===s.id);
  const mods=(s.module_ids||[]).map(id=>({m:S.modules.find(x=>x.id===id),a:atts.find(a=>a.module_id===id)})).filter(x=>x.m);
  const done=mods.filter(x=>x.a&&x.a.submitted_at);
  let status=done.length&&done.length===mods.length?"Selesai":atts.length?"Sedang":"Belum mulai";
  if(status!=="Selesai"&&s.expires_at&&new Date(s.expires_at).getTime()<now)status="Kedaluwarsa";
  const teknis=done.length?avg(done.map(x=>+x.a.score)):null;
  const topics={};done.forEach(x=>Object.entries(x.a.by_topic||{}).forEach(([t,v])=>{topics[t]=topics[t]||{benar:0,total:0};topics[t].benar+=+v.benar;topics[t].total+=+v.total}));
  const kin=kinerjaScore(s.kinerja);
  const g=setg();let akhir=null;
  if(teknis!=null)akhir=kin!=null?(teknis*g.wTeknis+kin*g.wKinerja)/((+g.wTeknis+ +g.wKinerja)||1):teknis;
  else if(kin!=null)akhir=kin;
  const cat=category(akhir);
  const grade=gradeRec(s.level,teknis);
  const rekAuto=cat?((s.jenis==="Akhir Kontrak"?g.rekKontrak:g.rekNew)[cat.k]||""):"";
  return {mods,done,status,teknis,topics,kin,akhir,cat,grade,rek:s.keputusan||rekAuto,rekAuto,late:done.some(x=>x.a.late),viol:atts.reduce((x,y)=>x+(+y.violations||0),0)}
}

    if(pw){r=await SB.auth.signInWithPassword({email:em,password:pw});if(r.error){m.textContent=/invalid/i.test(r.error.message)?"Email atau password salah.":"Gagal masuk: "+r.error.message;return}location.reload();return}
    r=await SB.auth.signInWithOtp({email:em,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});

async function boot(){
  if(!window.supabase?.createClient){document.body.innerHTML='<div class="gate"><div class="box">Gagal memuat layanan. Periksa koneksi internet lalu muat ulang.</div></div>';return}
  SB=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:!TOKEN,autoRefreshToken:!TOKEN,detectSessionInUrl:!TOKEN,storageKey:"kmb-psikotest-auth"}});
  if(TOKEN){return Exam.start()}
  const {data:{session}}=await SB.auth.getSession();
  USER=session?.user||null;
  if(!USER)return gate();
  const r=await SB.rpc("pk_role");ROLE=r.data||"none";
  if(!["owner","editor","viewer"].includes(ROLE))return gate("Email "+USER.email+" belum terdaftar untuk web Psikotest ini. Minta Pemilik menambahkan email Anda sebagai Editor atau Viewer.",false);
  await loadAll();renderShell();
  setInterval(()=>{if(!document.hidden&&$("modal").hidden)refresh()},30000);
}
async function q(p){const r=await p;if(r.error)throw r.error;return r.data}
async function loadAll(){
  const [m,s,a,st]=await Promise.all([
    q(SB.from("pk_modules").select("*").order("sort").order("created_at")),
    q(SB.from("pk_sessions").select("*").order("created_at",{ascending:false})),
    q(SB.from("pk_attempts").select("id,session_id,module_id,started_at,deadline,submitted_at,correct,total,score,by_topic,late,violations,events,device_id,cur_index")),
    q(SB.from("pk_settings").select("data").eq("id",1).maybeSingle())]);
  S.modules=m;S.sessions=s;S.attempts=a;const sd=st?.data||{};
  S.settings={...DEF,...sd,proctorDef:{...DEF.proctorDef,...(sd.proctorDef||{})},timerDef:{...DEF.timerDef,...(sd.timerDef||{})},
    perms:{editor:{...DEF.perms.editor,...(sd.perms?.editor||{})},viewer:{...DEF.perms.viewer,...(sd.perms?.viewer||{})}}};
  if(canEdit()){const qc=await q(SB.from("pk_questions").select("module_id"));S.qcount={};qc.forEach(x=>S.qcount[x.module_id]=(S.qcount[x.module_id]||0)+1)}
}

function resetBox(s){const c=calc(s);if(!c.mods.length)return"";
  return `<div class="card" style="margin-top:12px"><h3>Status per sheet</h3><p class="small muted" style="margin:0 0 6px">Waktu: ${TIMER_LABEL[s.timer_mode||"total"]}${s.timer_mode&&s.timer_mode!=="total"?" · "+s.per_q_sec+" detik/soal":s.total_min?" · "+s.total_min+" menit":""}</p>${c.mods.map(x=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span><b>${esc(x.m.title)}</b><br><span class="small muted">${x.a?(x.a.submitted_at?"Selesai "+fdt(x.a.submitted_at)+" · nilai "+fmt(x.a.score):"Mulai "+fdt(x.a.started_at)):"Belum dimulai"}${x.a&&x.a.violations?" · "+x.a.violations+" pelanggaran":""}</span></span><span class="row">${x.a&&!x.a.submitted_at&&x.a.device_id?`<button class="btn sm" onclick="resetDevice('${x.a.id}')">Izinkan perangkat lain</button>`:""}${x.a&&can("hapus")?`<button class="btn sm dan" onclick="resetAttempt('${x.a.id}')">Ulangi sheet</button>`:""}</span></div>`).join("")}</div>`}
window.resetAttempt=async id=>{if(!confirm("Hapus jawaban sheet ini agar peserta bisa mengulang dari awal?"))return;try{await q(SB.from("pk_attempts").delete().eq("id",id));S.attempts=S.attempts.filter(a=>a.id!==id);closeModal();renderTab();toast("Sheet direset");syncDrive()}catch(e){toast("Gagal: "+e.message)}};
window.resetDevice=async id=>{try{await q(SB.from("pk_attempts").update({device_id:null}).eq("id",id));const a=S.attempts.find(x=>x.id===id);if(a)a.device_id=null;closeModal();toast("Peserta bisa melanjutkan dari perangkat lain")}catch(e){toast("Gagal: "+e.message)}};

/* ====================== SHEET HASIL ====================== */
function resultRows(){return S.sessions.map(s=>({s,c:calc(s)}))}
function vHasil(m){
  m.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2>Sheet Hasil Psikotest</h2><p class="sub">Semua jawaban peserta masuk otomatis ke sini. Klik baris untuk resume lengkap.</p></div>
   <div class="row"><button class="btn" id="hRef">Muat ulang</button>${S.settings.gasUrl&&canEdit()?'<button class="btn" id="hSync">Sinkron ke Google Sheet</button>':""}<button class="btn pri" id="hXls">Unduh Excel</button></div></div>
   <div class="row" style="margin-bottom:10px"><input id="hQ" placeholder="Cari nama / NIK / posisi" style="flex:1;min-width:180px">
    <select id="hJ"><option value="">Semua jenis</option><option>New Hire</option><option>Akhir Kontrak</option></select>
    <select id="hL"><option value="">Semua level</option>${LEVELS.map(l=>`<option>${l}</option>`).join("")}</select>
    <select id="hK"><option value="">Semua kategori</option>${setg().cat.map(c=>`<option value="${c.k}">${esc(c.label)}</option>`).join("")}</select>
    <select id="hS"><option value="">Semua status</option><option>Selesai</option><option>Sedang</option><option>Belum mulai</option><option>Kedaluwarsa</option></select></div>
   <div class="sheet-wrap"><table class="sheet" id="hT"></table></div><p class="small muted" id="hInfo"></p></div>`;
  const draw=()=>{const k=$("hQ").value.toLowerCase(),j=$("hJ").value,l=$("hL").value,ka=$("hK").value,st=$("hS").value;

     <tbody>${rows.map(({s,c},i)=>`<tr data-id="${s.id}"><td class="num">${i+1}</td><td>${fdate(s.created_at)}</td><td><b>${esc(s.nama)}</b></td><td>${showNik()?esc(s.nik||""):"•••"}</td><td>${esc(s.jenis)}</td><td>${esc(s.posisi||"")}</td><td>${esc(s.level||"")}</td><td>${esc(s.jobsite||"")}</td>
      ${mods.map(x=>{const a=c.mods.find(y=>y.m.id===x.id);return `<td class="num">${a?(a.a?.submitted_at?fmt(a.a.score)+(a.a.late?" ⏱":""):a.a?"…":"–"):""}</td>`}).join("")}
      <td class="num">${fmt(c.teknis)}</td><td class="num">${fmt(c.kin)}</td><td class="num"><b>${fmt(c.akhir)}</b></td>
      <td>${catChip(c.cat)}</td><td class="num">${c.cat?(+c.cat.b).toFixed(2).replace(".",","):"–"}</td><td>${esc(c.grade.grade)}</td><td>${esc(c.rek||"–")}</td><td class="num">${c.viol||""}</td><td><span class="chip st-${c.status.split(" ")[0]}">${c.status}</span></td></tr>`).join("")||`<tr><td colspan="${19+mods.length}" class="empty">Belum ada data.</td></tr>`}</tbody>`;
    $("hInfo").textContent=rows.length+" baris · ⏱ = waktu habis, jawaban yang tersimpan dinilai otomatis";
    if(canEdit()||can("resume"))$("hT").querySelectorAll("tr[data-id]").forEach(tr=>tr.onclick=()=>showResume(tr.dataset.id));};
  ["hQ","hJ","hL","hK","hS"].forEach(id=>$(id).oninput=draw);draw();HDRAW=()=>{if($("hT"))draw()};
  $("hRef").onclick=async()=>{await refresh();toast("Data diperbarui")};if($("hSync"))$("hSync").onclick=async()=>{toast("Menyinkronkan ke Google Sheet…");try{const r=await gasPost("sync",{});toast(r.ok?"Google Sheet diperbarui":"Gagal: "+r.error,4000)}catch(e){toast("Gagal: "+e.message,4000)}};
  $("hXls").onclick=exportXlsx;if(!can("excel"))$("hXls").hidden=true;

function exportXlsx(){
  if(!window.XLSX)return toast("Pustaka Excel belum termuat");
  const rows=resultRows();const mods=S.modules;
  const main=rows.map(({s,c},i)=>{const o={No:i+1,Tanggal:fdate(s.created_at),Nama:s.nama,NIK:showNik()?(s.nik||""):"",Jenis:s.jenis,Posisi:s.posisi||"",Level:s.level||"","Grade Saat Ini":s.grade_saat_ini||"",Jobsite:s.jobsite||""};
    mods.forEach(x=>{const a=c.mods.find(y=>y.m.id===x.id);o[x.title]=a&&a.a?.submitted_at?+(+a.a.score).toFixed(1):""});
    Object.assign(o,{"Nilai Teknis":c.teknis!=null?+c.teknis.toFixed(1):"","Nilai Kinerja":c.kin!=null?+c.kin.toFixed(1):"","Nilai Akhir":c.akhir!=null?+c.akhir.toFixed(1):"",Huruf:c.cat?c.cat.h:"",Bobot:c.cat?+(+c.cat.b).toFixed(2):"",Kategori:c.cat?c.cat.label:"","Rekomendasi Grade":c.grade.grade,"Keterangan Grade":c.grade.note,Rekomendasi:c.rek||"",Pelanggaran:c.viol,Status:c.status,"Kelebihan":s.kinerja?.kelebihan||"","Perlu Ditingkatkan":s.kinerja?.kekurangan||"",Catatan:s.catatan||""});return o});
  const topics=[...new Set(rows.flatMap(r=>Object.keys(r.c.topics)))];
  const tp=rows.filter(r=>r.c.done.length).map(({s,c})=>{const o={Nama:s.nama,Posisi:s.posisi||""};topics.forEach(t=>{const v=c.topics[t];o[t]=v&&v.total?+(100*v.benar/v.total).toFixed(0):""});return o});
  const wb=XLSX.utils.book_new();
  const ws1=XLSX.utils.json_to_sheet(main);ws1["!cols"]=Object.keys(main[0]||{No:1}).map(k=>({wch:Math.max(8,Math.min(40,k.length+4))}));
  XLSX.utils.book_append_sheet(wb,ws1,"Hasil Psikotest");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tp.length?tp:[{Info:"Belum ada data"}]),"Nilai per Topik (%)");
  const ref=scaleRows().map((r,i)=>{const c=setg().cat.find(x=>x.k===r.k)||{};return {Skor:r.min+" - "+scaleMax(i),Huruf:r.h,Bobot:r.b,Kategori:c.label,"Rekomendasi Akhir Kontrak":setg().rekKontrak[r.k],"Rekomendasi New Hire":setg().rekNew[r.k]}});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ref),"Kategori");
  XLSX.writeFile(wb,"Hasil_Psikotest_Mekanik_"+new Date().toISOString().slice(0,10)+".xlsx");
}

   <div style="display:flex;gap:16px;align-items:center;justify-content:flex-end;flex-wrap:wrap"><div class="right"><div class="small muted">Nilai akhir</div><div class="score-big">${fmt(c.akhir)}</div></div>
    <div>${c.cat?catChip(c.cat,true)+`<div class="small muted" style="margin-top:4px">Nilai huruf <b>${esc(c.cat.h)}</b> · bobot <b>${(+c.cat.b).toFixed(2).replace(".",",")}</b></div>`:'<span class="chip">Belum ada nilai</span>'}<div style="margin-top:8px"><b>Rekomendasi grade:</b> ${esc(c.grade.grade)}<br><span class="small muted">${esc(c.grade.note)}</span></div></div></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>Rekomendasi</h3><div style="font-size:15px;font-weight:700;color:var(--p2)">${esc(c.rek||"–")}</div>${s.keputusan?`<div class="small muted">Keputusan diisi manual oleh Editor (otomatis: ${esc(c.rekAuto||"–")})</div>`:""}
   ${can("kinerja")?`<div class="row noprint" style="margin-top:8px"><input id="rKep" placeholder="Ubah keputusan akhir (opsional)" value="${esc(s.keputusan||"")}" style="flex:1"><button class="btn sm pri" id="rKepS">Simpan</button></div>`:""}</div>
  <div class="grid g2">
   <div class="card"><h3>Nilai per sheet tes</h3>${c.mods.map(x=>`<div class="hbar"><span>${esc(x.m.title)}</span><div class="bar ${x.a?.submitted_at?cls(x.a.score):""}"><i style="width:${x.a?.submitted_at?x.a.score:0}%"></i></div><b class="right">${x.a?.submitted_at?fmt(x.a.score):"–"}</b></div>${x.a?.submitted_at?`<div class="small muted" style="margin:-4px 0 6px">${x.a.correct}/${x.a.total} benar · ${fdt(x.a.submitted_at)}${x.a.late?" · waktu habis":""}</div>`:""}`).join("")||'<div class="muted">Tidak ada sheet.</div>'}

    <b>Nilai kinerja</b><span><b>${fmt(c.kin)}</b> (bobot ${g.wKinerja}% · tes teknis ${g.wTeknis}%)</span></div>${k.catatan?`<p class="small" style="margin:8px 0 0"><b>Catatan:</b> ${esc(k.catatan)}</p>`:""}`}</div>

function proctorCard(s,c){
  const pr=s.proctor||{};const atts=c.mods.filter(x=>x.a);
  const evs=atts.flatMap(x=>(x.a.events||[]).map(e=>({...e,sheet:x.m.title}))).sort((a,b)=>new Date(a.t)-new Date(b.t));
  const pel=evs.filter(e=>["tab","fullscreen","kamera","auto-kirim"].includes(e.type));
  const foto=evs.filter(e=>e.type==="foto").map(e=>{const [k,u]=String(e.d).split("|");return {k,u,t:e.t}});
  const LBL={tab:"Keluar dari halaman tes",fullscreen:"Keluar layar penuh",kamera:"Kamera mati / ditolak","auto-kirim":"Tes dikirim otomatis (melebihi batas)"};
  const on=[pr.camera&&"kamera",pr.fullscreen&&"layar penuh",pr.tabLimit?"batas "+pr.tabLimit+" pelanggaran":"pelanggaran dicatat",pr.copyBlock&&"blok salin",pr.shuffle&&"soal diacak",pr.shuffleOpt&&"pilihan diacak"].filter(Boolean).join(" · ");
  return `<div class="card"><h3>Pengawasan tes</h3><p class="small muted" style="margin:0 0 8px">Waktu: ${TIMER_LABEL[s.timer_mode||"total"]}${s.timer_mode&&s.timer_mode!=="total"?" ("+s.per_q_sec+" dtk/soal)":""} · ${esc(on||"tanpa pengawasan khusus")}</p>
   <div class="row" style="gap:16px;margin-bottom:8px"><span><b style="font-size:20px;color:${pel.length?"var(--bad)":"var(--ok)"}">${c.viol||0}</b> pelanggaran</span><span><b style="font-size:20px">${foto.length}</b> foto tersimpan di Drive</span></div>
   ${pel.length?`<ul class="small" style="margin:0 0 8px;padding-left:18px">${pel.map(e=>`<li>${new Date(e.t).toLocaleTimeString("id-ID")} – ${esc(LBL[e.type]||e.type)}${e.d?" ("+esc(e.d)+")":""} · <span class="muted">${esc(e.sheet)}</span></li>`).join("")}</ul>`:'<p class="small muted" style="margin:0 0 8px">Tidak ada pelanggaran tercatat.</p>'}
   ${foto.length?`<div class="row small">${foto.slice(0,3).concat(foto.length>3?[foto[foto.length-1]]:[]).map(f=>`<a class="btn sm" target="_blank" rel="noopener" href="${esc(f.u)}">${esc(f.k)} ${new Date(f.t).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}</a>`).join("")}<span class="muted">Semua foto ada di folder Drive "Psikotest Mekanik KMB / Foto Peserta".</span></div>`:""}</div>`}

/* ====================== PENILAIAN KINERJA ====================== */

  k.kmb=k.kmb||{scores:[],sp:0};k.fpk=k.fpk||{A:[],B:[],E:[],F:[]};k.fpk.E=k.fpk.E||[];k.fpk.F=k.fpk.F||[];

  <div id="kKMB" class="card" style="margin-top:12px"><h3>Formulir Penilaian Kinerja KMB</h3><p class="sub">4 = Sangat Baik · 3 = Baik · 2 = Kurang Baik · 1 = Buruk. Nilai = total ÷ 40 × 100, dikurangi SP (SP1 −7,5 · SP2 −12,5 · SP3 −17,5).</p>

function shrinkImage(file,max=900){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

async function importExcel(file){

    const norm=o=>{const r={};Object.entries(o).forEach(([k,v])=>r[String(k).trim().toLowerCase()]=String(v).trim());return r};
    const list=rows.map(norm).filter(r=>r.soal&&r.kunci).map((r,i)=>{const options={};["a","b","c","d","e"].forEach(l=>{if(r[l])options[l]=r[l]});return {no:+r.no||i+1,text:r.soal,options,answer:r.kunci.toLowerCase().charAt(0),topic:r.topik||null}}).filter(x=>x.options[x.answer]);

}

    const d=r.data;let local={};try{local=JSON.parse(localStorage.getItem("pk-ans-"+TOKEN+"-"+mid)||"{}")}catch(e){}
    this.cur={mid,mode:d.mode,title:d.title,n:d.n,offset:new Date(d.server_now).getTime()-Date.now(),deadline:new Date(d.deadline).getTime(),dirty:false,sending:false,viol:d.violations||0};
    if(d.mode==="total"){Object.assign(this.cur,{qs:d.questions||[],ans:{...(d.answers||{}),...local},i:0});this.saver=setInterval(()=>this.save(),8000)}
    else this.applyPer(d);
    if(this.pendingId){this.sendPhoto("selfie",mid,this.pendingId.selfie);this.sendPhoto("identitas",mid,this.pendingId.id);this.pendingId=null}
    this.guard(true);this.render();this.tick=setInterval(()=>this.clock(),500);this.clock()},
  applyPer(d){Object.assign(this.cur,{q:d.question,index:d.index,qDeadline:new Date(d.q_deadline).getTime(),sel:null,busy:false,offset:new Date(d.server_now).getTime()-Date.now()})},
  guard(on){const pr=this.pr();
    if(!this._h)this._h={
      vis:()=>{if(document.hidden&&this.cur)this.violate("tab","meninggalkan halaman tes")},
      fs:()=>{if(this.cur&&pr.fullscreen&&FS_OK&&!this.inFs())this.violate("fullscreen","keluar dari layar penuh")},
      block:e=>{if(this.cur&&this.pr().copyBlock)e.preventDefault()}};
    const H=this._h;const m=on?"addEventListener":"removeEventListener";
    document[m]("visibilitychange",H.vis);document[m]("fullscreenchange",H.fs);document[m]("webkitfullscreenchange",H.fs);
    ["copy","cut","contextmenu","selectstart"].forEach(ev=>document[m](ev,H.block));
    document.body.classList.toggle("noselect",on&&!!pr.copyBlock);
    let wm=$("wm");if(on&&pr.copyBlock){if(!wm){wm=document.createElement("div");wm.id="wm";wm.className="wm";document.body.appendChild(wm)}wm.innerHTML=Array(80).fill(`<span>${esc(this.info.nama)}${this.info.nik?" · "+esc(this.info.nik):""}</span>`).join("")}else if(wm)wm.remove();
    clearInterval(this.photoT);if(on&&pr.camera){this.photoT=setInterval(()=>{if(this.cur){if(!this.stream||!this.stream.active)this.violate("kamera","kamera tidak aktif");else this.sendPhoto("berkala",this.cur.mid)}},Math.max(10,+pr.photoSec||30)*1000);setTimeout(()=>this.cur&&this.sendPhoto("mulai",this.cur.mid),2500)}},
  async violate(type,detail){const now=Date.now();if(now-this.lastV<2500||!this.cur||this.cur.sending)return;this.lastV=now;
    const mid=this.cur.mid;const r=await SB.rpc("pk_log_event",{p_token:TOKEN,p_module:mid,p_type:type,p_detail:detail});
    if(type!=="kamera")this.sendPhoto("pelanggaran",mid);
    const v=r.data||{};if(v.submitted)return this.end("Tes dihentikan dan jawaban dikirim otomatis karena pelanggaran melebihi batas.");
    if(this.cur)this.cur.viol=v.violations;const lim=v.limit;
    openModal(`<div class="head"><h2>⚠️ Pelanggaran tercatat</h2></div><p>${type==="fullscreen"?"Anda keluar dari layar penuh.":type==="kamera"?"Kamera tidak aktif. Kamera wajib menyala selama tes.":"Anda meninggalkan halaman tes."} Ini pelanggaran ke-<b>${v.violations||"?"}</b>${lim?` dari batas <b>${lim}</b>. Pelanggaran berikutnya setelah batas akan mengakhiri tes.`:"."}</p><div class="row" style="justify-content:flex-end"><button class="btn pri" id="vOk">${type==="fullscreen"?"Kembali ke layar penuh":type==="kamera"?"Nyalakan kamera":"Lanjutkan tes"}</button></div>`);
    $("vOk").onclick=async()=>{closeModal();if(this.pr().fullscreen)this.enterFs();if(type==="kamera")await this.camOn()}},
  end(msg){this.stop();this.camOff();$("app").innerHTML=`<div class="gate"><div class="box"><h1>Tes berakhir</h1><p>${esc(msg)}</p><button class="btn pri" id="bk">Kembali</button></div></div>`;$("bk").onclick=()=>this.start()},
  stop(){clearInterval(this.tick);clearInterval(this.saver);this.guard(false);this.cur=null;closeModal();try{if(this.inFs())(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}},
  render(){this.cur.mode==="total"?this.renderTotal():this.renderPer()},
  optsHtml(qq,sel){return this.optOrder(qq).map((l,i)=>`<button class="opt ${sel===l?"sel":""}" data-l="${l}"><span class="l">${String.fromCharCode(65+i)}</span><span>${esc(qq.options[l])}</span></button>`).join("")},
  topBar(sub){return `<div class="exam-top"><div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(this.cur.title)}</b><span class="save-ind" id="sv">${sub}</span></div>${this.cur.viol?`<span class="chip st-Kedaluwarsa" title="Pelanggaran">⚠ ${this.cur.viol}</span>`:""}<div class="timer" id="tm">--:--</div></div>`},
  renderTotal(){const c=this.cur,qq=c.qs[c.i];const answered=Object.keys(c.ans).filter(k=>c.qs.some(x=>x.id===k)).length;
    $("app").innerHTML=this.topBar(`${answered}/${c.qs.length} terjawab · sisa waktu sheet`)+`
    <div style="padding:0 12px"><div class="q-card"><div class="small muted">Soal ${c.i+1} dari ${c.qs.length}</div><div class="qtext">${esc(qq.text)}</div>${qq.image?`<img src="${qq.image}" alt="Gambar soal" draggable="false">`:""}
     ${this.optsHtml(qq,c.ans[qq.id])}
     <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn" id="pv" ${c.i?"":"disabled"}>‹ Sebelumnya</button>${c.i<c.qs.length-1?'<button class="btn pri" id="nx">Berikutnya ›</button>':'<button class="btn pri" id="fin">Selesai & kirim</button>'}</div></div>
     <div class="nav-grid">${c.qs.map((x,i)=>`<button data-i="${i}" class="${c.ans[x.id]?"ans":""} ${i===c.i?"cur":""}">${i+1}</button>`).join("")}</div>
     <div style="text-align:center;margin-bottom:30px"><button class="btn" id="fin2">Selesai & kirim jawaban</button></div></div>`;
    $("app").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{c.ans[qq.id]=b.dataset.l;c.dirty=true;try{localStorage.setItem("pk-ans-"+TOKEN+"-"+c.mid,JSON.stringify(c.ans))}catch(e){}
      if(c.i<c.qs.length-1)c.i++;this.render();window.scrollTo(0,0)});
    const pv=$("pv");if(pv)pv.onclick=()=>{c.i--;this.render()};const nx=$("nx");if(nx)nx.onclick=()=>{c.i++;this.render();window.scrollTo(0,0)};
    $("app").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{c.i=+b.dataset.i;this.render();window.scrollTo(0,0)});
    const fin=()=>{const left=c.qs.length-Object.keys(c.ans).filter(k=>c.qs.some(x=>x.id===k)).length;
      openModal(`<div class="head"><h2>Kirim jawaban?</h2></div><p>${left?`Masih ada <b>${left} soal</b> yang belum dijawab.`:"Semua soal sudah dijawab."} Setelah dikirim, jawaban tidak bisa diubah.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Kembali</button><button class="btn pri" id="ok">Kirim sekarang</button></div>`);
      $("ok").onclick=()=>{closeModal();this.submit(false)}};
    const f1=$("fin");if(f1)f1.onclick=fin;$("fin2").onclick=fin;this.clock()},
  renderPer(){const c=this.cur,qq=c.q;if(!qq)return;
    $("app").innerHTML=this.topBar(`Soal ${c.index+1} dari ${c.n} · tidak bisa kembali`)+`
    <div style="padding:0 12px"><div class="q-card"><div class="row" style="justify-content:space-between"><span class="small muted">Soal ${c.index+1} dari ${c.n}</span><b id="qt" class="small">--</b></div><div class="bar" style="margin:6px 0 10px"><i id="qbar" style="width:100%"></i></div>
     <div class="qtext">${esc(qq.text)}</div>${qq.image?`<img src="${qq.image}" alt="Gambar soal" draggable="false">`:""}
     ${this.optsHtml(qq,c.sel)}
     <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="nxq" ${c.busy?"disabled":""}>${c.index+1<c.n?"Kirim & lanjut ›":"Kirim & selesai"}</button></div></div>
     <div class="bar" style="max-width:820px;margin:0 auto 30px"><i style="width:${100*c.index/c.n}%"></i></div></div>`;
    c.qTotal=c.qTotal||Math.max(1,c.qDeadline-(Date.now()+c.offset));
    $("app").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{c.sel=b.dataset.l;$("app").querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b))});
    $("nxq").onclick=()=>{if(!c.sel)return openModal(`<div class="head"><h2>Belum memilih jawaban</h2></div><p>Lanjut tanpa menjawab soal ini? Anda tidak bisa kembali.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Kembali</button><button class="btn pri" id="ok">Lewati</button></div>`),$("ok").onclick=()=>{closeModal();this.answer()};this.answer()};
    this.clock()},
  async answer(){const c=this.cur;if(!c||c.busy)return;c.busy=true;const b=$("nxq");if(b)b.disabled=true;
    for(let k=0;k<4;k++){const r=await SB.rpc("pk_answer_q",{p_token:TOKEN,p_module:c.mid,p_qid:c.q.id,p_answer:c.sel,p_device:DEVICE});
      if(!r.error){if(r.data.status==="selesai")return this.done();this.applyPer(r.data);c.qTotal=null;this.renderPer();window.scrollTo(0,0);return}
      if(/perangkat lain|kedaluwarsa|tidak ditemukan/i.test(r.error.message))return this.end(r.error.message);
      await new Promise(s=>setTimeout(s,1500))}
    c.busy=false;toast("Koneksi bermasalah, mencoba lagi…");if(b)b.disabled=false},
  clock(){const c=this.cur;if(!c)return;const now=Date.now()+c.offset;const fmtT=s=>(s>=3600?Math.floor(s/3600)+":":"")+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    const left=Math.max(0,Math.floor((c.deadline-now)/1000));const t=$("tm");
    if(c.mode==="total"){if(t){t.textContent=fmtT(left);t.classList.toggle("low",left<=60)}if(left<=0&&!c.sending)this.submit(true);return}
    const ql=Math.max(0,c.qDeadline-now),qs=Math.ceil(ql/1000);
    if(t){t.textContent=fmtT(qs);t.classList.toggle("low",qs<=10)}const qt=$("qt");if(qt)qt.textContent="sisa waktu soal "+fmtT(qs);
    const bar=$("qbar");if(bar&&c.qTotal){bar.style.width=Math.max(0,100*ql/c.qTotal)+"%";bar.parentElement.className="bar "+(qs<=10?"r":qs<=20?"y":"")}
    if(ql<=0&&!c.busy){closeModal();this.answer()}},
  async save(){const c=this.cur;if(!c||c.mode!=="total"||!c.dirty||c.sending)return;c.dirty=false;const r=await SB.rpc("pk_save_answers",{p_token:TOKEN,p_module:c.mid,p_answers:c.ans});const sv=$("sv");if(r.error){c.dirty=true;if(sv)sv.textContent="Gagal menyimpan, mencoba lagi…"}},
  async submit(auto){const c=this.cur;if(!c||c.sending)return;c.sending=true;
    $("app").innerHTML=`<div class="gate"><div class="box"><h1>${auto?"Waktu habis":"Mengirim jawaban…"}</h1><p class="muted">Jawaban sedang dikirim, jangan tutup halaman.</p></div></div>`;
    for(let k=0;k<5;k++){const r=await SB.rpc("pk_submit_module",{p_token:TOKEN,p_module:c.mid,p_answers:c.ans});if(!r.error){try{localStorage.removeItem("pk-ans-"+TOKEN+"-"+c.mid)}catch(e){}return this.done()}await new Promise(s=>setTimeout(s,2000))}
    $("app").innerHTML=`<div class="gate"><div class="box"><h1>Gagal mengirim</h1><p>Periksa koneksi internet lalu tekan tombol di bawah. Jawaban Anda tersimpan di perangkat ini.</p><button class="btn pri" id="rt">Kirim ulang</button></div></div>`;
    $("rt").onclick=()=>{c.sending=false;this.submit(auto)}},
  done(){const url=this.info.gas_url;this.stop();toast("Jawaban terkirim");if(url)fetch(url,{method:"POST",body:JSON.stringify({action:"sync"})}).catch(()=>{});this.start()}
};
window.addEventListener("beforeunload",()=>{if(Exam.cur&&!Exam.cur.sending)Exam.save()});
window.closeModal=closeModal;
boot().catch(e=>{console.error(e);document.getElementById("app").innerHTML='<div class="gate"><div class="box"><h1>Terjadi kesalahan</h1><p>'+esc(e.message||e)+'</p></div></div>'});
</script>
</body>
