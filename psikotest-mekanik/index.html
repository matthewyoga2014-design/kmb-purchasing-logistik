<script>
"use strict";
const SUPA={url:"https://yoviojbfyvgpllxisjvy.supabase.co",key:"sb_publishable_I26enb2Kz8iF4WFdH8vixA_8kek-kM9"};
const OWNER="matthewyoga2014@gmail.com";
const TOKEN=new URLSearchParams(location.search).get("t");
const LEVELS=["Helper","Junior","Middle","Senior","Supervisor"];
const POSISI=[["Helper Mekanik","Helper"],["Junior Mekanik","Junior"],["Middle Mekanik","Middle"],["Pengawas / Foreman","Middle"],["Senior Mekanik","Senior"],["Supervisor Plant","Supervisor"]];
const DEF={wTeknis:60,wKinerja:40,gTop:81,gMid:66,gPass:56,showScore:false,linkDays:7,
  cat:[{k:"A",min:81,label:"Sangat Baik"},{k:"B",min:66,label:"Baik"},{k:"C",min:56,label:"Cukup"},{k:"D",min:41,label:"Kurang"},{k:"E",min:0,label:"Sangat Kurang"}],
  scale:[{min:86,h:"A",b:4,k:"A"},{min:81,h:"A-",b:3.67,k:"A"},{min:76,h:"B+",b:3.33,k:"B"},{min:71,h:"B",b:3,k:"B"},{min:66,h:"B-",b:2.67,k:"B"},{min:61,h:"C+",b:2.33,k:"C"},{min:56,h:"C",b:2,k:"C"},{min:41,h:"D",b:1,k:"D"},{min:0,h:"E",b:0,k:"E"}],
  bands:{Helper:["Helper"],Junior:["G1","G2","G3"],Middle:["G4","G5","G6"],Senior:["G7","G8","G9"],Supervisor:["G10"]},
  rekKontrak:{A:"Angkat karyawan tetap / layak naik grade",B:"Perpanjang kontrak",C:"Perpanjang kontrak dengan pembinaan",D:"Perpanjang singkat dengan evaluasi ketat",E:"Tidak diperpanjang"},
  rekNew:{A:"Diterima",B:"Diterima",C:"Dipertimbangkan (perlu pembinaan)",D:"Tidak direkomendasikan",E:"Tidak direkomendasikan"},
  gasUrl:"",
  proctorDef:{camera:true,photoSec:30,tabLimit:3,fullscreen:true,copyBlock:true,shuffle:false,shuffleOpt:true},
  timerDef:{mode:"total",perQ:60},
  perms:{editor:{link:true,bank:true,kinerja:true,hapus:true,pengaturan:true},viewer:{resume:true,excel:true,nik:true}}};
const TIMER_LABEL={total:"Total per sheet",per_soal:"Sama rata per soal",custom:"Berbeda tiap soal"};

let SB=null,ROLE="none",USER=null,TAB="kirim",BANKSEL=null;
let S={modules:[],sessions:[],attempts:[],kinerja:[],settings:{...DEF},questions:{}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(n,d=1)=>n==null||isNaN(n)?"–":(+n).toFixed(d).replace(".",",");
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const fdate=d=>d?new Date(d).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}):"–";
const fdt=d=>d?new Date(d).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"–";
const canEdit=()=>ROLE==="owner"||ROLE==="editor";
const ROLE_CAN={editor:{link:1,kinerja:1,hapus:1,resume:1,excel:1,nik:1},viewer:{resume:1,excel:1,nik:1}};
function can(p){if(ROLE==="owner")return true;return !!(ROLE_CAN[ROLE]||{})[p]}
const showNik=()=>ROLE!=="viewer"||can("nik");
const fsec=s=>s>=3600?Math.floor(s/3600)+" jam "+Math.round(s%3600/60)+" mnt":s>=60?Math.round(s/60)+" menit":s+" detik";
async function gasPost(action,data){const url=S.settings.gasUrl||(Exam.info&&Exam.info.gas_url);if(!url)throw new Error("URL Apps Script belum diatur");
  const r=await fetch(url,{method:"POST",body:JSON.stringify({action,...data})});return r.json()}
function syncDrive(){if(S.settings.gasUrl)gasPost("sync",{}).catch(()=>{})}
function toast(m,ms=2600){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function openModal(html){$("mbox").innerHTML=html;$("modal").hidden=false;$("modal").scrollTop=0}
function closeModal(){$("modal").hidden=true;$("mbox").innerHTML="";document.body.classList.remove("printing")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
async function copyText(t){try{await navigator.clipboard.writeText(t);toast("Link disalin")}catch(e){prompt("Salin link ini:",t)}}
function linkFor(s){return location.origin+location.pathname+"?t="+s.token}

/* ====================== KALKULASI ====================== */
function setg(){return S.settings}
function scaleRows(){return [...(setg().scale||DEF.scale)].sort((a,b)=>b.min-a.min)}
function letterOf(score){if(score==null)return null;const r=scaleRows();return r.find(x=>score>=x.min)||r[r.length-1]}
function scaleMax(i){const r=scaleRows();return i===0?100:r[i-1].min-1}
function catMin(k){const r=scaleRows().filter(x=>x.k===k);return r.length?Math.min(...r.map(x=>x.min)):0}
function category(score){const L=letterOf(score);if(!L)return null;const c=setg().cat.find(x=>x.k===L.k)||setg().cat[setg().cat.length-1];return {...c,min:catMin(c.k),h:L.h,b:L.b}}
const catChip=(c,big)=>c?`<span class="chip cat-${c.k}"${big?' style="font-size:15px;padding:6px 12px"':""}>${esc(c.h)} · ${esc(c.label)}</span>`:"–";
function gradeRec(level,score){
  if(score==null||!level)return {grade:"–",note:""};
  const g=setg(),bands=g.bands,list=bands[level]||[];
  if(!list.length)return {grade:"–",note:""};
  if(score>=g.gPass){
    let i=0;
    if(list.length===1)i=0;else if(score>=g.gTop)i=list.length-1;else if(score>=g.gMid)i=Math.min(1,list.length-1);
    return {grade:list[i],note:"Memenuhi level "+level,ok:true};
  }
  const li=LEVELS.indexOf(level);
  if(li>0){const prev=bands[LEVELS[li-1]]||[];return {grade:prev[prev.length-1]||"–",note:"Belum memenuhi level "+level+" → disarankan level "+LEVELS[li-1],ok:false}}
  return {grade:"Belum memenuhi",note:"Belum memenuhi standar minimal",ok:false};
}
function calc(s){
  const now=Date.now();
  const atts=S.attempts.filter(a=>a.session_id===s.id);
  const mods=(s.module_ids||[]).map(id=>({m:S.modules.find(x=>x.id===id),a:atts.find(a=>a.module_id===id)})).filter(x=>x.m);
  const done=mods.filter(x=>x.a&&x.a.submitted_at);
  let status=done.length&&done.length===mods.length?"Selesai":atts.length?"Sedang":"Belum mulai";
  if(status!=="Selesai"&&s.expires_at&&new Date(s.expires_at).getTime()<now)status="Kedaluwarsa";
  const teknis=done.length?avg(done.map(x=>+x.a.score)):null;
  const topics={};done.forEach(x=>Object.entries(x.a.by_topic||{}).forEach(([t,v])=>{topics[t]=topics[t]||{benar:0,total:0};topics[t].benar+=+v.benar;topics[t].total+=+v.total}));
  const kin=null;
  const g=setg();let akhir=null;
  if(teknis!=null)akhir=kin!=null?(teknis*g.wTeknis+kin*g.wKinerja)/((+g.wTeknis+ +g.wKinerja)||1):teknis;
  else if(kin!=null)akhir=kin;
  const cat=category(akhir);
  const grade=s.grade_target?(teknis==null?{grade:"–",note:""}:teknis>=g.gPass?{grade:"Lulus "+s.grade_target,note:"Nilai teknis "+fmt(teknis)+" ≥ batas lulus "+g.gPass,ok:true}:{grade:"Tidak lulus "+s.grade_target,note:"Nilai teknis "+fmt(teknis)+" < batas lulus "+g.gPass,ok:false}):gradeRec(s.level,teknis);
  const rekAuto=cat?((s.jenis==="Akhir Kontrak"?g.rekKontrak:g.rekNew)[cat.k]||""):"";
  return {mods,done,status,teknis,topics,kin,akhir,cat,grade,rek:s.keputusan||rekAuto,rekAuto,late:done.some(x=>x.a.late),viol:atts.reduce((x,y)=>x+(+y.violations||0),0)}
}

/* ====================== AUTH / GATE ====================== */
function gate(msg,showForm=true){
  $("app").innerHTML=`<div class="gate"><div class="box">
   <div class="logo" style="background:var(--p);color:#fff">PT</div>
   <h1>Psikotest & Uji Kompetensi Mekanik</h1>
   <p class="sub">PT Karunia Mandiri Berkarya · Plant Tambang. Masuk sebagai Editor atau Viewer.</p>
   ${showForm?`<form id="gF"><label class="f">Email<input type="email" id="gE" required autocomplete="email" placeholder="nama@email.com"></label>
   <label class="f">Password <span class="small" style="font-weight:400">(kosongkan untuk menerima kode lewat email)</span><input type="password" id="gP" autocomplete="current-password"></label>
   <div id="gOtp" hidden><label class="f">Kode 6 angka dari email<input id="gC" inputmode="numeric" maxlength="8" placeholder="123456"></label></div>
   <button class="btn pri" type="submit" id="gB">Masuk</button></form>`:""}
   <p class="small muted" id="gM" style="margin-top:10px">${msg||"Peserta tes tidak perlu login. Gunakan link tes yang dikirim HR."}</p>
   ${USER?`<button class="btn sm" id="gOut">Keluar dari ${esc(USER.email)}</button>`:""}
  </div></div>`;
  const f=$("gF");let otpSent=false;
  if(f)f.onsubmit=async e=>{e.preventDefault();const em=$("gE").value.trim().toLowerCase(),pw=$("gP").value;const m=$("gM");m.textContent="Memproses…";
    let r;

async function boot(){

  SB=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:!TOKEN,autoRefreshToken:!TOKEN,detectSessionInUrl:!TOKEN,storageKey:"kmb-psikotest-auth"}});
  if(TOKEN){return Exam.start()}
  const {data:{session}}=await SB.auth.getSession();
  USER=session?.user||null;
  if(!USER)return gate();
  const r=await SB.rpc("pk_role");ROLE=r.data||"none";
  if(!["owner","editor","viewer"].includes(ROLE))return gate("Email "+USER.email+" belum terdaftar untuk web Psikotest ini. Minta Pemilik menambahkan email Anda sebagai Editor atau Viewer.",false);

  setInterval(()=>{if(!document.hidden&&$("modal").hidden)refresh()},30000);
}

    q(SB.from("pk_settings").select("data").eq("id",1).maybeSingle()),

  S.modules=m;S.sessions=s;S.attempts=a;S.kinerja=kn||[];const sd=st?.data||{};

const SP_CUT=[0,7.5,12.5,17.5];
const KEP=[["tetap","Pengangkatan karyawan tetap"],["perpanjang","Perpanjang kontrak"],["promosi","Promosi / kenaikan grade"],["tidak","Tidak diperpanjang"]];
function cScore(v,th){v=+v||0;return v<=th[0]?4:v<=th[1]?3:v<=th[2]?2:1}
function kinCalc(d){d=d||{};const A=(d.A||[]).map(Number).filter(x=>x>0),B=(d.B||[]).map(Number).filter(x=>x>0);
  const C=KF.C.items.map(([k,,,th])=>cScore((d.C||{})[k],th));
  const full=A.length===KF.A.items.length&&B.length===KF.B.items.length;
  const pA=A.length?avg(A)/4*100:null,pB=B.length?avg(B)/4*100:null,pC=avg(C)/4*100,cut=SP_CUT[+d.sp||0]||0;
  const skor=full?Math.max(0,Math.min(100,pA*KF.A.w/100+pB*KF.B.w/100+pC*KF.C.w/100-cut)):null;
  return {pA,pB,pC,C,cut,skor,full,cat:category(skor)}}
function kepLabel(k){const x=KEP.find(e=>e[0]===k.rekomendasi);if(!x)return k.rekomendasi||"–";return x[1]+(k.rekomendasi==="perpanjang"&&k.kontrak_bulan?" "+k.kontrak_bulan+" bulan":"")+(k.rekomendasi==="tidak"&&k.data?.alasan?" ("+k.data.alasan+")":"")}

function formKinerja(id,fromSession){
  const old=id?S.kinerja.find(x=>x.id===id):null;const ses=fromSession?S.sessions.find(x=>x.id===fromSession):null;
  const k=old?JSON.parse(JSON.stringify(old)):{nama:ses?.nama||"",nik:ses?.nik||"",jabatan:ses?"Mekanik":"Mekanik",grade:ses?.grade_saat_ini||ses?.grade_target||"",jobsite:ses?.jobsite||"",status_karyawan:"PKWT",periode:"",penilai:"",session_id:ses?.id||null,data:{A:[],B:[],C:{},sp:0},rekomendasi:"",kontrak_bulan:null};
  const d=k.data;d.A=d.A||[];d.B=d.B||[];d.C=d.C||{};
  const scoreRow=(sec,i,it)=>{const v=+d[sec][i]||0;return `<div class="kitem"><div class="row" style="justify-content:space-between;gap:8px"><b style="flex:1;min-width:150px">${i+1}. ${esc(it[0])}</b><span class="seg">${[4,3,2,1].map(n=>`<button type="button" data-s="${sec}" data-i="${i}" data-v="${n}" class="${v===n?"on":""}">${n}</button>`).join("")}</span></div><div class="small muted kdesc" id="kd${sec}${i}">${v?esc(it[5-v]):"4 = Sangat Baik · 3 = Baik · 2 = Kurang · 1 = Buruk"}</div></div>`};
  openModal(`<div class="head"><h2>${old?"Ubah":"Form"} Penilaian Kinerja Karyawan – Plant</h2><button class="btn sm" onclick="closeModal()">Tutup</button></div>
  <form id="kF" class="grid">
   ${!old&&!ses&&S.sessions.length?`<label class="f">Ambil data dari peserta tes (opsional)<select id="kFrom"><option value="">–</option>${S.sessions.map(s=>`<option value="${s.id}">${esc(s.nama)}${s.nik?" · "+esc(s.nik):""}</option>`).join("")}</select></label>`:""}
   <div class="grid g4"><label class="f">Nama<input name="nama" required value="${esc(k.nama)}"></label><label class="f">NIK / NIP<input name="nik" value="${esc(k.nik||"")}"></label>
    <label class="f">Jabatan<input name="jabatan" value="${esc(k.jabatan||"")}" placeholder="mis. Mekanik"></label><label class="f">Grade saat ini<select name="grade"><option value="">–</option>${["Helper",...GRADES].map(g=>`<option ${k.grade===g?"selected":""}>${g}</option>`).join("")}</select></label>
    <label class="f">Jobsite<input name="jobsite" value="${esc(k.jobsite||"")}"></label><label class="f">Tanggal masuk<input type="date" name="tgl_masuk" value="${esc(k.tgl_masuk||"")}"></label>
    <label class="f">Status karyawan<select name="status_karyawan">${["PKWT","Probation","PKWTT"].map(x=>`<option ${k.status_karyawan===x?"selected":""}>${x}</option>`).join("")}</select></label><label class="f">Periode penilaian<input name="periode" value="${esc(k.periode||"")}" placeholder="mis. Agu – Okt 2026"></label>
    <label class="f">Penilai (atasan langsung)<input name="penilai" value="${esc(k.penilai||"")}"></label></div>
   ${["A","B"].map(sec=>`<div class="card" style="margin:0"><h3>${KF[sec].t} <span class="chip">${KF[sec].w}%</span></h3>${KF[sec].items.map((it,i)=>scoreRow(sec,i,it)).join("")}</div>`).join("")}
   <div class="card" style="margin:0"><h3>${KF.C.t} <span class="chip">${KF.C.w}%</span></h3><div class="grid g4">${KF.C.items.map(([key,l,u])=>`<label class="f">${l} (${u})<input type="number" min="0" data-c="${key}" value="${+d.C[key]||0}"></label>`).join("")}
    <label class="f">Surat Peringatan aktif<select id="kSP">${["Tidak ada","SP 1 (−7,5)","SP 2 (−12,5)","SP 3 (−17,5)"].map((l,i)=>`<option value="${i}" ${(+d.sp||0)===i?"selected":""}>${l}</option>`).join("")}</select></label></div>
    <p class="small muted" style="margin:6px 0 0">Skor kehadiran: terlambat & tidak absen 0 = 4 · 1–3 = 3 · 4–5 = 2 · &gt;5 = 1 | sakit/izin/cuti 0 = 4 · 1–5 hari = 3 · 6–8 = 2 · &gt;8 = 1 | alpa 0 = 4 · 1 hari = 2 · &gt;1 = 1</p></div>
   <div class="grid g2"><label class="f">Kelebihan / keunggulan<textarea name="kelebihan" rows="3">${esc(d.kelebihan||"")}</textarea></label><label class="f">Hal yang perlu ditingkatkan<textarea name="kekurangan" rows="3">${esc(d.kekurangan||"")}</textarea></label></div>
   <div class="card" style="margin:0;background:var(--ps)"><div class="row" style="justify-content:space-between"><div><div class="small muted">Skor kinerja</div><div class="score-big" id="kSk">–</div></div><div id="kCat"></div></div>
    <div class="grid g2" style="margin-top:10px"><label class="f">Keputusan akhir<select name="rekomendasi" id="kRek"><option value="">– pilih –</option>${KEP.map(([v,l])=>`<option value="${v}" ${k.rekomendasi===v?"selected":""}>${l}</option>`).join("")}</select></label>
     <label class="f" id="kBlnW">Lama perpanjangan (bulan)<input type="number" name="kontrak_bulan" min="1" max="24" value="${k.kontrak_bulan||""}"></label>
     <label class="f" id="kAlsW">Alasan tidak diperpanjang<select name="alasan"><option ${d.alasan==="Dari perusahaan"?"selected":""}>Dari perusahaan</option><option ${d.alasan==="Permintaan karyawan"?"selected":""}>Permintaan karyawan</option></select></label></div>
    <p class="small muted" id="kSug" style="margin:6px 0 0"></p></div>
   <label class="f">Catatan penilai<textarea name="catatan" rows="2">${esc(d.catatan||"")}</textarea></label>
   <div class="row" style="justify-content:space-between">${old&&can("hapus")?'<button type="button" class="btn dan" id="kDel">Hapus</button>':"<span></span>"}<button class="btn pri">Simpan penilaian</button></div></form>`);
  const f=$("kF");
  const upd=()=>{d.C={};f.querySelectorAll("[data-c]").forEach(x=>d.C[x.dataset.c]=+x.value||0);d.sp=+$("kSP").value;const r=kinCalc(d);
    $("kSk").textContent=r.full?fmt(r.skor):"–";$("kCat").innerHTML=r.full?catChip(r.cat,true):'<span class="small muted">Lengkapi semua nilai A & B</span>';
    const sug=autoKep(r.cat);$("kSug").textContent=r.full?"Saran sistem: "+(setg().rekKontrak[r.cat.k]||""):"";
    if(r.full&&!$("kRek").value&&!old)$("kRek").value=sug;const v=$("kRek").value;$("kBlnW").hidden=v!=="perpanjang";$("kAlsW").hidden=v!=="tidak"};
  f.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const sec=b.dataset.s,i=+b.dataset.i,v=+b.dataset.v;d[sec][i]=v;
    b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));$("kd"+sec+i).textContent=KF[sec].items[i][5-v];upd()});
  f.addEventListener("input",upd);f.addEventListener("change",upd);upd();
  if($("kFrom"))$("kFrom").onchange=e=>{if(e.target.value){closeModal();formKinerja(null,e.target.value)}};
  f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f);upd();const r=kinCalc(d);
    if(!r.full)return toast("Lengkapi semua nilai bagian A dan B",3500);if(!fd.get("rekomendasi"))return toast("Pilih keputusan akhir",3000);
    Object.assign(d,{kelebihan:fd.get("kelebihan").trim(),kekurangan:fd.get("kekurangan").trim(),catatan:fd.get("catatan").trim(),alasan:fd.get("rekomendasi")==="tidak"?fd.get("alasan"):null});
    const row={nama:fd.get("nama").trim(),nik:fd.get("nik").trim()||null,jabatan:fd.get("jabatan").trim()||null,grade:fd.get("grade")||null,jobsite:fd.get("jobsite").trim()||null,tgl_masuk:fd.get("tgl_masuk")||null,
      status_karyawan:fd.get("status_karyawan"),periode:fd.get("periode").trim()||null,penilai:fd.get("penilai").trim()||null,data:d,skor:+r.skor.toFixed(1),rekomendasi:fd.get("rekomendasi"),
      kontrak_bulan:fd.get("rekomendasi")==="perpanjang"?(+fd.get("kontrak_bulan")||null):null,session_id:k.session_id||null,updated_at:new Date().toISOString()};
    try{let saved;if(old)saved=await q(SB.from("pk_kinerja").update(row).eq("id",old.id).select().single());else saved=await q(SB.from("pk_kinerja").insert(row).select().single());
      S.kinerja=[saved,...S.kinerja.filter(x=>x.id!==saved.id)];toast("Penilaian disimpan");syncDrive();viewKinerja(saved.id);if(TAB==="kinerja")renderTab()}catch(err){toast("Gagal: "+err.message)}};
  const del=$("kDel");if(del)del.onclick=async()=>{if(!confirm("Hapus penilaian kinerja "+k.nama+"?"))return;try{await q(SB.from("pk_kinerja").delete().eq("id",old.id));S.kinerja=S.kinerja.filter(x=>x.id!==old.id);closeModal();renderTab();syncDrive();toast("Dihapus")}catch(err){toast("Gagal: "+err.message)}};
}
function viewKinerja(id){const k=S.kinerja.find(x=>x.id===id);if(!k)return;const d=k.data||{};const r=kinCalc(d);
  const sec=s=>`<table class="sheet kprint"><thead><tr><th style="width:28px">No</th><th>${KF[s].t} (${KF[s].w}%)</th><th class="num" style="width:60px">Nilai</th><th>Keterangan</th></tr></thead><tbody>${KF[s].items.map((it,i)=>{const v=+(d[s]||[])[i]||0;return `<tr><td>${i+1}</td><td><b>${esc(it[0])}</b></td><td class="num"><b>${v||"–"}</b></td><td class="wrap">${v?esc(it[5-v]):""}</td></tr>`}).join("")}
    <tr><td></td><td class="right" colspan="2"><b>Rata-rata ${fmt(avg((d[s]||[]).map(Number).filter(x=>x>0)),2)} → ${fmt(s==="A"?r.pA:r.pB)}</b></td><td></td></tr></tbody></table>`;
  openModal(`<div class="head"><h2>Penilaian Kinerja Karyawan – Plant</h2><span class="noprint row"><button class="btn sm" id="kvP">Cetak / PDF</button>${canEdit()?'<button class="btn sm" id="kvE">Ubah</button>':""}<button class="btn sm" onclick="closeModal()">Tutup</button></span></div>
   <div class="small muted" style="margin:-6px 0 12px">PT Karunia Mandiri Berkarya · Formulir Penilaian Kinerja Karyawan Plant</div>
   <div class="grid g2"><div class="kv"><b>Nama</b><span>${esc(k.nama)}</span><b>NIK / NIP</b><span>${esc(k.nik||"–")}</span><b>Jabatan</b><span>${esc(k.jabatan||"–")}${k.grade?" · "+esc(k.grade):""}</span><b>Jobsite</b><span>${esc(k.jobsite||"–")}</span></div>
    <div class="kv"><b>Tanggal masuk</b><span>${k.tgl_masuk?fdate(k.tgl_masuk):"–"}</span><b>Status</b><span>${esc(k.status_karyawan||"–")}</span><b>Periode</b><span>${esc(k.periode||"–")}</span><b>Penilai</b><span>${esc(k.penilai||"–")}</span></div></div>
   <div style="margin-top:12px">${sec("A")}</div><div style="margin-top:10px">${sec("B")}</div>
   <table class="sheet kprint" style="margin-top:10px"><thead><tr><th>${KF.C.t} (${KF.C.w}%)</th><th class="num">Jumlah</th><th class="num">Nilai</th></tr></thead><tbody>${KF.C.items.map(([key,l,u],i)=>`<tr><td>${l}</td><td class="num">${+(d.C||{})[key]||0} ${u}</td><td class="num"><b>${r.C[i]}</b></td></tr>`).join("")}
    <tr><td>Surat Peringatan</td><td class="num">${d.sp?"SP "+d.sp:"Tidak ada"}</td><td class="num">${r.cut?"−"+fmt(r.cut):"0"}</td></tr><tr><td class="right" colspan="2"><b>Nilai kehadiran</b></td><td class="num"><b>${fmt(r.pC)}</b></td></tr></tbody></table>
   <div class="card" style="margin-top:12px;background:var(--ps)"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="small muted">Skor kinerja = A×50% + B×30% + C×20% − SP</div><div class="score-big">${fmt(r.skor)}</div></div><div>${catChip(r.cat,true)}</div></div>
    <div style="margin-top:8px;font-size:15px"><b>Keputusan:</b> <span style="color:var(--p2);font-weight:700">${esc(kepLabel(k))}</span></div></div>
   <div class="grid g2"><div class="card"><h3>Kelebihan</h3>${esc(d.kelebihan||"–")}</div><div class="card"><h3>Perlu ditingkatkan</h3>${esc(d.kekurangan||"–")}</div></div>
   ${d.catatan?`<div class="card"><h3>Catatan penilai</h3>${esc(d.catatan)}</div>`:""}
   <div class="sign" style="grid-template-columns:repeat(4,1fr)"><div>Karyawan<br>${esc(k.nama)}</div><div>Dibuat oleh<br>Atasan Langsung</div><div>Diketahui oleh<br>HR Site</div><div>Disetujui oleh<br>PJO / Manager</div></div>`);
  $("kvP").onclick=()=>{document.body.classList.add("printing");setTimeout(()=>{window.print();setTimeout(()=>document.body.classList.remove("printing"),500)},50)};
  if($("kvE"))$("kvE").onclick=()=>formKinerja(id);
}

async function loadQuestions(mid,force){if(!S.questions[mid]||force)S.questions[mid]=await q(SB.from("pk_questions").select("*").eq("module_id",mid).order("no"));return S.questions[mid]}
async function vBank(m){
  if(!BANKSEL||!S.modules.find(x=>x.id===BANKSEL))BANKSEL=S.modules[0]?.id||null;
  m.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><div><h2>Bank Soal</h2><p class="sub">Satu file soal untuk satu grade (mis. Soal G2). Unggah file Excel apa adanya — soal, pilihan, kunci, dan gambar terbaca otomatis.</p></div>
   <div class="row"><label class="btn pri">⬆ Unggah file soal<input type="file" id="bImp" accept=".xlsx,.xls,.csv" hidden></label><button class="btn sm" id="bTpl" title="Opsional, bila soal belum punya file">Template kosong</button></div></div>
   <div class="sheettabs" id="bTabs">${S.modules.map(x=>`<button data-id="${x.id}" class="${x.id===BANKSEL?"on":""}">${x.grade?`<b>${esc(x.grade)}</b> · `:""}${esc(x.title)} <span class="chip" style="margin-left:4px">${S.qcount?.[x.id]||0}</span></button>`).join("")}</div>
   <div id="bBody">${S.modules.length?'<div class="empty">Memuat…</div>':'<div class="empty">Belum ada soal. Klik <b>⬆ Unggah file soal</b>.</div>'}</div></div>`;
  $("bTabs").onclick=e=>{const b=e.target.closest("button");if(b){BANKSEL=b.dataset.id;vBank(m)}};
  $("bTpl").onclick=()=>{const ws=XLSX.utils.aoa_to_sheet([["No","Soal","A","B","C","D","Kunci","Topik"],[1,"Alat untuk mengukur diameter luar shaft secara akurat adalah…","Ruler","Micrometer","Depth Gauge","Feeler Gauge","B","Alat Ukur & Tools"]]);ws["!cols"]=[{wch:5},{wch:60},{wch:25},{wch:25},{wch:25},{wch:25},{wch:7},{wch:24}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Soal");XLSX.writeFile(wb,"Template_Bank_Soal.xlsx")};
  $("bImp").onchange=e=>importExcel(e.target.files[0]);
  if(!BANKSEL)return;
  const mod=S.modules.find(x=>x.id===BANKSEL);let qs=[];try{qs=await loadQuestions(BANKSEL)}catch(e){$("bBody").innerHTML='<div class="notice warn">Gagal memuat soal: '+esc(e.message)+'</div>';return}
  $("bBody").innerHTML=`<div class="notice" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><div><b>${esc(mod.title)}</b> ${mod.active?'<span class="chip st-Selesai">Aktif</span>':'<span class="chip st-Kedaluwarsa">Nonaktif</span>'}<br><span class="small">${mod.grade?"Grade "+esc(mod.grade)+" · ":""}Level ${esc(mod.level)} · ${mod.duration_min} menit · ${qs.length} soal · nilai lulus ${mod.pass_score}${mod.shuffle?" · urutan diacak":""}${mod.code?" · kode "+esc(mod.code):""}</span>${mod.description?`<br><span class="small muted">${esc(mod.description)}</span>`:""}</div>
   <div class="row"><button class="btn sm" id="mEdit">Pengaturan sheet</button><button class="btn sm" id="qAdd">+ Soal</button><button class="btn sm" id="qTime">Atur waktu semua soal</button><button class="btn sm" id="mXls">Unduh soal + kunci</button><button class="btn sm dan" id="mDel">Hapus sheet</button></div></div></div>
   <input id="qS" placeholder="Cari soal / topik…" style="width:100%;margin-bottom:6px"><p class="small muted" id="qInfo" style="margin:0 0 10px"></p><div id="qList"></div>`;
  const stat={};
  const draw=()=>{const k=$("qS").value.toLowerCase();$("qList").innerHTML=qs.filter(x=>(x.text+" "+(x.topic||"")).toLowerCase().includes(k)).map(x=>`<div class="qitem"><div class="n">${x.no}</div><div><div>${esc(x.text)}</div>${x.image?`<img src="${x.image}" alt="">`:""}<ol>${Object.entries(x.options).map(([l,t])=>`<li class="${l===x.answer?"key":""}">${l.toUpperCase()}. ${esc(t)}${l===x.answer?" ✓":""}</li>`).join("")}</ol><span class="row" style="margin-top:6px;gap:6px"><span class="chip">${esc(x.topic||"Umum")}</span>${x.time_sec?`<span class="chip">⏱ ${x.time_sec} dtk</span>`:""}${stat[x.id]?`<span class="chip ${stat[x.id].p>=80?"cat-B":stat[x.id].p>=40?"cat-C":"cat-E"}" title="Dari ${stat[x.id].n} peserta">${Math.round(stat[x.id].p)}% benar${stat[x.id].p>=90?" · terlalu mudah":stat[x.id].p<30?" · sulit / cek kunci":""}</span>`:""}</span></div><div><button class="btn sm" data-e="${x.id}">Ubah</button></div></div>`).join("")||'<div class="empty">Belum ada soal.</div>';
    $("qList").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>editQuestion(mod,qs.find(x=>x.id===b.dataset.e)))};
  $("qS").oninput=draw;draw();
  try{const an=await q(SB.from("pk_attempts").select("answers").eq("module_id",BANKSEL).not("submitted_at","is",null));const cnt={};an.forEach(r=>qs.forEach(x=>{cnt[x.id]=cnt[x.id]||{b:0,n:0};cnt[x.id].n++;if(String(r.answers?.[x.id]||"").toLowerCase()===x.answer)cnt[x.id].b++}));Object.entries(cnt).forEach(([k,v])=>stat[k]={p:100*v.b/v.n,n:v.n});if(an.length){$("qInfo").textContent="Analisis soal dari "+an.length+" peserta: hijau ≥80% benar, kuning 40–79%, merah <40% (cek kunci/kesulitan).";draw()}}catch(e){}
  $("qTime").onclick=async()=>{const v=prompt("Waktu tiap soal di sheet ini (detik). Kosongkan untuk menghapus pengaturan per soal:","60");if(v===null)return;const t=v.trim()?Math.min(3600,Math.max(5,+v)):null;try{await q(SB.from("pk_questions").update({time_sec:t}).eq("module_id",mod.id));await loadQuestions(mod.id,true);vBank(m);toast("Waktu soal diperbarui")}catch(e){toast("Gagal: "+e.message)}};
  $("mEdit").onclick=()=>editModule(mod);$("qAdd").onclick=()=>editQuestion(mod,null);
  $("mXls").onclick=()=>{const ws=XLSX.utils.json_to_sheet(qs.map(x=>({No:x.no,Soal:x.text,A:x.options.a||"",B:x.options.b||"",C:x.options.c||"",D:x.options.d||"",E:x.options.e||"",Kunci:x.answer.toUpperCase(),Topik:x.topic||"",Gambar:x.image?"ya":""})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Soal");XLSX.writeFile(wb,mod.title.replace(/[^\w]+/g,"_")+".xlsx")};
  $("mDel").onclick=async()=>{if(!confirm(`Hapus sheet "${mod.title}" beserta ${qs.length} soal dan semua nilai peserta pada sheet ini?`))return;try{await q(SB.from("pk_modules").delete().eq("id",mod.id));BANKSEL=null;await loadAll();vBank(m);toast("Sheet dihapus")}catch(e){toast("Gagal: "+e.message)}};
}
function editModule(mod){
  const x=mod||{title:"",level:"Junior",duration_min:60,pass_score:60,shuffle:false,active:true,description:"",code:""};
  openModal(`<div class="head"><h2>${mod?"Pengaturan sheet":"Sheet tes baru"}</h2><button class="btn sm" onclick="closeModal()">Tutup</button></div>
  <form id="mF" class="grid g2"><label class="f" style="grid-column:1/-1">Judul sheet<input name="title" required value="${esc(x.title)}"></label>
   <label class="f">Untuk grade<select name="grade" id="mG"><option value="">– (semua grade di level)</option>${GRADES.map(g=>`<option ${x.grade===g?"selected":""}>${g}</option>`).join("")}</select></label><label class="f">Level<select name="level" id="mL">${LEVELS.map(l=>`<option ${x.level===l?"selected":""}>${l}</option>`).join("")}</select></label>
   <label class="f">Kode dokumen<input name="code" value="${esc(x.code||"")}"></label>
   <label class="f">Durasi (menit)<input type="number" name="duration_min" min="1" max="600" required value="${x.duration_min}"></label>
   <label class="f">Nilai lulus sheet<input type="number" name="pass_score" min="0" max="100" value="${x.pass_score}"></label>
   <label class="f" style="grid-column:1/-1">Deskripsi / petunjuk untuk peserta<textarea name="description" rows="2">${esc(x.description||"")}</textarea></label>
   <label class="row"><input type="checkbox" name="shuffle" ${x.shuffle?"checked":""}> Acak urutan soal per peserta</label>
   <label class="row"><input type="checkbox" name="active" ${x.active?"checked":""}> Aktif (bisa dipilih saat membuat link)</label>
   <div style="grid-column:1/-1"><button class="btn pri">Simpan</button></div></form>`);
  $("mG").onchange=()=>{const l=levelOfGrade($("mG").value);if(l)$("mL").value=l};
  $("mF").onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);

function shrinkImage(file,max=900){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

const levelOfGrade=g=>{const n=+String(g||"").replace(/\D/g,"");return !n?"":n<=3?"Junior":n<=6?"Middle":n<=9?"Senior":"Supervisor"};
const TOPIC_KW=[["Alat Ukur & Tools",/caliper|micrometer|gauge|tester|alat (yang dipakai )?untuk mengukur|tachometer|speedometer|smoke checker|flowmeter|tool yang/i],
 ["Rem & Sistem Udara",/brake|rem\b|air tank|quick release|drain valve|slack adjuster|pengereman/i],
 ["Hidrolik",/hydraulic|hidrolik|relief|gear pump|cylinder hydraulic|drift|control valve|attachment|check valve|flushing|wear ring|seal yang|slipper/i],
 ["Kelistrikan",/battery|baterai|volt|alternator|listrik|\bohm\b|starting|generator|multitester|copper|relay|arus listrik/i],
 ["Teknik Umum (Seal, Bolt, Bearing)",/seal|bolt|nut\b|bearing|gasket|press fitting|heli-coil|torque bolt/i],
 ["Power Train & Chassis",/differential|clutch|axle|wheel|trailer|knuckle|king ?pin|spring|torque rod|truck|suspension|tie rod|i beam|pinion|sprung/i],
 ["Engine, Pelumas & Fuel",/engine|oli|oil|fuel|solar|thermostat|radiator|nozzle|injector|valve|liner|piston|viscosity|sulfur|hp\b|idle/i]];
const guessTopic=t=>{let best="Umum",bs=0;TOPIC_KW.forEach(([n,re])=>{const c=(t.match(new RegExp(re.source,"gi"))||[]).length;if(c>bs){bs=c;best=n}});return best};
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Gagal memuat "+src));document.head.appendChild(s)})}
function parseKmbSheet(ws){
  const rg=XLSX.utils.decode_range(ws["!ref"]);const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true});
  const qs=[];let cur=null;const isL=v=>v!=null&&/^[a-eA-E]$/.test(String(v).trim());
  rows.forEach((row,i)=>{row=row||[];const a=row[0];
    const textCells=row.map((v,c)=>[c,v]).filter(([c,v])=>v!=null&&String(v).trim()!==""&&!(c>=12&&(isL(v)||typeof v==="number")));
    if(typeof a==="number"&&Number.isInteger(a)&&a>0&&a<1000&&(cur||row.slice(1).some(v=>typeof v==="string"&&v.trim().length>6)||row.slice(12).some(isL))){
      const k=row.slice(12).find(isL);cur={no:a,row:rg.s.r+i,text:"",opts:{},last:null,key:k?String(k).trim().toLowerCase():""};qs.push(cur);
      textCells.shift();}
    if(!cur)return;
    if(!cur.key){const k=row.slice(12).find(isL);if(k)cur.key=String(k).trim().toLowerCase()}
    if(!textCells.length)return;
    const vals=textCells.map(([,v])=>String(v).replace(/\s+/g," ").trim());
    let m=vals[0].match(/^([a-eA-E])\s*[.)]?$/);
    if(m&&vals.length>1){cur.last=m[1].toLowerCase();cur.opts[cur.last]=vals.slice(1).join(" ");return}
    m=vals[0].match(/^([a-eA-E])[.)]\s+(.+)$/);
    if(m&&cur.text){cur.last=m[1].toLowerCase();cur.opts[cur.last]=[m[2],...vals.slice(1)].join(" ");return}
    const t=vals.join(" ");if(cur.last)cur.opts[cur.last]+=" "+t;else cur.text+=(cur.text?" ":"")+t});
  return qs.map(q=>({no:q.no,row:q.row,text:q.text.replace(/\s+([,.?:])/g,"$1").trim(),options:q.opts,answer:q.key}));
}
async function xlsxImages(buf,sheetName){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
  const zip=await JSZip.loadAsync(buf);const rd=async p=>{const f=zip.file(p);return f?f.async("string"):null};
  const P=s=>new DOMParser().parseFromString(s,"application/xml");const rels=async p=>{const x=await rd(p);const m={};if(x)P(x).querySelectorAll("Relationship").forEach(r=>m[r.getAttribute("Id")]=r.getAttribute("Target"));return m};
  const norm=(base,t)=>{if(t.startsWith("/"))return t.slice(1);const parts=base.split("/");parts.pop();t.split("/").forEach(s=>{if(s==="..")parts.pop();else if(s!==".")parts.push(s)});return parts.join("/")};
  const wbx=P(await rd("xl/workbook.xml"));const sh=[...wbx.getElementsByTagName("sheet")].find(s=>s.getAttribute("name")===sheetName);if(!sh)return [];
  const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
  const sheetPath=norm("xl/workbook.xml",(await rels("xl/_rels/workbook.xml.rels"))[rid]);
  const srels=await rels(sheetPath.replace(/([^/]+)$/,"_rels/$1.rels"));const out=[];
  for(const t of Object.values(srels)){if(!/drawing/i.test(t)||/vml/i.test(t))continue;const dp=norm(sheetPath,t);const dx=await rd(dp);if(!dx)continue;
    const drels=await rels(dp.replace(/([^/]+)$/,"_rels/$1.rels"));const doc=P(dx);
    [...doc.documentElement.children].forEach(anc=>{const from=anc.getElementsByTagName("xdr:from")[0]||anc.getElementsByTagName("from")[0];if(!from)return;
      const row=+((from.getElementsByTagName("xdr:row")[0]||from.getElementsByTagName("row")[0])||{}).textContent;
      [...anc.getElementsByTagName("a:blip")].forEach(b=>{const id=b.getAttribute("r:embed");if(id&&drels[id])out.push({row,path:norm(dp,drels[id])})})})}
  for(const o of out){const f=zip.file(o.path);o.blob=f&&/\.(png|jpe?g|gif|bmp|webp)$/i.test(o.path)?new Blob([await f.async("uint8array")],{type:/png$/i.test(o.path)?"image/png":"image/jpeg"}):null}
  return out.filter(o=>o.blob);
}
function blobImg(b){return new Promise((res,rej)=>{const u=URL.createObjectURL(b);const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u})}
async function stackImages(blobs,max=900){const ims=[];for(const b of blobs){try{ims.push(await blobImg(b))}catch(e){}}if(!ims.length)return null;
  const W=Math.min(max,Math.max(...ims.map(i=>i.width)));const hs=ims.map(i=>Math.round(i.height*Math.min(1,W/i.width)));
  const c=document.createElement("canvas");c.width=W;c.height=hs.reduce((a,b)=>a+b,0)+8*(ims.length-1);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
  let y=0;ims.forEach((im,i)=>{const w=Math.round(im.width*Math.min(1,W/im.width));x.drawImage(im,0,y,w,hs[i]);y+=hs[i]+8});return c.toDataURL("image/jpeg",.8)}

      if(c.i<c.qs.length-1)c.i++;this.render();window.scrollTo(0,0)});
    const pv=$("pv");if(pv)pv.onclick=()=>{c.i--;this.render()};const nx=$("nx");if(nx)nx.onclick=()=>{c.i++;this.render();window.scrollTo(0,0)};
    $("app").querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{c.i=+b.dataset.i;this.render();window.scrollTo(0,0)});
    const fin=()=>{const left=c.qs.length-Object.keys(c.ans).filter(k=>c.qs.some(x=>x.id===k)).length;
      openModal(`<div class="head"><h2>Kirim jawaban?</h2></div><p>${left?`Masih ada <b>${left} soal</b> yang belum dijawab.`:"Semua soal sudah dijawab."} Setelah dikirim, jawaban tidak bisa diubah.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Kembali</button><button class="btn pri" id="ok">Kirim sekarang</button></div>`);
      $("ok").onclick=()=>{closeModal();this.submit(false)}};
    const f1=$("fin");if(f1)f1.onclick=fin;$("fin2").onclick=fin;this.clock()},
  renderPer(){const c=this.cur,qq=c.q;if(!qq)return;
    $("app").innerHTML=this.topBar(`Soal ${c.index+1} dari ${c.n} · tidak bisa kembali`)+`
    <div style="padding:0 12px"><div class="q-card"><div class="row" style="justify-content:space-between"><span class="small muted">Soal ${c.index+1} dari ${c.n}</span><b id="qt" class="small">--</b></div><div class="bar" style="margin:6px 0 10px"><i id="qbar" style="width:100%"></i></div>
     <div class="qtext">${esc(qq.text)}</div>${qq.image?`<img src="${qq.image}" alt="Gambar soal" draggable="false">`:""}
     ${this.optsHtml(qq,c.sel)}
     <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn pri" id="nxq" ${c.busy?"disabled":""}>${c.index+1<c.n?"Kirim & lanjut ›":"Kirim & selesai"}</button></div></div>
     <div class="bar" style="max-width:820px;margin:0 auto 30px"><i style="width:${100*c.index/c.n}%"></i></div></div>`;
    c.qTotal=c.qTotal||Math.max(1,c.qDeadline-(Date.now()+c.offset));
    $("app").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{c.sel=b.dataset.l;$("app").querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel",x===b))});
    $("nxq").onclick=()=>{if(!c.sel)return openModal(`<div class="head"><h2>Belum memilih jawaban</h2></div><p>Lanjut tanpa menjawab soal ini? Anda tidak bisa kembali.</p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Kembali</button><button class="btn pri" id="ok">Lewati</button></div>`),$("ok").onclick=()=>{closeModal();this.answer()};this.answer()};
    this.clock()},
  async answer(){const c=this.cur;if(!c||c.busy)return;c.busy=true;const b=$("nxq");if(b)b.disabled=true;
    for(let k=0;k<4;k++){const r=await SB.rpc("pk_answer_q",{p_token:TOKEN,p_module:c.mid,p_qid:c.q.id,p_answer:c.sel,p_device:DEVICE});
      if(!r.error){if(r.data.status==="selesai")return this.done();this.applyPer(r.data);c.qTotal=null;this.renderPer();window.scrollTo(0,0);return}
      if(/perangkat lain|kedaluwarsa|tidak ditemukan/i.test(r.error.message))return this.end(r.error.message);
      await new Promise(s=>setTimeout(s,1500))}
    c.busy=false;toast("Koneksi bermasalah, mencoba lagi…");if(b)b.disabled=false},
  clock(){const c=this.cur;if(!c)return;const now=Date.now()+c.offset;const fmtT=s=>(s>=3600?Math.floor(s/3600)+":":"")+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    const left=Math.max(0,Math.floor((c.deadline-now)/1000));const t=$("tm");
    if(c.mode==="total"){if(t){t.textContent=fmtT(left);t.classList.toggle("low",left<=60)}if(left<=0&&!c.sending)this.submit(true);return}
    const ql=Math.max(0,c.qDeadline-now),qs=Math.ceil(ql/1000);
    if(t){t.textContent=fmtT(qs);t.classList.toggle("low",qs<=10)}const qt=$("qt");if(qt)qt.textContent="sisa waktu soal "+fmtT(qs);
    const bar=$("qbar");if(bar&&c.qTotal){bar.style.width=Math.max(0,100*ql/c.qTotal)+"%";bar.parentElement.className="bar "+(qs<=10?"r":qs<=20?"y":"")}
    if(ql<=0&&!c.busy){closeModal();this.answer()}},
  async save(){const c=this.cur;if(!c||c.mode!=="total"||!c.dirty||c.sending)return;c.dirty=false;const r=await SB.rpc("pk_save_answers",{p_token:TOKEN,p_module:c.mid,p_answers:c.ans});const sv=$("sv");if(r.error){c.dirty=true;if(sv)sv.textContent="Gagal menyimpan, mencoba lagi…"}},
  async submit(auto){const c=this.cur;if(!c||c.sending)return;c.sending=true;
    $("app").innerHTML=`<div class="gate"><div class="box"><h1>${auto?"Waktu habis":"Mengirim jawaban…"}</h1><p class="muted">Jawaban sedang dikirim, jangan tutup halaman.</p></div></div>`;
    for(let k=0;k<5;k++){const r=await SB.rpc("pk_submit_module",{p_token:TOKEN,p_module:c.mid,p_answers:c.ans});if(!r.error){try{localStorage.removeItem("pk-ans-"+TOKEN+"-"+c.mid)}catch(e){}return this.done()}await new Promise(s=>setTimeout(s,2000))}
    $("app").innerHTML=`<div class="gate"><div class="box"><h1>Gagal mengirim</h1><p>Periksa koneksi internet lalu tekan tombol di bawah. Jawaban Anda tersimpan di perangkat ini.</p><button class="btn pri" id="rt">Kirim ulang</button></div></div>`;
    $("rt").onclick=()=>{c.sending=false;this.submit(auto)}},
  done(){const url=this.info.gas_url;this.stop();toast("Jawaban terkirim");if(url)fetch(url,{method:"POST",body:JSON.stringify({action:"sync"})}).catch(()=>{});this.start()}
};
window.addEventListener("beforeunload",()=>{if(Exam.cur&&!Exam.cur.sending)Exam.save()});
window.closeModal=closeModal;
boot().catch(e=>{console.error(e);document.getElementById("app").innerHTML='<div class="gate"><div class="box"><h1>Terjadi kesalahan</h1><p>'+esc(e.message||e)+'</p></div></div>'});
</script>
</body>
</html>
