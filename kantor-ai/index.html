<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kantor Monitoring</title>
<meta name="theme-color" content="#6D28D9">
<style>
:root{color-scheme:light;--solid:#ffffff;--bg:#EEF0F8;--card:rgba(255,255,255,.96);--ink:#1E1B3A;--ink-2:#4B4868;--muted:#7D7A99;--line:#E6E4F2;--p:#6D28D9;--p-soft:#EFE9FE;--good:#15803D;--good-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--crit:#E11D48;--crit-soft:#FFE4E6;--idle:#64748B;--idle-soft:#F1F5F9}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--solid:#1d1830;--bg:#120F1F;--card:rgba(29,24,48,.96);--ink:#F1EDFA;--ink-2:#CFC8E3;--muted:#9E97B8;--line:#2E2847;--p:#A78BFA;--p-soft:#2A2145;--good:#4ADE80;--good-soft:#14301F;--warn:#FBBF24;--warn-soft:#33270B;--crit:#FB7185;--crit-soft:#3A1520;--idle:#94A3B8;--idle-soft:#1E2433}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 360px}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);z-index:3}
header .lg{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:17px;margin:0;line-height:1.2}
header .sub{font-size:12px;color:var(--muted)}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{color:var(--good);background:var(--good-soft)}.warn{color:var(--warn);background:var(--warn-soft)}.crit{color:var(--crit);background:var(--crit-soft)}.idle{color:var(--idle);background:var(--idle-soft)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 10px;cursor:pointer;text-decoration:none}
#stage{position:relative;overflow:hidden;min-height:0;background:radial-gradient(ellipse at 50% 25%,#20305a 0%,#0e1628 55%,#090d18 100%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tag .bub{max-width:170px;padding:5px 9px;border-radius:10px;font-size:12px;font-weight:600;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(20,10,50,.15);border:1px solid rgba(0,0,0,.05)}
.tag .nm{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tag.sel .nm{background:var(--p);color:#fff;border-color:var(--p)}
.tag .nm i{display:none;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tag .nm i.ok{background:var(--good)}.tag .nm i.warn{background:#F59E0B}.tag .nm i.crit{background:var(--crit)}.tag .nm i.idle{background:var(--idle)}
.tag.hot .bub{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
aside{border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:16px;z-index:2}
aside h2{font-size:18px;margin:2px 0 4px}
aside .role{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
aside .big{font-size:15px;margin:10px 0 12px;padding:10px 12px;border-radius:10px}
aside ul{margin:6px 0 12px;padding-left:18px}aside li{margin:3px 0}
aside .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:8px 0 14px}
aside .kv b{text-align:right}
aside .rep{font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
aside .rep h4{margin:12px 0 4px;font-size:14px}
aside .muted{color:var(--muted);font-size:13px}
aside .team{display:grid;gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
aside .team button{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
aside .team button.on{border-color:var(--p);background:var(--p-soft)}
aside .team button span:nth-child(2){flex:1}
.gate{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5;background:var(--bg)}
.gate[hidden]{display:none}
.gate .card{max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.gate h2{margin:0 0 6px}.gate p{color:var(--ink-2);margin:0 0 14px}
.demo{position:absolute;left:12px;bottom:12px;z-index:2}
.card3d{position:absolute;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);color:#1e1b3a;border-radius:12px;padding:6px 10px 7px;box-shadow:0 10px 28px rgba(0,0,0,.4);font-size:11px;line-height:1.3;width:192px;pointer-events:auto;cursor:pointer;z-index:1}
.card3d h5{margin:0 0 3px;font-size:12.5px;display:flex;gap:7px;align-items:center;line-height:1.2}.card3d h5 span:nth-child(2){flex:1}
.card3d .ic{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:grid;place-items:center;background:#e0f2fe;font-size:14px}
.card3d .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.card3d .dot.ok{background:#22c55e}.card3d .dot.warn{background:#f59e0b}.card3d .dot.crit{background:#ef4444}
.card3d ul{margin:0;padding:0;list-style:none}.card3d li::before{content:'✓ ';color:#16a34a;font-weight:800}
.nocards .card3d{display:none}
.badge3d{position:absolute;transform:translate(-50%,-50%);background:rgba(8,15,30,.9);border:2px solid #38bdf8;color:#fff;border-radius:10px;padding:6px 14px;font-weight:800;font-size:17px;line-height:1.2;pointer-events:none;box-shadow:0 0 18px rgba(56,189,248,.35)}.badge3d small{display:block;font-weight:500;font-size:12.5px;color:#bae6fd}
.legend{position:absolute;right:12px;bottom:12px;z-index:3}
.mods{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.mods .btn{white-space:nowrap}
.rem{list-style:none;padding:0;margin:6px 0 10px}.rem li{font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}.rem li.late .chip{background:var(--crit-soft);color:var(--crit)}
.chat{position:fixed;right:16px;bottom:16px;top:72px;width:min(560px,calc(100vw - 32px));z-index:50;background:var(--solid);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
.chat[hidden]{display:none}
.chat-hd{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chat-av{width:34px;height:34px;border-radius:50%;background:var(--p-soft);display:grid;place-items:center;font-size:18px;flex:0 0 34px}
.chat-ti{flex:1;min-width:0;line-height:1.2}.chat-ti small{display:block;color:var(--muted);font-size:12px}
.chat-hd select{max-width:150px;font:inherit;font-size:13px;padding:6px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.chat-body{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{max-width:88%;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--p);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--solid);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin-bottom:0}.msg.a ul{margin:4px 0 8px;padding-left:20px}.msg.a h4{margin:10px 0 4px;font-size:14.5px}
.msg.a code{background:var(--bg);padding:1px 5px;border-radius:5px;font-size:13px}
.msg .att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.msg .att img{max-width:180px;max-height:140px;border-radius:10px;display:block;cursor:pointer}
.fchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.08);color:inherit;text-decoration:none;cursor:pointer;border:0}
.msg.u .fchip{background:rgba(255,255,255,.2)}
.msg .tool{font-size:12.5px;background:var(--good-soft);color:var(--good);border-radius:8px;padding:5px 8px;margin:6px 0}
.cursor::after{content:'▍';animation:blink 1s steps(2) infinite;margin-left:1px}@keyframes blink{50%{opacity:0}}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}
.chat-empty{margin:auto;text-align:center;color:var(--ink-2);max-width:380px}.chat-empty h3{margin:6px 0}.chat-empty .sug{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.chat-empty .sug button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;cursor:pointer}
.chat-in{border-top:1px solid var(--line);padding:10px 12px 8px;background:var(--solid)}
.chat-files{display:flex;flex-wrap:wrap;gap:6px}.chat-files:not(:empty){margin-bottom:8px}
.chat-files .fchip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:13px}
.chat-row{display:flex;gap:8px;align-items:flex-end}
.chat-row textarea{flex:1;resize:none;max-height:160px;font:inherit;font-size:14.5px;line-height:1.45;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chat-row textarea:focus{outline:2px solid var(--p);border-color:transparent}
.chat-clip{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;flex:0 0 40px}
.chat-send{height:40px}
.chat-note{font-size:11px;color:var(--muted);margin-top:6px;text-align:center}
.chat.drag .chat-body{outline:3px dashed var(--p);outline-offset:-8px}
.now{font-size:13px;color:var(--ink-2);margin:-4px 0 8px;font-weight:600}
.tag .bub{background:rgba(255,255,255,.95);color:#1e1b3a}.tag .bub.ok{background:#ecfdf5;color:#166534}.tag .bub.warn{background:#fffbeb;color:#92400e}.tag .bub.crit{background:#fff1f2;color:#be123c}.tag .bub.idle{background:#f8fafc;color:#334155}
.sec{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.ask textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ask textarea:focus{outline:2px solid var(--p);border-color:transparent}
.ask .row{display:flex;gap:8px;align-items:center;margin-top:6px}.ask .row .muted{flex:1}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.btn:disabled{opacity:.55;cursor:default}
.rq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.rq .top{display:flex;gap:8px;align-items:flex-start}.rq .top p{margin:0;flex:1;white-space:pre-wrap}
.rq .meta{font-size:12px;color:var(--muted);margin-top:4px}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.job{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.job .jt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.job .jt b{font-size:13px}
.job .who{font-size:12px;color:var(--muted)}
.job .prop{background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
.job details{margin-top:4px}.job summary{cursor:pointer;color:var(--p);font-size:13px}
.job .res{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:4px;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;margin-top:6px}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  header{gap:8px;padding:8px 12px;flex-wrap:wrap}.chat{inset:0;width:100%;top:0;right:0;bottom:0;border-radius:0}.chat-ti small{display:none}.chat-hd select{max-width:96px}.chat-hd{gap:6px;padding:8px 10px}.chat-av{width:30px;height:30px;flex-basis:30px}.msg{max-width:94%}#chatOpen{order:8}.mods{order:9;width:100%}header h1{font-size:16px}header .lg{width:30px;height:30px}
  .pill{font-size:12px;padding:4px 8px}.btn .tx{display:none}
  aside{border-left:0;border-top:1px solid var(--line);max-height:44vh;padding:14px 16px}
  header .sub{display:none}
  .tag .bub{max-width:150px;font-size:11px;padding:4px 7px}.tag .nm{font-size:10px}
  .tag:not(.sel) .bub{display:none}.badge3d.b1{display:none}.badge3d{font-size:12px;padding:4px 9px}.badge3d small{font-size:10px}.card3d{width:150px;font-size:10.5px}.tag .nm i{display:inline-block}.tag.sel{z-index:2}
}
</style>

<body>
<div id="app">
  <header>
    <div class="lg">AI</div>
    <div><h1>Kantor Monitoring</h1><div class="sub">Tim AI yang bekerja live untuk web Monitoring · diperbarui <span id="upd">–</span></div></div>

    <nav class="mods"><a class="btn" href="../?beranda">Beranda</a><a class="btn" href="../manpower-portal/">MPP</a><a class="btn" href="../monitoring-apd-kmb/">APD</a><a class="btn" href="../monitoring-unit/">Unit</a><a class="btn" href="../notulensi/">Notulensi</a><a class="btn" href="../rekrutmen/">Rekrutmen</a></nav>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CFG = { url: 'https://yoviojbfyvgpllxisjvy.supabase.co', key: 'sb_publishable_I26enb2Kz8iF4WFdH8vixA_8kek-kM9' };
const DEMO = new URLSearchParams(location.search).has('demo');
const APPS = { kmb: 'Manpower KMB', mbj: 'Manpower MBJ', 'bupr-ampah': 'Manpower BUPR', 'kta-tra': 'Manpower KTA-TRA', apd: 'APD', notulensi: 'Notulensi', 'unit-monitoring': 'Monitoring Unit' };
const LV = { ok: 'Aman', warn: 'Perlu dicek', crit: 'Gawat', idle: 'Menunggu' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wib = (t) => new Date(t).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const mask = (e) => { const [u, d] = String(e || '').split('@'); return d ? u.slice(0, 3) + '…@' + d : (e || 'link tamu'); };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const short = (t, n = 34) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

/* ---------- tim ---------- */
const TEAM = [
  { id: 'manager', name: 'Manager Operasional', role: 'Lantai 2 · pimpin 8 divisi', acc: 0x2563eb },
  { id: 'satpam', name: 'Satpam', role: 'Keamanan web & akun', acc: 0x1e3a8a },
  { id: 'resepsionis', name: 'Resepsionis', role: 'Akses Editor/Pelihat & link', acc: 0xec4899 },
  { id: 'teknisi', name: 'Teknisi', role: '9 halaman web & deploy', acc: 0x3b82f6 },
  { id: 'pencatat', name: 'Pencatat', role: 'Log aktivitas MPP/APD/Unit', acc: 0x0ea5e9 },
  { id: 'sekretaris', name: 'Sekretaris', role: 'Pengingat Open/Close & laporan', acc: 0x8b5cf6 },
  { id: 'admin_db', name: 'Admin Database & Backup', role: 'Supabase, Drive & cadangan', acc: 0x1d4ed8 },

  { id: 'marketing', name: 'Marketing', role: 'Jual Monitoring ke kontraktor', acc: 0x14b8a6 },
];
const DIV = Object.fromEntries(TEAM.map((t) => [t.id, t.name]));
const JS = { antre: ['Antre', 'idle'], dikerjakan: ['Dikerjakan', 'ok'], butuh_persetujuan: ['Butuh persetujuan', 'warn'], disetujui: ['Disetujui', 'ok'], ditolak: ['Ditolak', 'idle'], selesai: ['Selesai', 'ok'], gagal: ['Gagal', 'crit'] };
const RS = { baru: ['Baru', 'warn'], direncanakan: ['Direncanakan', 'ok'], dikerjakan: ['Dikerjakan', 'ok'], butuh_persetujuan: ['Butuh persetujuan', 'warn'], selesai: ['Selesai', 'ok'], dibatalkan: ['Dibatalkan', 'idle'] };
let DATA = null, STATE = {}, SEL = 'manager', SB = null, RELOAD = () => {};

const activeJobs = (d) => (d.requests || []).filter((q) => q.status !== 'dibatalkan').flatMap((q) => q.jobs || []);
function derive(d) {
  const rep = d.last_report, chk = (rep && rep.checks) || {};
  const ageH = rep ? (Date.now() - new Date(rep.created_at).getTime()) / 36e5 : null;
  const pend = d.pending_requests || [], db = d.db || {};
  const fromCheck = (c, idleText) => c ? { level: c.level || 'ok', bubble: c.summary || LV[c.level || 'ok'], items: c.items || [] } : { level: 'idle', bubble: idleText, items: [] };
  const s = {};
  s.satpam = fromCheck(chk.security, 'Menunggu ronda pagi');
  s.teknisi = fromCheck(chk.web, 'Menunggu cek pagi');
  const n = d.activity_24h || 0, del = d.deletes_24h || 0;
  s.pencatat = { level: del >= 20 ? 'crit' : del >= 5 ? 'warn' : 'ok', bubble: del >= 5 ? `${del} penghapusan!` : n ? `${n} aktivitas hari ini` : 'Belum ada aktivitas' };
  s.resepsionis = { level: pend.length ? 'warn' : 'ok', bubble: pend.length ? `${pend.length} tamu menunggu izin` : 'Tidak ada antrean' };
  if (!rep) s.sekretaris = { level: 'idle', bubble: 'Laporan pertama besok pagi' };
  else if (ageH > 26) s.sekretaris = { level: 'warn', bubble: 'Laporan terlambat' };

/* ---------- chat ala Claude/ChatGPT ---------- */

function msgEl(role, text, files, signed = {}) {
  const el = document.createElement('div'); el.className = 'msg ' + (role === 'user' ? 'u' : 'a');
  const att = (files || []).map((f) => /^image\//.test(f.type) && signed[f.path] ? `<img src="${esc(signed[f.path])}" alt="${esc(f.name)}" data-file="${esc(f.path)}">` : `<button type="button" class="fchip" data-file="${esc(f.path)}">📎 ${esc(f.name)}</button>`).join('');

  const { data } = await SB.from('office_messages').select('role,content,files').eq('thread_id', id).order('id');
  const sg = await signedMap(data || []);

  $('chatFiles').innerHTML = CHAT.files.map((f, i) => `<span class="fchip">${f.file.type.startsWith('image/') ? '🖼️' : f.file.name.match(/\.pdf$/i) ? '📄' : '📊'} ${esc(short(f.file.name, 28))}<button type="button" data-rm="${i}" aria-label="Hapus">✕</button></span>`).join('');

function addFiles(list) {
  for (const f of list) {
    if (CHAT.files.length >= MAXF) { alert('Maksimal 5 file per pesan.'); break; }

async function uploadAll() {

const NOKEY = `### Chat AI belum aktif
Kunci API Claude belum dipasang. Langkahnya:

// Tanpa API key: pesan masuk antrean Manager terjadwal (Claude langganan Pemilik).

async function queueChat(text, files) {
  const { data, error } = await SB.rpc('office_chat_queue', { p_thread: CHAT.thread, p_text: text, p_files: files });
  if (error) return /office_chat_queue|function/i.test(error.message) ? NOKEY : '⚠️ ' + error.message;
  CHAT.thread = data.thread_id; CHAT.waiting = true; CHAT.seen = await msgCount(CHAT.thread); setTimeout(RELOAD, 800);
  return `📨 **Pesan masuk antrean Manager** (permintaan #${data.request_id}).\n\nClaude akan mengerjakannya di putaran terjadwal berikutnya (tiap jam, 07.00–22.00 WIB). Jawabannya muncul otomatis di chat ini dan di meja Manager. Butuh jawaban seketika? Pasang API key Claude, langkahnya ada di meja Manager.`;
}

  if (DEMO || !CHAT.waiting || !CHAT.thread || CHAT.busy || $('chat').hidden) return;

  if (n != null && n > (CHAT.seen || 0)) await loadThread(CHAT.thread);

setInterval(pollChat, 60000);
async function send(text) {
  if (CHAT.busy) return;
  text = (text || '').trim(); if (!text && !CHAT.files.length) return;
  CHAT.busy = true; $('chatSend').disabled = true;
  if (chatBody.querySelector('.chat-empty')) chatBody.innerHTML = '';
  let files = [];
  try { files = await uploadAll(); } catch (e) { CHAT.busy = false; $('chatSend').disabled = false; alert(e.message); return; }
  const localSigned = Object.fromEntries(CHAT.files.filter((f) => f.file.type.startsWith('image/')).map((f, i) => [files[CHAT.files.indexOf(f)].path, URL.createObjectURL(f.file)]));
  msgEl('user', text, files, localSigned); CHAT.files = []; renderFiles(); chatText.value = ''; autosize();
  const a = msgEl('assistant', '', []); const tx = a.querySelector('.tx'); tx.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; scrollEnd();
  let full = '', tools = '';
  const paint = (done) => { tx.innerHTML = tools + mdChat(full); if (!done) tx.lastElementChild ? tx.lastElementChild.classList.add('cursor') : tx.classList.add('cursor'); scrollEnd(); };
  try {
    if (DEMO) {
      const reply = 'Ini **mode contoh**, jadi jawabannya simulasi.\n\n### Yang masih open\n- Izin akses budi…@contoh.com → Manpower KMB (3 hari)\n- Persetujuan *Usulan harga paket* dari Marketing\n\nMau saya buatkan permintaan ke tim untuk menindaklanjuti?';
      for (const w of reply.split(/(\s+)/)) { full += w; paint(false); await new Promise((r) => setTimeout(r, 25)); }
    } else {
      const { data: { session } } = await SB.auth.getSession();
      const r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: CFG.key }, body: JSON.stringify({ thread_id: CHAT.thread, message: text, files }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); if (j.code === 'no_key') { full = await queueChat(text, files); } else full = '⚠️ ' + (j.error || ('Gagal (' + r.status + ')')); }
      else {
        const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
        while (true) { const { value, done } = await rd.read(); if (done) break; buf += dec.decode(value, { stream: true });
          let k; while ((k = buf.indexOf('\n\n')) >= 0) { const line = buf.slice(0, k); buf = buf.slice(k + 2); if (!line.startsWith('data: ')) continue; const ev = JSON.parse(line.slice(6));
            if (ev.thread_id) CHAT.thread = ev.thread_id; if (ev.t) full += ev.t; if (ev.tool) { tools += `<div class="tool">${esc(ev.tool)}</div>`; setTimeout(RELOAD, 800); } if (ev.error) full += (full ? '\n\n' : '') + '⚠️ ' + ev.error; paint(false); } }
      }

  if (!DEMO) loadThreads();
}
