<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kantor AI · Monitoring</title>
<meta name="theme-color" content="#6D28D9">
<style>
:root{color-scheme:light;--bg:#EEF0F8;--card:rgba(255,255,255,.96);--ink:#1E1B3A;--ink-2:#4B4868;--muted:#7D7A99;--line:#E6E4F2;--p:#6D28D9;--p-soft:#EFE9FE;--good:#15803D;--good-soft:#DCFCE7;--warn:#B45309;--warn-soft:#FEF3C7;--crit:#E11D48;--crit-soft:#FFE4E6;--idle:#64748B;--idle-soft:#F1F5F9}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#120F1F;--card:rgba(29,24,48,.96);--ink:#F1EDFA;--ink-2:#CFC8E3;--muted:#9E97B8;--line:#2E2847;--p:#A78BFA;--p-soft:#2A2145;--good:#4ADE80;--good-soft:#14301F;--warn:#FBBF24;--warn-soft:#33270B;--crit:#FB7185;--crit-soft:#3A1520;--idle:#94A3B8;--idle-soft:#1E2433}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr) 360px}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);z-index:3}
header .lg{width:34px;height:34px;border-radius:10px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700}
header h1{font-size:17px;margin:0;line-height:1.2}
header .sub{font-size:12px;color:var(--muted)}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.ok{color:var(--good);background:var(--good-soft)}.warn{color:var(--warn);background:var(--warn-soft)}.crit{color:var(--crit);background:var(--crit-soft)}.idle{color:var(--idle);background:var(--idle-soft)}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 10px;cursor:pointer;text-decoration:none}
#stage{position:relative;overflow:hidden;min-height:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tag .bub{max-width:170px;padding:5px 9px;border-radius:10px;font-size:12px;font-weight:600;line-height:1.3;text-align:center;box-shadow:0 4px 14px rgba(20,10,50,.15);border:1px solid rgba(0,0,0,.05)}
.tag .nm{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.tag.sel .nm{background:var(--p);color:#fff;border-color:var(--p)}
.tag .nm i{display:none;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.tag .nm i.ok{background:var(--good)}.tag .nm i.warn{background:#F59E0B}.tag .nm i.crit{background:var(--crit)}.tag .nm i.idle{background:var(--idle)}
.tag.hot .bub{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
aside{border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:16px;z-index:2}
aside h2{font-size:18px;margin:2px 0 4px}
aside .role{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
aside .big{font-size:15px;margin:10px 0 12px;padding:10px 12px;border-radius:10px}
aside ul{margin:6px 0 12px;padding-left:18px}aside li{margin:3px 0}
aside .kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;margin:8px 0 14px}
aside .kv b{text-align:right}
aside .rep{font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
aside .rep h4{margin:12px 0 4px;font-size:14px}
aside .muted{color:var(--muted);font-size:13px}
aside .team{display:grid;gap:6px;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
aside .team button{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-size:14px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
aside .team button.on{border-color:var(--p);background:var(--p-soft)}
aside .team button span:nth-child(2){flex:1}
.gate{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5;background:var(--bg)}
.gate[hidden]{display:none}
.gate .card{max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
.gate h2{margin:0 0 6px}.gate p{color:var(--ink-2);margin:0 0 14px}
.demo{position:absolute;left:12px;bottom:12px;z-index:2}
.sec{margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em}
.ask textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ask textarea:focus{outline:2px solid var(--p);border-color:transparent}
.ask .row{display:flex;gap:8px;align-items:center;margin-top:6px}.ask .row .muted{flex:1}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.btn:disabled{opacity:.55;cursor:default}
.rq{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.rq .top{display:flex;gap:8px;align-items:flex-start}.rq .top p{margin:0;flex:1;white-space:pre-wrap}
.rq .meta{font-size:12px;color:var(--muted);margin-top:4px}
.chip{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
.job{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.job .jt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.job .jt b{font-size:13px}
.job .who{font-size:12px;color:var(--muted)}
.job .prop{background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin:6px 0;font-size:13px}
.job details{margin-top:4px}.job summary{cursor:pointer;color:var(--p);font-size:13px}
.job .res{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 10px;margin-top:4px;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;margin-top:6px}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  header{gap:8px;padding:8px 12px}header h1{font-size:16px}header .lg{width:30px;height:30px}
  .pill{font-size:12px;padding:4px 8px}.btn .tx{display:none}
  aside{border-left:0;border-top:1px solid var(--line);max-height:44vh;padding:14px 16px}
  header .sub{display:none}
  .tag .bub{max-width:150px;font-size:11px;padding:4px 7px}.tag .nm{font-size:10px}
  .tag:not(.sel) .bub{display:none}.tag .nm i{display:inline-block}.tag.sel{z-index:2}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <header>
    <div class="lg">AI</div>
    <div><h1>Kantor AI</h1><div class="sub">Tim pengawas web Monitoring · diperbarui <span id="upd">–</span></div></div>
    <div class="sp"></div>
    <span id="overall" class="pill idle"><i></i>Memuat…</span>
    <a class="btn" href="../" aria-label="Kembali ke Monitoring">←<span class="tx"> Monitoring</span></a>
  </header>
  <div id="stage"><div id="labels"></div></div>
  <aside id="panel"><p class="muted">Memuat kantor…</p></aside>
</div>
<div id="gate" class="gate" hidden></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CFG = { url: 'https://yoviojbfyvgpllxisjvy.supabase.co', key: 'sb_publishable_I26enb2Kz8iF4WFdH8vixA_8kek-kM9' };
const DEMO = new URLSearchParams(location.search).has('demo');
const APPS = { kmb: 'Manpower KMB', mbj: 'Manpower MBJ', 'bupr-ampah': 'Manpower BUPR', 'kta-tra': 'Manpower KTA-TRA', apd: 'APD', notulensi: 'Notulensi', 'unit-monitoring': 'Monitoring Unit' };
const LV = { ok: 'Aman', warn: 'Perlu dicek', crit: 'Gawat', idle: 'Menunggu' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const wib = (t) => new Date(t).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const mask = (e) => { const [u, d] = String(e || '').split('@'); return d ? u.slice(0, 3) + '…@' + d : (e || 'link tamu'); };

/* ---------- tim ---------- */
const TEAM = [
  { id: 'satpam', name: 'Satpam', role: 'Keamanan', shirt: 0x1e3a8a, pos: [-9, 0, -4], rug: 0xdbeafe, prop: 'gate' },
  { id: 'teknisi', name: 'Teknisi', role: 'Kesehatan web', shirt: 0x0f766e, pos: [-3, 0, -4], rug: 0xccfbf1, prop: 'rack' },
  { id: 'pencatat', name: 'Pencatat', role: 'Aktivitas Editor', shirt: 0xb45309, pos: [3, 0, -4], rug: 0xfef3c7, prop: 'shelf' },
  { id: 'marketing', name: 'Marketing', role: 'Penjualan Monitoring', shirt: 0xea580c, pos: [9, 0, -4], rug: 0xffedd5, prop: 'promo' },
  { id: 'resepsionis', name: 'Resepsionis', role: 'Akses & link', shirt: 0xbe185d, pos: [-7.5, 0, 3.8], rug: 0xfce7f3, prop: 'plant' },
  { id: 'manager', name: 'Manager Operasional', role: 'Terima permintaan & bagi tugas', shirt: 0x1f2937, pos: [0, 0, 3.8], rug: 0xe0e7ff, prop: 'tasks' },
  { id: 'sekretaris', name: 'Sekretaris', role: 'Laporan pagi', shirt: 0x6d28d9, pos: [7.5, 0, 3.8], rug: 0xede9fe, prop: 'board' },
];
const DIV = Object.fromEntries(TEAM.map((t) => [t.id, t.name]));
const JS = { antre: ['Antre', 'idle'], dikerjakan: ['Dikerjakan', 'ok'], butuh_persetujuan: ['Butuh persetujuan', 'warn'], disetujui: ['Disetujui', 'ok'], ditolak: ['Ditolak', 'idle'], selesai: ['Selesai', 'ok'], gagal: ['Gagal', 'crit'] };
const RS = { baru: ['Baru', 'warn'], direncanakan: ['Direncanakan', 'ok'], dikerjakan: ['Dikerjakan', 'ok'], butuh_persetujuan: ['Butuh persetujuan', 'warn'], selesai: ['Selesai', 'ok'], dibatalkan: ['Dibatalkan', 'idle'] };
let DATA = null, STATE = {}, SEL = 'manager', SB = null, RELOAD = () => {};

function derive(d) {
  const rep = d.last_report, chk = (rep && rep.checks) || {};
  const ageH = rep ? (Date.now() - new Date(rep.created_at).getTime()) / 36e5 : null;
  const pend = d.pending_requests || [], la = d.links_active || {};
  const fromCheck = (c, idleText) => c ? { level: c.level || 'ok', bubble: c.summary || LV[c.level || 'ok'], items: c.items || [] } : { level: 'idle', bubble: idleText, items: [] };
  const s = {};
  s.satpam = fromCheck(chk.security, 'Menunggu ronda pagi');
  s.teknisi = fromCheck(chk.web, 'Menunggu cek pagi');
  const n = d.activity_24h || 0, del = d.deletes_24h || 0;
  s.pencatat = { level: del >= 20 ? 'crit' : del >= 5 ? 'warn' : 'ok', bubble: del >= 5 ? `${del} penghapusan!` : n ? `${n} aktivitas hari ini` : 'Sepi, belum ada aktivitas', busy: n > 0 };
  s.resepsionis = { level: pend.length ? 'warn' : 'ok', bubble: pend.length ? `${pend.length} tamu menunggu izin` : 'Tidak ada antrean', busy: (d.links_expiring_3d || 0) > 0 };
  if (!rep) s.sekretaris = { level: 'idle', bubble: 'Laporan pertama 08.00' };
  else if (ageH > 26) s.sekretaris = { level: 'warn', bubble: 'Laporan terlambat' };
  else s.sekretaris = { level: rep.level, bubble: rep.level === 'ok' ? 'Laporan pagi siap' : 'Ada temuan di laporan' };
  // tugas dari Manager
  const reqs = (d.requests || []).filter((q) => q.status !== 'dibatalkan');
  const jobs = reqs.flatMap((q) => q.jobs || []);
  s.marketing = { level: 'idle', bubble: 'Siap promosi Monitoring' };
  for (const t of TEAM) {
    if (t.id === 'manager') continue;
    const mine = jobs.filter((j) => j.division === t.id), need = mine.filter((j) => j.status === 'butuh_persetujuan'), act = mine.filter((j) => ['antre', 'dikerjakan', 'disetujui'].includes(j.status));
    if (need.length) s[t.id] = { level: s[t.id].level === 'crit' ? 'crit' : 'warn', bubble: 'Butuh persetujuan Anda', busy: true };
    else if (act.length) s[t.id] = { level: s[t.id].level === 'idle' ? 'ok' : s[t.id].level, bubble: '✍️ ' + act[0].title.slice(0, 34), busy: true };
  }
  const baru = reqs.filter((q) => q.status === 'baru').length, need = jobs.filter((j) => j.status === 'butuh_persetujuan').length, act = jobs.filter((j) => ['antre', 'dikerjakan', 'disetujui'].includes(j.status)).length;
  s.manager = baru ? { level: 'ok', bubble: `${baru} permintaan baru, segera dibagi`, busy: true }
    : need ? { level: 'warn', bubble: `${need} tugas menunggu persetujuan` }
    : act ? { level: 'ok', bubble: `Mengawasi ${act} tugas`, busy: true } : { level: 'idle', bubble: 'Siap menerima permintaan' };
  return s;
}
function overallOf(s) { const L = Object.values(s).map((x) => x.level); return L.includes('crit') ? 'crit' : L.includes('warn') ? 'warn' : L.every((x) => x === 'idle') ? 'idle' : 'ok'; }

/* ---------- panel ---------- */
function md(t) {
  const out = []; let list = false;
  for (const raw of String(t || '').split('\n')) {
    const line = esc(raw.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^[-•*] /.test(raw.trim())) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + line.replace(/^[-•*] /, '') + '</li>'); continue; }
    if (list) { out.push('</ul>'); list = false; }
    if (!line) continue;
    out.push(/^#{1,4} /.test(raw.trim()) ? '<h4>' + line.replace(/^#{1,4} /, '') + '</h4>' : '<p>' + line + '</p>');
  }
  if (list) out.push('</ul>');
  return out.join('');
}
function jobHtml(j, showWho) {
  const [lab, cls] = JS[j.status] || [j.status, 'idle'];
  return `<div class="job"><div class="jt"><span class="chip ${cls}">${lab}</span><b>${esc(j.title)}</b>${showWho ? `<span class="who">· ${esc(DIV[j.division] || j.division)}</span>` : ''}</div>
    ${j.status === 'butuh_persetujuan' ? `${j.proposal ? `<div class="prop">${md(j.proposal)}</div>` : ''}<div class="acts"><button type="button" class="btn pri" data-dec="${j.id}|1">Setujui</button><button type="button" class="btn" data-dec="${j.id}|0">Tolak</button></div>` : ''}
    ${j.result ? `<details${j.status === 'selesai' && !showWho ? ' open' : ''}><summary>Hasil kerja</summary><div class="res">${md(j.result)}</div></details>` : ''}</div>`;
}
function reqHtml(q) {
  const [lab, cls] = RS[q.status] || [q.status, 'idle'];
  return `<div class="rq"><div class="top"><p>${esc(q.text)}</p><span class="chip ${cls}">${lab}</span></div>
    <div class="meta">Dikirim ${wib(q.created_at)} WIB${q.manager_note ? ' · Manager: ' + esc(q.manager_note) : ''}</div>
    ${(q.jobs || []).map((j) => jobHtml(j, true)).join('') || (q.status === 'baru' ? '<div class="meta">Menunggu Manager membagi tugas (dicek tiap jam, 07.00–22.00 WIB).</div>' : '')}
    ${['baru', 'direncanakan', 'dikerjakan', 'butuh_persetujuan'].includes(q.status) ? `<div class="acts"><button type="button" class="btn" data-cancel="${q.id}">Batalkan</button></div>` : ''}</div>`;
}
function panel() {
  const d = DATA, w = TEAM.find((t) => t.id === SEL), st = STATE[SEL] || { level: 'idle', bubble: '' };
  const reqs = d.requests || [];
  const myJobs = reqs.filter((q) => q.status !== 'dibatalkan').flatMap((q) => q.jobs || []).filter((j) => j.division === SEL);
  let body = '';
  if (SEL === 'satpam' || SEL === 'teknisi') {
    const c = d.last_report && d.last_report.checks && d.last_report.checks[SEL === 'satpam' ? 'security' : 'web'];
    body = c ? `${(c.items || []).length ? '<ul>' + c.items.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' : ''}<p class="muted">Diperiksa ${wib(d.last_report.created_at)} WIB.</p>`
      : `<p class="muted">${SEL === 'satpam' ? 'Satpam memeriksa Security Advisor Supabase, login mencurigakan, dan penghapusan massal' : 'Teknisi memeriksa apakah 9 halaman web hidup dan ada error di log'} setiap pagi pukul 08.00 WIB.</p>`;
  } else if (SEL === 'pencatat') {
    const by = Object.entries(d.activity_by_app || {});
    body = `<div class="kv"><span>Aktivitas 24 jam</span><b>${d.activity_24h || 0}</b><span>Orang yang mengubah</span><b>${d.actors_24h || 0}</b><span>Penghapusan 24 jam</span><b>${d.deletes_24h || 0}</b></div>`
      + (by.length ? '<b>Per web</b><ul>' + by.map(([a, n]) => `<li>${esc(APPS[a] || a)}: ${n}</li>`).join('') + '</ul>' : '')
      + '<b>Terakhir</b><ul>' + (d.activity_recent || []).map((r) => `<li><span class="muted">${wib(r.at)}</span> · ${esc(APPS[r.app] || r.app)}${r.site ? ' (' + esc(r.site) + ')' : ''}: ${esc(r.action).slice(0, 90)} <span class="muted">— ${esc(mask(r.actor))}</span></li>`).join('') + '</ul>';
  } else if (SEL === 'resepsionis') {
    const la = d.links_active || {}, pend = d.pending_requests || [];
    body = `<div class="kv"><span>Permintaan akses</span><b>${pend.length}</b><span>Link Pelihat aktif</span><b>${la.viewer || 0}</b><span>Link Editor tanpa login</span><b>${la.editor || 0}</b><span>Kedaluwarsa ≤ 3 hari</span><b>${d.links_expiring_3d || 0}</b><span>Login 24 jam</span><b>${d.signins_24h || 0}</b></div>`
      + (pend.length ? '<b>Menunggu izin</b><ul>' + pend.map((p) => `<li>${esc(mask(p.email))} → ${esc(APPS[p.app_id] || p.app_id)}</li>`).join('') + '</ul>' : '')
      + ((la.editor || 0) ? '<p class="muted">Saran: cabut link Editor tanpa login; Editor sebaiknya masuk dengan kode email.</p>' : '')
      + '<a class="btn" href="../#akses">Kelola akses →</a>';
  } else if (SEL === 'manager') {
    body = `<form class="ask" id="askForm"><div class="sec">Permintaan baru</div><textarea id="askText" maxlength="4000" placeholder="Contoh: Siapkan bahan untuk menawarkan Monitoring ke kontraktor tambang lain: brosur, harga, dan pesan WhatsApp."></textarea>
      <div class="row"><span class="muted">Manager membaginya ke tim dalam ±1 jam.</span><button type="submit" class="btn pri">Kirim</button></div></form>
      <div class="sec">Permintaan Anda</div>${reqs.length ? reqs.map(reqHtml).join('') : '<p class="muted">Belum ada permintaan.</p>'}`;
  } else if (SEL === 'marketing') {
    body = `<p class="muted">Marketing menyiapkan bahan untuk menjual Monitoring: profil produk, daftar harga, brosur, pesan WhatsApp/email penawaran, dan riset calon pembeli. Kirim permintaan lewat Manager Operasional. Apa pun yang dikirim ke orang luar selalu menunggu persetujuan Anda.</p>`;
  } else {
    const r = d.last_report;
    body = r ? `<p class="muted">Laporan ${wib(r.created_at)} WIB</p><div class="rep">${md(r.body || r.summary)}</div>` : '<p class="muted">Sekretaris menyusun laporan setiap pagi pukul 08.00 WIB dan mengirimnya ke HP serta email Anda. Laporan pertama muncul besok pagi.</p>';
  }
  if (SEL !== 'manager') body += myJobs.length ? '<div class="sec">Tugas dari Manager</div>' + myJobs.map((j) => jobHtml(j, false)).join('') : (SEL === 'marketing' ? '<p class="muted">Belum ada tugas.</p>' : '');
  $('panel').innerHTML = `<div class="role">${esc(w.role)}</div><h2>${esc(w.name)}</h2><div class="big ${st.level}"><b>${LV[st.level]}</b> · ${esc(st.bubble)}</div>${body}
    <div class="team">${TEAM.map((t) => `<button type="button" data-w="${t.id}" class="${t.id === SEL ? 'on' : ''}"><span class="pill ${STATE[t.id].level}" style="padding:3px 6px"><i></i></span><span>${t.name}</span><span class="muted">${esc(t.role)}</span></button>`).join('')}</div>`;
}
$('panel').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-w]'); if (b) { select(b.dataset.w); return; }
  const dec = e.target.closest('[data-dec]'), can = e.target.closest('[data-cancel]');
  if (!dec && !can) return;
  if (can && !confirm('Batalkan permintaan ini?')) return;
  e.target.disabled = true;

});

const COL = { ok: 0x22c55e, warn: 0xf59e0b, crit: 0xef4444, idle: 0x94a3b8 };
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const r = renderer.domElement.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, cam);
  for (const h of ray.intersectObjects(scene.children, true)) { const id = Object.keys(W).find((k) => { let o = h.object; while (o) { if (o === W[k].g) return true; o = o.parent; } return false; }); if (id) { select(id); break; } }
});

function select(id) { SEL = id; Object.entries(W).forEach(([k, w]) => w.tag.classList.toggle('sel', k === id)); if (DATA) panel(); }

function fit() {
  const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
  const half = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * cam.aspect; // lebar pandang
  const dist = Math.min(80, Math.max(27, 14.5 / half));
  const dir = new THREE.Vector3(0.55, 0.85, 1).normalize(); cam.position.copy(ctl.target).addScaledVector(dir, dist);
}
new ResizeObserver(fit).observe(stage); fit();

const v = new THREE.Vector3(), clock = new THREE.Clock();
function loop() {
  const t = clock.getElapsedTime(), W0 = stage.clientWidth, H0 = stage.clientHeight;
  for (const [id, w] of Object.entries(W)) {
    const s = STATE[id] || { level: 'idle' }, ph = t * 1 + w.phase;
    w.lamp.material.color.setHex(COL[s.level]); w.lamp.material.emissive.setHex(COL[s.level]);
    w.lamp.material.emissiveIntensity = s.level === 'crit' ? 0.6 + Math.abs(Math.sin(t * 5)) * 1.6 : s.level === 'warn' ? 0.7 + Math.abs(Math.sin(t * 2.5)) * 0.8 : 1;
    w.scr.material.emissive.setHex(s.level === 'crit' ? 0xef4444 : s.level === 'warn' ? 0xf59e0b : 0x60a5fa);
    const alert = s.level === 'warn' || s.level === 'crit';
    if (alert) { // berdiri, menoleh ke kamera, melambai
      w.p.position.y = 0.05 + Math.abs(Math.sin(ph * 3)) * 0.06; w.p.rotation.y = Math.PI * 0.15;
      w.armR.rotation.z = 2.6 + Math.sin(ph * 6) * 0.35; w.armL.rotation.x = 0; w.head.rotation.y = Math.sin(ph) * 0.2;
    } else if (s.level === 'idle') {
      w.p.position.y = Math.sin(ph * 1.2) * 0.015; w.p.rotation.y = Math.PI; w.armR.rotation.set(0, 0, 0); w.armL.rotation.set(0, 0, 0); w.head.rotation.y = Math.sin(ph * 0.4) * 0.5;
    } else { // mengetik
      const sp = s.busy ? 14 : 7; w.p.position.y = 0; w.p.rotation.y = Math.PI; w.armR.rotation.z = 0;
      w.armL.rotation.x = -1.1 + Math.sin(ph * sp) * 0.15; w.armR.rotation.x = -1.1 + Math.cos(ph * sp) * 0.15; w.head.rotation.y = Math.sin(ph * 0.7) * 0.15;
    }
    v.set(0, alert ? 2.75 : 2.6, 0.45).applyMatrix4(w.g.matrixWorld).project(cam);
    w.tag.style.left = ((v.x + 1) / 2) * W0 + 'px'; w.tag.style.top = ((1 - v.y) / 2) * H0 + 'px';
    w.tag.style.display = v.z < 1 ? '' : 'none';
  }
  ctl.update(); renderer.render(scene, cam); requestAnimationFrame(loop);
}
loop();

function apply(d) {
  DATA = d; STATE = derive(d);
  for (const [id, w] of Object.entries(W)) { const s = STATE[id], b = w.tag.querySelector('.bub'); b.className = 'bub ' + s.level; b.textContent = s.bubble; w.tag.querySelector('.nm i').className = s.level; w.tag.classList.toggle('hot', s.level === 'warn' || s.level === 'crit'); }
  const o = overallOf(STATE); $('overall').className = 'pill ' + o; $('overall').innerHTML = '<i></i>' + (o === 'ok' ? 'Semua aman' : o === 'warn' ? 'Ada yang perlu dicek' : o === 'crit' ? 'Ada masalah!' : 'Menunggu laporan pertama');
  $('upd').textContent = wib(d.now || Date.now()); select(SEL);
}

async function start() {
  if (DEMO) { const b = document.createElement('span'); b.className = 'pill warn demo'; b.innerHTML = '<i></i>Mode contoh, bukan data asli'; stage.appendChild(b); apply(demoData()); return; }
  await new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js'; s.onload = ok; s.onerror = no; document.head.appendChild(s); })
    .catch(() => gate('Gagal memuat', 'Periksa koneksi internet lalu muat ulang halaman.'));
  if (!window.supabase) return;
  const sb = SB = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'kta-web-auth' } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { gate('Khusus Pemilik', 'Masuk dulu di halaman Monitoring, lalu buka Kantor AI lagi.', '<a class="btn" href="../">Masuk di Monitoring →</a> <a class="btn" href="?demo">Lihat contoh</a>'); return; }
  const load = async () => {
    const { data, error } = await sb.rpc('office_status');
    if (error) { /Pemilik/.test(error.message) ? gate('Khusus Pemilik', 'Kantor AI hanya bisa dibuka oleh Pemilik web Monitoring.', '<a class="btn" href="../">← Kembali</a>') : ($('overall').textContent = 'Gagal memuat: ' + error.message); return; }
    $('gate').hidden = true; apply(data);
  };
  RELOAD = load; await load(); setInterval(() => { if (!document.activeElement || document.activeElement.id !== 'askText') load(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
}
