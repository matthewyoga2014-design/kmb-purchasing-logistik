function latestIssue(pid,type){return data.transactions.filter(t=>t.to===pid&&t.type===type&&t.event.startsWith('SERAH')).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function due(pid,type){let t=latestIssue(pid,type);return t?addMonths(t.date,t.months||6):null}
function replacementStatus(pid,type){if(held(pid,type)<=0)return null;const t=latestIssue(pid,type),date=due(pid,type);if(!date||!t)return null;const day=Math.ceil((new Date(date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);return {date,day,months:Number(t.months||6),last:t.date,status:day<=0?'JATUH TEMPO':day<=30?'SEGERA GANTI':'AMAN'}}
function badge(s){return '<span class="pill '+(s==='KELUAR'||s==='JATUH TEMPO'?'red':s==='AKTIF'?'green':'')+'">'+esc(s)+'</span>'}
function nav(n,label){let a=label.split(' ');return '<button class="nav '+(view===n?'active':'')+'" onclick="go(\''+n+'\')"><span class="nav-symbol">'+a.shift()+'</span><span>'+a.join(' ')+'</span></button>'}
function go(n){view=n;selected=null;render();if(n==='users'&&role==='owner')loadAccess()}function can(){if(!canEdit()){alert('Hanya Pemilik atau Editor yang dapat mengubah data');return false}return true}
function render(){root.innerHTML=layout();}
function layout(){return '<div class="shell"><aside class="side"><div class="brand">KMB</div>'+nav('dashboard','▦ Dashboard')+nav('people','♙ Manpower')+nav('stock','▤ Stok APD')+nav('transactions','⇄ Mutasi')+nav('out','↗ MP Keluar')+nav('users','⚙ Akses')+'</aside><main class="main"><header class="top"><div><div class="muted">PT KARUNIA MANDIRI BERKARYA</div><h1>Monitoring APD KMB</h1><div class="muted">Dashboard Monitoring Penggunaan &amp; Pergantian APD</div></div><div><span class="pill">'+(role==='owner'?'Pemilik':role==='editor'?'Editor':'Pelihat')+'</span> <span class="muted">'+esc(user?.email||'Belum masuk')+'</span> <button class="btn" onclick="'+(user?'logout()':'login()')+'">'+(user?'Keluar':'Masuk')+'</button></div></header><div class="status">● '+(busy?'Menyimpan...':user?'Database online terhubung':'Masuk untuk melihat data')+'</div>'+(!user?'<section class="panel"><h2>Masuk menggunakan akun KMB</h2><p>Gunakan akun Supabase yang sama dengan Monitoring Manpower KTA–TRA dan KMB.</p><button class="btn primary" onclick="login()">Masuk</button></section>':body())+'</main></div>'+(dialog?modal():'')}
function body(){if(view==='dashboard')return dashboard();if(view==='people'||view==='out')return peoplePage();if(view==='stock')return stockPage();if(view==='transactions')return txPage();return usersPage()}
function guideBox(){return '<section class="panel"><h2>Cara Mengisi APD (4 Langkah)</h2><p>1. Buka Manpower dan cek nama karyawan. 2. Di Mutasi APD pilih MASUK BARU untuk mencatat pembelian. 3. Gunakan SERAH BARU atau SERAH BEKAS saat APD diberikan. 4. Saat karyawan keluar, ubah status dan catat KEMBALI LAYAK, KEMBALI RUSAK, atau DIBAWA KELUAR.</p><button class="btn primary" onclick="go(\'transactions\')">Panduan & Transaksi →</button></section>'}

function dashboard(){
 const active=data.people.filter(p=>p.status==='AKTIF');
 const entries=active.flatMap(p=>TYPES.map(type=>({p,type,r:replacementStatus(p.id,type)})).filter(x=>x.r));
 const due=entries.filter(x=>x.r.day<=0),soon=entries.filter(x=>x.r.day>0&&x.r.day<=30),safe=entries.filter(x=>x.r.day>30);
 const warehouse=TYPES.map(type=>({type,...inv(type)}));
 const stock=warehouse.reduce((n,x)=>n+x.new+x.used,0);
 const attention=new Set([...due,...soon].map(x=>x.p.id)).size;
 const cards=[['♟',active.length,'Manpower Aktif','blue'],['▦',due.length,'APD Jatuh Tempo','red'],['▣',stock,'Stok APD','green'],['⚠',attention,'Perlu Dipantau','yellow']];
 const counts={due:due.length,soon:soon.length,safe:safe.length};
 const colors={due:'#f0475d',soon:'#f7a23a',safe:'#20aa80'};
 const max=Math.max(1,...warehouse.map(x=>x.new+x.used+x.bad));
 const replacementBars=TYPES.map(type=>{const rows=entries.filter(x=>x.type===type);return {type,due:rows.filter(x=>x.r.day<=0).length,soon:rows.filter(x=>x.r.day>0&&x.r.day<=30).length,safe:rows.filter(x=>x.r.day>30).length}});const replacementMax=Math.max(1,...replacementBars.map(x=>x.due+x.soon+x.safe));
 const replacementChart='<section class="panel kmb-chart-panel"><div class="chart-header"><h2><span class="kmb-chart-icon">▦</span> Monitoring Pergantian APD</h2><span class="pill">'+entries.length+' terpantau</span></div><div class="kmb-chart-grid"><div class="kmb-y-scale"><span>'+replacementMax+'</span><span>'+Math.round(replacementMax/2)+'</span><span>0</span></div><div class="kmb-plot">'+replacementBars.map(x=>'<div class="kmb-plot-col"><div class="kmb-stack" title="'+x.type+': jatuh tempo '+x.due+', segera '+x.soon+', aman '+x.safe+'">'+[['due',x.due],['soon',x.soon],['safe',x.safe]].map(([key,v])=>'<div style="height:'+(100*v/replacementMax)+'%;background:'+colors[key]+'"></div>').join('')+'</div><b>'+x.type+'</b></div>').join('')+'</div></div><div class="kmb-chart-legend"><span><i style="background:'+colors.due+'"></i>Jatuh Tempo <b>'+counts.due+'</b></span><span><i style="background:'+colors.soon+'"></i>Segera Ganti <b>'+counts.soon+'</b></span><span><i style="background:'+colors.safe+'"></i>Aman <b>'+counts.safe+'</b></span></div></section>';
 const stockChart='<section class="panel kmb-chart-panel"><div class="chart-header"><h2><span class="kmb-chart-icon">▥</span> Monitoring Stok APD</h2><button class="btn" onclick="go(\'stock\')">Semua Stok →</button></div><div class="kmb-chart-grid"><div class="kmb-y-scale"><span>'+max+'</span><span>'+Math.round(max/2)+'</span><span>0</span></div><div class="kmb-plot">'+warehouse.map(x=>'<div class="kmb-plot-col"><div class="kmb-group-bars">'+[['new','#2d82e8'],['used','#20aa80'],['bad','#f0475d']].map(([k,c])=>'<div class="kmb-group-bar" style="height:'+(100*x[k]/max)+'%;background:'+c+'" title="'+x.type+' '+k+': '+x[k]+' pcs"><b>'+x[k]+'</b></div>').join('')+'</div><b>'+x.type+'</b></div>').join('')+'</div></div><div class="kmb-chart-legend"><span><i style="background:#2d82e8"></i>Baru</span><span><i style="background:#20aa80"></i>Bekas Layak</span><span><i style="background:#f0475d"></i>Rusak</span></div></section>';
 const products='<section class="panel"><div class="chart-header"><h2><span class="kmb-chart-icon">▰</span> Jenis APD Utama</h2><button class="btn" onclick="go(\'stock\')">Lihat Detail →</button></div><div class="apd-product-grid">'+warehouse.map(x=>'<div class="apd-product"><div class="apd-product-art">'+(data.productImages?.[x.type]?'<img src="'+data.productImages[x.type]+'" alt="Gambar '+x.type+'" class="apd-realistic-art">':apdArtwork(x.type))+'</div><div class="apd-product-name">'+(x.type==='HELM'?'Helm Safety':x.type==='KAOS'?'Kaos Kerja KMB':'Sepatu Safety')+'</div><span class="pill">WAJIB</span><div class="muted" style="margin-top:10px">Stok tersedia</div><div class="apd-product-count">'+(x.new+x.used)+' <span style="font-size:12px">unit</span></div></div>').join('')+'</div></section>';
 const personnel='<section class="panel"><div class="chart-header"><h2><span class="kmb-chart-icon">♟</span> Status APD Personel</h2><button class="btn" onclick="go(\'people\')">Lihat Semua →</button></div><div class="tablebox"><table><thead><tr><th>No</th><th>Nama</th><th>Jobsite</th>'+TYPES.map(t=>'<th>'+t+'</th>').join('')+'<th>Status</th></tr></thead><tbody>'+active.slice(0,8).map((p,i)=>{const states=TYPES.map(t=>replacementStatus(p.id,t));const status=states.some(x=>x&&x.day<=0)?'JATUH TEMPO':states.some(x=>x&&x.day<=30)?'SEGERA GANTI':'AMAN';return '<tr><td>'+(i+1)+'</td><td><button class="link" onclick="detail(\''+p.id+'\')">'+esc(p.name)+'</button></td><td>'+esc(p.site)+'</td>'+TYPES.map((t,i)=>'<td><span class="kmb-state-icon '+(held(p.id,t)<=0?'empty':!states[i]?'empty':states[i].day<=0?'overdue':states[i].day<=30?'soon':'ok')+'">'+(held(p.id,t)<=0?'–':!states[i]?'?':states[i].day<=0?'×':states[i].day<=30?'◷':'✓')+'</span></td>').join('')+'<td>'+badge(status)+'</td></tr>'}).join('')+'</tbody></table></div><p class="muted" style="margin-top:12px">Status dihitung dari APD yang masih dipegang dan jatah penggantian yang tercatat.</p></section>';
 const reminders=[...due,...soon].sort((a,b)=>a.r.day-b.r.day);
 const followup='<section class="panel"><div class="chart-header"><h2>Daftar Jatah Penggantian APD</h2><span class="pill">'+reminders.length+' perlu ditindaklanjuti</span></div><div class="tablebox"><table><thead><tr><th>Nama</th><th>APD</th><th>Terakhir Terima</th><th>Jatah</th><th>Jadwal Ganti</th><th>Status</th></tr></thead><tbody>'+(reminders.length?reminders.map(x=>'<tr><td><button class="link" onclick="detail(\''+x.p.id+'\')">'+esc(x.p.name)+'</button></td><td>'+x.type+'</td><td>'+fmt(x.r.last)+'</td><td>'+x.r.months+' bulan</td><td>'+fmt(x.r.date)+'</td><td>'+badge(x.r.status)+'</td></tr>').join(''):'<tr><td colspan="6">Belum ada penggantian jatuh tempo atau dalam 30 hari.</td></tr>')+'</tbody></table></div></section>';
 return '<div class="cards">'+cards.map(([icon,value,label,theme])=>'<div class="card"><div class="metric-icon kmb-'+theme+'">'+icon+'</div><div class="number">'+value+'</div><div class="muted">'+label+'</div></div>').join('')+'</div><div class="kmb-dashboard-charts">'+replacementChart+stockChart+'</div><div class="kmb-dashboard-details">'+products+personnel+'</div>'+followup;
}

function validateLedger(transactions){
 const stocks={};const holdings={};let sorted=[...transactions].sort((a,b)=>a.date.localeCompare(b.date));
 for(const t of sorted){const q=Number(t.qty);if(!(q>0))return 'Jumlah transaksi tidak valid';let x=stocks[t.type]||(stocks[t.type]={new:0,used:0,bad:0});let h=holdings[t.from+'|'+t.type]||0;
 if(t.event==='MASUK BARU')x.new+=q;
 else if(t.event==='SERAH BARU'){x.new-=q;holdings[t.to+'|'+t.type]=(holdings[t.to+'|'+t.type]||0)+q}
 else if(t.event==='SERAH BEKAS'){x.used-=q;holdings[t.to+'|'+t.type]=(holdings[t.to+'|'+t.type]||0)+q}
 else if(t.event==='KEMBALI LAYAK'){holdings[t.from+'|'+t.type]=h-q;x.used+=q}
 else if(t.event==='KEMBALI RUSAK'){holdings[t.from+'|'+t.type]=h-q;x.bad+=q}
 else if(t.event==='DIBAWA KELUAR'){holdings[t.from+'|'+t.type]=h-q}
 else if(t.event==='MUSNAH')x.used-=q;
 if(x.new<0||x.used<0||x.bad<0||Object.values(holdings).some(v=>v<0))return 'Penghapusan menyebabkan saldo stok atau APD karyawan menjadi negatif. Hapus atau koreksi transaksi lanjutan lebih dulu.';
 }return null;
}
async function deleteTx(txid){
 if(!can())return;const t=data.transactions.find(x=>x.id===txid);if(!t)return;
 if(!confirm('Hapus transaksi '+t.event+' '+t.qty+' '+t.type+' tanggal '+fmt(t.date)+'?\\nData yang dihapus tidak dapat dikembalikan kecuali dari backup.'))return;
 const n=structuredClone(data);n.transactions=n.transactions.filter(x=>x.id!==txid);
 const err=validateLedger(n.transactions);if(err){alert(err);return}
 await persist(n);
}

async function saveApdImage(input,type){

 try{
  const url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(Error('Gagal membaca gambar'));reader.readAsDataURL(file)});

function exportExcel(){if(!user)return alert('Login diperlukan');if(!window.XLSX)return alert('Library Excel belum siap, periksa koneksi internet.');const wb=XLSX.utils.book_new();const mp=data.people.map(p=>({ID:p.id,Nama:p.name,Jabatan:p.position,Jobsite:p.site,Status:p.status,'Tanggal Keluar':p.exitDate||'',Helm:held(p.id,'HELM'),Kaos:held(p.id,'KAOS'),Sepatu:held(p.id,'SEPATU'), 'Ganti Helm':due(p.id,'HELM')||'','Ganti Kaos':due(p.id,'KAOS')||'','Ganti Sepatu':due(p.id,'SEPATU')||''}));const stocks=TYPES.map(t=>({Jenis:t,'Stok Baru':inv(t).new,'Bekas Layak':inv(t).used,Rusak:inv(t).bad,'Dipegang Karyawan':data.people.reduce((n,p)=>n+held(p.id,t),0)}));const tx=data.transactions.map(t=>({Tanggal:t.date,Jenis:t.type,Transaksi:t.event,Jumlah:t.qty,'Pemegang Lama':data.people.find(p=>p.id===t.from)?.name||'','Penerima':data.people.find(p=>p.id===t.to)?.name||'',Kondisi:t.condition||'',Jatah_Bulan:t.months||'',Lokasi:t.location||'',PIC:t.pic||'',Bukti:t.doc||'',Keterangan:t.note||''}));[['MANPOWER',mp],['STOK APD',stocks],['RIWAYAT MUTASI',tx]].forEach(([name,rows])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{Keterangan:'Belum ada data'}]),name));XLSX.writeFile(wb,'Monitoring_APD_KMB_'+today()+'.xlsx')}

function openPerson(pid){if(!can())return;selected=pid||null;dialog='person';render()}function openTx(){if(!can())return;dialog='tx';render();updateTxHelp('MASUK BARU')}function closeDialog(){dialog='';render()}
function updateTxHelp(event){
 const el=document.querySelector('#txExplanation');if(el)el.textContent=EXPLAIN[event]||'';
 const form=document.querySelector('#apdTxForm');if(!form)return;
 const outgoing=['KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR','INSPEKSI LAYAK','INSPEKSI TIDAK LAYAK','MASIH DIPAKAI'].includes(event);
 const incoming=['SERAH BARU','SERAH BEKAS'].includes(event);
 const from=document.querySelector('#txFromWrap'),to=document.querySelector('#txToWrap'),condition=document.querySelector('#txConditionWrap'),months=document.querySelector('#txMonthsWrap');
 if(from)from.style.display=outgoing?'grid':'none';
 if(to)to.style.display=incoming?'grid':'none';
 if(condition)condition.style.display=outgoing?'grid':'none';if(months)months.style.display=incoming?'grid':'none';
 const select=form.querySelector('[name=condition]');if(select){select.value=event==='KEMBALI RUSAK'?'RUSAK':event==='DIBAWA KELUAR'?'DIBAWA KELUAR':event==='MASIH DIPAKAI'?'MASIH DIPAKAI':'LAYAK';select.disabled=true}
 const flow=document.querySelector('#txFlow');if(flow)flow.textContent=outgoing?'APD karyawan → '+(event==='KEMBALI LAYAK'?'Gudang Bekas Layak':event==='KEMBALI RUSAK'?'Catatan APD Rusak':'Dibawa Karyawan Keluar'):incoming?(event==='SERAH BARU'?'Gudang APD Baru':'Gudang APD Bekas Layak')+' → Karyawan':'Stok gudang diperbarui';
}
function personDetail(p){
 const outgoing=['KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR'];const inspections=['INSPEKSI LAYAK','INSPEKSI TIDAK LAYAK','MASIH DIPAKAI'];
 const names={'SERAH BARU':'Diterima baru','SERAH BEKAS':'Diterima bekas layak','KEMBALI LAYAK':'Dikembalikan layak','KEMBALI RUSAK':'Dikembalikan rusak','DIBAWA KELUAR':'Dibawa keluar','INSPEKSI LAYAK':'Inspeksi: layak pakai','INSPEKSI TIDAK LAYAK':'Inspeksi: tidak layak','MASIH DIPAKAI':'Masih dipakai'};
 const cards=TYPES.map(type=>{
  const records=data.transactions.filter(t=>t.type===type&&((t.to===p.id&&t.event.startsWith('SERAH'))||(t.from===p.id&&(outgoing.includes(t.event)||inspections.includes(t.event))))).sort((a,b)=>a.date.localeCompare(b.date));
  const arrivals=records.filter(t=>t.to===p.id&&t.event.startsWith('SERAH'));
  const departures=records.filter(t=>t.from===p.id&&outgoing.includes(t.event));
  let onHand=held(p.id,type),returned=departures.filter(t=>t.event==='KEMBALI LAYAK').reduce((a,t)=>a+Number(t.qty),0),damaged=departures.filter(t=>t.event==='KEMBALI RUSAK').reduce((a,t)=>a+Number(t.qty),0),taken=departures.filter(t=>t.event==='DIBAWA KELUAR').reduce((a,t)=>a+Number(t.qty),0);
  let rows=records.map((t,i)=>'<tr><td>'+fmt(t.date)+'</td><td>'+esc(names[t.event]||t.event)+'</td><td>'+Number(t.qty)+'</td><td>'+(t.event.startsWith('SERAH')?Number(t.months||6)+' bulan':'–')+'</td><td>'+(t.event.startsWith('SERAH')?fmt(addMonths(t.date,t.months||6)):'–')+'</td><td>'+esc(t.note||t.location||'–')+'</td></tr>').join('');
  const lastInspection=records.filter(t=>inspections.includes(t.event)).slice(-1)[0];const currentStatus=onHand>0?(lastInspection?(lastInspection.event==='INSPEKSI LAYAK'?'Masih dipegang — Layak pakai (pemeriksaan '+fmt(lastInspection.date)+')':lastInspection.event==='MASIH DIPAKAI'?'Masih dipakai (konfirmasi '+fmt(lastInspection.date)+')':'Masih dipegang — Tidak layak (pemeriksaan '+fmt(lastInspection.date)+')'):'Masih dipegang — belum diperiksa'):departures.length?(departures[departures.length-1].event==='KEMBALI LAYAK'?'Terakhir dikembalikan layak':departures[departures.length-1].event==='KEMBALI RUSAK'?'Terakhir dikembalikan rusak':'Terakhir dibawa keluar'):'Belum ada APD diterima';
  return '<div class="card" style="margin:14px 0;padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b style="font-size:17px">'+type+'</b><div class="muted">'+esc(currentStatus)+'</div></div>'+(canEdit()?'<button class="btn primary" onclick="giveApd(\''+p.id+'\',\''+type+'\')">+ Terima APD</button>':'')+'</div><div class="inputgrid" style="margin:15px 0"><div><small class="muted">Dipegang saat ini</small><div class="number">'+onHand+'</div></div><div><small class="muted">Penerimaan pertama</small><p>'+fmt(arrivals[0]?.date)+'</p></div><div><small class="muted">Penerimaan kedua</small><p>'+fmt(arrivals[1]?.date)+'</p></div><div><small class="muted">Total dikembalikan layak / rusak / dibawa</small><p>'+returned+' / '+damaged+' / '+taken+'</p></div></div><b>Riwayat penerimaan dan pergerakan APD</b><div class="tablebox" style="margin-top:10px"><table><thead><tr><th>Tanggal</th><th>Aktivitas / Kondisi</th><th>Jumlah</th><th>Jatah</th><th>Jadwal ganti</th><th>Keterangan</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="muted">Belum ada riwayat untuk '+type+'</td></tr>')+'</tbody></table></div><p class="muted" style="margin-top:12px">Catatan: kondisi APD yang masih dipegang belum dapat dinyatakan layak/rusak sebelum pemeriksaan fisik. Riwayat pengembalian mengikuti transaksi yang tercatat.</p></div>';
 }).join('');
 return '<p>'+esc(p.position)+' • '+esc(p.site)+' • '+badge(p.status)+'</p><div class="notice"><b>Riwayat APD per karyawan</b> — Penerimaan pertama, kedua, dan berikutnya tetap tersimpan. Saat APD lama dikembalikan, gunakan transaksi KEMBALI LAYAK atau KEMBALI RUSAK; jika dibawa saat keluar, gunakan DIBAWA KELUAR. Periksa kondisi barang sebelum mengembalikannya ke stok bekas layak.</div>'+cards+(canEdit()?'<button class="btn" onclick="openPerson(\''+p.id+'\')">Edit Data Karyawan</button>':'');
}
function modal(){let p=data.people.find(x=>x.id===selected)||{};let options=data.people.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');return '<div class="modalback" onclick="if(event.target===this)closeDialog()"><div class="dialog"><div class="toolbar"><h2 style="flex:1">'+(dialog==='detail'?'Detail APD '+esc(p.name):dialog==='person'?'Data Manpower':'Mutasi / Serah Terima APD')+'</h2><button class="btn" onclick="closeDialog()">✕</button></div>'+(dialog==='detail'?personDetail(p):dialog==='person'?'<form onsubmit="savePerson(event)"><div class="inputgrid"><label>Nama<input name="name" required value="'+esc(p.name||'')+'"></label><label>Jabatan<input name="position" required value="'+esc(p.position||'')+'"></label><label>Jobsite<input name="site" required value="'+esc(p.site||'')+'"></label><label>Status<select name="status"><option '+(p.status!=='KELUAR'?'selected':'')+'>AKTIF</option><option '+(p.status==='KELUAR'?'selected':'')+'>KELUAR</option></select></label><label>Tanggal Keluar<input name="exitDate" type="date" value="'+esc(p.exitDate||'')+'"></label><label>Keterangan<input name="notes" value="'+esc(p.notes||'')+'"></label></div><p class="notice">Jika keluar, catat juga pengembalian atau APD dibawa melalui Mutasi APD agar jejak barang jelas.</p><button class="btn primary" type="submit">Simpan</button></form>':'<form id="apdTxForm" onsubmit="saveTx(event)"><p class="notice"><b>Alur APD:</b> <span id="txFlow">Stok gudang diperbarui</span></p><div class="inputgrid"><label>Tanggal<input name="date" type="date" value="'+today()+'" required></label><label>Jenis<select name="type">'+TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Transaksi<select name="event" onchange="updateTxHelp(this.value)">'+EVENTS.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Jumlah Diterima / Mutasi<input name="qty" type="number" min="1" value="1" required></label><label id="txMonthsWrap">Jatah Penggantian (bulan)<input name="months" type="number" min="1" max="120" placeholder="Contoh: 3, 6, 12" value="6" required></label><label id="txFromWrap">Nama karyawan yang mengembalikan / membawa APD<select name="from"><option value="">–</option>'+options+'</select></label><label id="txToWrap">Nama karyawan penerima APD<select name="to"><option value="">–</option>'+options+'</select></label><label id="txConditionWrap">Kondisi akhir APD<select name="condition"><option value="LAYAK">Dikembalikan - Layak</option><option value="RUSAK">Dikembalikan - Rusak</option><option value="DIBAWA KELUAR">Dibawa Karyawan Keluar</option><option value="MASIH DIPAKAI">Masih Dipakai</option></select></label><label>Lokasi / Gudang<input name="location"></label><label>PIC<input name="pic"></label><label>Nomor Bukti<input name="doc"></label><label>Keterangan<input name="note"></label></div><div class="notice" id="txExplanation">Pilih jenis transaksi untuk melihat petunjuk.</div><p class="muted">Jika karyawan mengembalikan APD, pilih KEMBALI LAYAK atau KEMBALI RUSAK. Jika tidak dikembalikan saat keluar, pilih DIBAWA KELUAR. Jumlah adalah jumlah APD yang berpindah.</p><button class="btn primary" type="submit">Simpan Mutasi</button></form>')+'</div></div>'}
async function sync(){if(!db||!user)return;const {data:r,error}=await db.from('apd_state').select('data,revision').eq('id','main').maybeSingle();if(error)throw error;if(r){data=r.data;rev=r.revision}else if(canEdit()){const {data:r2,error:e2}=await db.from('apd_state').insert({id:'main',data:SEED,revision:0,updated_by:user.email}).select('data,revision').single();if(e2)throw e2;data=r2.data;rev=r2.revision}render()}
async function persist(next){if(!can())return;busy=true;render();try{let q=db.from('apd_state').update({data:next,revision:rev+1,updated_at:new Date().toISOString(),updated_by:user.email}).eq('id','main').eq('revision',rev).select('revision');let {data:r,error}=await q;if(error)throw error;if(!r?.length)throw Error('Ada perubahan dari perangkat lain. Data akan dimuat ulang agar tidak tertimpa.');data=next;rev=r[0].revision;return true}catch(e){alert('Gagal menyimpan: '+e.message);await sync();return false}finally{busy=false;render()}}
async function savePerson(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let n=structuredClone(data);if(selected){Object.assign(n.people.find(p=>p.id===selected),f)}else n.people.push({...f,id:id()});dialog='';await persist(n)}
async function saveTx(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.qty=Number(f.qty);f.months=Number(f.months||6);if(f.event.startsWith('SERAH')&&(!Number.isInteger(f.months)||f.months<1||f.months>120))return alert('Jatah penggantian harus 1–120 bulan.');f.condition=f.event==='MASIH DIPAKAI'?'MASIH DIPAKAI':f.event==='INSPEKSI LAYAK'?'LAYAK':f.event==='INSPEKSI TIDAK LAYAK'?'TIDAK LAYAK':f.event==='KEMBALI LAYAK'?'LAYAK':f.event==='KEMBALI RUSAK'?'RUSAK':f.event==='DIBAWA KELUAR'?'DIBAWA KELUAR':f.event==='SERAH BEKAS'?'BEKAS LAYAK':'BARU';let x=inv(f.type);if(['SERAH BARU','SERAH BEKAS'].includes(f.event)&&!f.to)return alert('Pilih penerima APD.');if(['KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR','INSPEKSI LAYAK','INSPEKSI TIDAK LAYAK','MASIH DIPAKAI'].includes(f.event)&&!f.from)return alert('Pilih pemegang sebelumnya.');if((f.event.startsWith('INSPEKSI')||f.event==='MASIH DIPAKAI')&&held(f.from,f.type)<f.qty)return alert('Jumlah APD yang diperiksa melebihi jumlah yang dipegang karyawan.');if(f.event==='SERAH BARU'&&x.new<f.qty)return alert('Stok baru tidak cukup.');if(['SERAH BEKAS','MUSNAH'].includes(f.event)&&x.used<f.qty)return alert('Stok bekas tidak cukup.');if(['KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR'].includes(f.event)&&held(f.from,f.type)<f.qty)return alert('APD yang dipegang tidak cukup.');let n=structuredClone(data);n.transactions.push({...f,id:id()});const err=validateLedger(n.transactions);if(err){alert('Transaksi tidak dapat disimpan: '+err);return}dialog='';await persist(n)}
function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Backup_APD_KMB_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function login(){const email=prompt('Email akun KMB:');if(!email)return;const password=prompt('Password:');if(!password)return;let {error}=await db.auth.signInWithPassword({email,password});if(error)alert(error.message);else await initSession()}

async function start(){let conf=window.KMB_SUPABASE_CONFIG;if(!conf||!window.supabase){root.innerHTML='Koneksi database tidak tersedia';return}db=window.supabase.createClient(conf.url,conf.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});try{await initSession()}catch(e){root.innerHTML='<section class="panel">Gagal membuka database: '+esc(e.message)+'</section>'}db.auth.onAuthStateChange((_ev,s)=>{if(!s?.user&&user){user=null;role='viewer';render()}})}
