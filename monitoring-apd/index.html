<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172e52"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Monitoring APD KMB</title><style>:root{font-family:Inter,system-ui,Arial;background:#f5f7fb;color:#172439}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:240px;background:#fff;border-right:1px solid #e4eaf1;padding:22px 15px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:21px;color:#b72327;margin:8px 8px 36px}.nav{display:block;width:100%;border:0;background:none;padding:13px;text-align:left;color:#53637a;border-radius:12px;margin:5px 0}.nav.active,.nav:hover{background:#eaf1ff;color:#245dd5;font-weight:700}.main{padding:28px 34px;max-width:1520px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:27px}h1{margin:4px 0;font-size:27px}h2{font-size:18px}.muted{color:#8490a3;font-size:13px}.btn{border:1px solid #dde5ef;background:white;color:#253d5e;border-radius:9px;padding:10px 13px}.btn.primary{background:#2563eb;border-color:#2563eb;color:white}.btn.danger{color:#c53030}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:white;border:1px solid #e6ebf2;border-radius:16px;padding:19px;box-shadow:0 4px 18px #1b3f6b08}.number{font-size:30px;font-weight:800;margin-top:12px}.panel{margin-top:22px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}input,select{border:1px solid #d8e1ed;border-radius:9px;padding:10px;max-width:100%;background:white}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#f6f8fc;color:#67748a}th,td{padding:12px;border-bottom:1px solid #e9edf3;white-space:nowrap}.tablebox{overflow-x:auto}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#e5f0ff;color:#205ac6;font-size:11px;font-weight:700}.pill.red{background:#ffe8e8;color:#be2626}.pill.green{background:#dbf9e9;color:#177648}.inputgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.inputgrid label{display:grid;gap:5px;font-size:13px}.modalback{position:fixed;inset:0;background:#13213e99;display:grid;place-items:center;z-index:8;padding:16px}.dialog{width:min(640px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:25px}.notice{background:#fff8e4;padding:12px;border-radius:10px;color:#765415;margin:12px 0;font-size:13px}.logout{font-size:12px}.link{border:0;background:none;color:#2563eb;text-decoration:underline;padding:0}.status{margin-bottom:15px;color:#66768e;font-size:13px}@media(max-width:850px){.shell{display:block}.side{height:auto;position:relative;width:auto;padding:10px;overflow:auto;display:flex;align-items:center;gap:4px}.brand{font-size:15px;margin:0 12px;white-space:nowrap}.nav{white-space:nowrap;width:auto;padding:9px}.main{padding:18px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.inputgrid{grid-template-columns:1fr}.top{flex-wrap:wrap}}</style></head><body><div id="root"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase/config.js"></script><script>
const SEED={"people":[{"id":"MP-001","name":"Afid Irham","position":"Jr Mekanik","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-002","name":"Mohamad Rianto","position":"Jr Mekanik","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-003","name":"Muhamad Wiwit Pratama","position":"Jr Welder","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-004","name":"Regista Pratama","position":"Admin Plant","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-005","name":"Eliyadi","position":"Helper Mekanik","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-006","name":"Aldo Noviansyah","position":"Helper Mekanik","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-007","name":"Rido Saputra","position":"Helper Mekanik","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-008","name":"Alan Arohim","position":"Helper Mekanik","site":"SLR Maintenance","status":"AKTIF"},{"id":"MP-009","name":"Rahmat Zhafrani","position":"Jr Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-010","name":"Aji Laksono","position":"Jr Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-011","name":"Bagus Wahyu Nurcahyo","position":"Jr Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-012","name":"Bayu Aji Saputro","position":"Jr Welder","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-013","name":"Ririn","position":"Helper Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-014","name":"Soleram","position":"Helper Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-015","name":"Candra","position":"Helper Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-016","name":"Adi Silitonga","position":"Helper Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-017","name":"Andet Ardika","position":"Helper Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-018","name":"Khoirul Musthofa","position":"Jr Mekanik","site":"Belum dipetakan","status":"AKTIF"},{"id":"MP-019","name":"Yudo Hardianto","position":"Jr Mekanik","site":"SLR Rekondisi","status":"AKTIF"},{"id":"MP-020","name":"Dimas","position":"Jr Mekanik","site":"Workshop","status":"AKTIF"},{"id":"MP-021","name":"Cahyo Aji","position":"Helper Mekanik","site":"Workshop","status":"AKTIF"},{"id":"MP-022","name":"Aditya","position":"Helper Mekanik","site":"Belum dipetakan","status":"AKTIF"}],"transactions":[]},APP='apd', TYPES=['HELM','KAOS','SEPATU'], EVENTS=['MASUK BARU','SERAH BARU','SERAH BEKAS','KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR','MUSNAH'];
let db=null,user=null,role='viewer',data=structuredClone(SEED),rev=null,view='dashboard',selected=null,dialog='',busy=false;
const root=document.querySelector('#root');const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[x]));const id=()=>crypto.randomUUID();const canEdit=()=>['owner','editor'].includes(role);const today=()=>new Date().toLocaleDateString('sv-SE');const fmt=s=>s?new Date(s+'T00:00:00').toLocaleDateString('id-ID'):'–';
function plus6(s){if(!s)return null;let [y,m,d]=s.split('-').map(Number);let t=new Date(y,m-1+6,1);t.setDate(Math.min(d,new Date(t.getFullYear(),t.getMonth()+1,0).getDate()));return t.toLocaleDateString('sv-SE')}
function held(pid,type){return data.transactions.filter(t=>t.type===type).reduce((s,t)=>s+(t.to===pid&&t.event.startsWith('SERAH')?t.qty:0)-(t.from===pid&&['KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR'].includes(t.event)?t.qty:0),0)}
function inv(type){return data.transactions.filter(t=>t.type===type).reduce((a,t)=>{let q=Number(t.qty);if(t.event==='MASUK BARU')a.new+=q;if(t.event==='SERAH BARU')a.new-=q;if(t.event==='SERAH BEKAS'||t.event==='MUSNAH')a.used-=q;if(t.event==='KEMBALI LAYAK')a.used+=q;if(t.event==='KEMBALI RUSAK')a.bad+=q;return a},{new:0,used:0,bad:0})}
function due(pid,type){let ts=data.transactions.filter(t=>t.to===pid&&t.type===type&&t.event.startsWith('SERAH')).sort((a,b)=>b.date.localeCompare(a.date));return ts.length?plus6(ts[0].date):null}
function badge(s){return '<span class="pill '+(s==='KELUAR'||s==='JATUH TEMPO'?'red':s==='AKTIF'?'green':'')+'">'+esc(s)+'</span>'}
function nav(n,label){return '<button class="nav '+(view===n?'active':'')+'" onclick="go(\''+n+'\')">'+label+'</button>'}
function go(n){view=n;selected=null;render()}function can(){if(!canEdit()){alert('Hanya Pemilik atau Editor yang dapat mengubah data');return false}return true}
function render(){root.innerHTML=layout();}
function layout(){return '<div class="shell"><aside class="side"><div class="brand">◉ KMB APD</div>'+nav('dashboard','▦ Dashboard')+nav('people','👥 Manpower')+nav('stock','▣ Stok APD')+nav('transactions','⇄ Mutasi APD')+nav('out','↗ MP Keluar')+nav('users','⚙ Akses')+'</aside><main class="main"><header class="top"><div><div class="muted">PT KARUNIA MANDIRI BERKARYA</div><h1>Monitoring APD KMB</h1><div class="muted">Penerimaan • Penggantian 6 bulan • Serah terima</div></div><div><span class="pill">'+(role==='owner'?'Pemilik':role==='editor'?'Editor':'Pelihat')+'</span> <span class="muted">'+esc(user?.email||'Belum masuk')+'</span> <button class="btn" onclick="'+(user?'logout()':'login()')+'">'+(user?'Keluar':'Masuk')+'</button></div></header><div class="status">'+(busy?'Menyimpan data...':'Database online • '+(user?'Akun terhubung':'Login diperlukan untuk melihat data'))+'</div>'+(!user?'<section class="panel"><h2>Masuk menggunakan akun KMB</h2><p>Gunakan email dan password yang sama dengan Monitoring Manpower KMB.</p><button class="btn primary" onclick="login()">Masuk</button></section>':body())+'</main></div>'+(dialog?modal():'')}
function body(){if(view==='dashboard')return dashboard();if(view==='people'||view==='out')return peoplePage();if(view==='stock')return stockPage();if(view==='transactions')return txPage();return usersPage()}
function dashboard(){let act=data.people.filter(p=>p.status==='AKTIF'),dueCount=act.reduce((n,p)=>n+TYPES.filter(t=>{let d=due(p.id,t);return d&&d<=today()}).length,0),items=TYPES.map(t=>inv(t)),total=items.reduce((n,x)=>n+x.new+x.used,0);return '<div class="cards">'+[['Manpower Aktif',act.length],['Manpower Keluar',data.people.length-act.length],['APD Jatuh Tempo',dueCount],['Stok Baru + Bekas',total]].map(([a,b])=>'<div class="card"><div class="muted">'+a+'</div><div class="number">'+b+'</div></div>').join('')+'</div><section class="panel"><h2>Stok APD Terkini</h2>'+stockTable()+'</section><section class="panel"><div class="toolbar"><h2 style="flex:1">Monitoring Penggantian Per Manpower</h2><button class="btn" onclick="go(\'people\')">Lihat semua →</button></div>'+personTable(act)+'</section>'}
function stockTable(){return '<div class="tablebox"><table><thead><tr><th>Jenis</th><th>Stok Baru</th><th>Bekas Layak</th><th>Rusak</th><th>Dimiliki Karyawan</th></tr></thead><tbody>'+TYPES.map(t=>{let x=inv(t);return '<tr><td>'+t+'</td><td>'+x.new+'</td><td>'+x.used+'</td><td>'+x.bad+'</td><td>'+data.people.reduce((n,p)=>n+held(p.id,t),0)+'</td></tr>'}).join('')+'</tbody></table></div>'}
function stockPage(){return '<section class="panel"><div class="toolbar"><h2 style="flex:1">Stok APD</h2>'+(canEdit()?'<button class="btn primary" onclick="openTx()">+ Catat Stok/Mutasi</button>':'')+'</div>'+stockTable()+'</section>'}
function personTable(rows){return '<div class="tablebox"><table><thead><tr><th>Nama</th><th>Jabatan</th><th>Jobsite</th><th>Status</th>'+TYPES.map(t=>'<th>'+t+' (Qty • Ganti)</th>').join('')+'</tr></thead><tbody>'+rows.map(p=>'<tr><td><button class="link" onclick="detail(\''+p.id+'\')">'+esc(p.name)+'</button></td><td>'+esc(p.position)+'</td><td>'+esc(p.site)+'</td><td>'+badge(p.status)+'</td>'+TYPES.map(t=>{let d=due(p.id,t);return '<td>'+held(p.id,t)+' • '+(d?fmt(d)+(d<=today()?' ⚠':''):'Belum tercatat')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>'}
function peoplePage(){let rows=data.people.filter(p=>view==='out'?p.status==='KELUAR':p.status==='AKTIF');return '<section class="panel"><div class="toolbar"><h2 style="flex:1">'+(view==='out'?'Manpower Keluar':'Manpower Aktif')+' ('+rows.length+')</h2>'+(canEdit()?'<button class="btn primary" onclick="openPerson()">+ Manpower Baru</button>':'')+'</div>'+personTable(rows)+'</section>'}
function detail(pid){selected=pid;dialog='detail';render()}
function txPage(){return '<section class="panel"><div class="toolbar"><h2 style="flex:1">Riwayat Mutasi APD</h2>'+(canEdit()?'<button class="btn primary" onclick="openTx()">+ Transaksi APD</button>':'')+'<button class="btn" onclick="exportBackup()">Backup JSON</button></div><div class="tablebox"><table><tr><th>Tanggal</th><th>Jenis</th><th>Transaksi</th><th>Qty</th><th>Dari</th><th>Kepada</th><th>Lokasi</th></tr>'+[...data.transactions].reverse().map(t=>'<tr><td>'+fmt(t.date)+'</td><td>'+esc(t.type)+'</td><td>'+esc(t.event)+'</td><td>'+t.qty+'</td><td>'+esc(data.people.find(p=>p.id===t.from)?.name||'–')+'</td><td>'+esc(data.people.find(p=>p.id===t.to)?.name||'–')+'</td><td>'+esc(t.location||'–')+'</td><td>'+(canEdit()?'<button class="btn danger" onclick="deleteTx(\''+t.id+'\')">Hapus</button>':'–')+'</td></tr>').join('')+'</table></div><p class="muted">Hapus transaksi yang salah input. Sistem akan memeriksa agar riwayat stok setelah penghapusan tetap valid.</p></section>'+txHelp()}
function validateLedger(transactions){
 const stocks={};const holdings={};let sorted=[...transactions].sort((a,b)=>a.date.localeCompare(b.date));
 for(const t of sorted){const q=Number(t.qty);if(!(q>0))return 'Jumlah transaksi tidak valid';let x=stocks[t.type]||(stocks[t.type]={new:0,used:0,bad:0});let h=holdings[t.from+'|'+t.type]||0;
 if(t.event==='MASUK BARU')x.new+=q;
 else if(t.event==='SERAH BARU'){x.new-=q;holdings[t.to+'|'+t.type]=(holdings[t.to+'|'+t.type]||0)+q}
 else if(t.event==='SERAH BEKAS'){x.used-=q;holdings[t.to+'|'+t.type]=(holdings[t.to+'|'+t.type]||0)+q}
 else if(t.event==='KEMBALI LAYAK'){holdings[t.from+'|'+t.type]=h-q;x.used+=q}
 else if(t.event==='KEMBALI RUSAK'){holdings[t.from+'|'+t.type]=h-q;x.bad+=q}
 else if(t.event==='DIBAWA KELUAR'){holdings[t.from+'|'+t.type]=h-q}
 else if(t.event==='MUSNAH')x.used-=q;
 if(x.new<0||x.used<0||x.bad<0||Object.values(holdings).some(v=>v<0))return 'Penghapusan menyebabkan saldo stok atau APD karyawan menjadi negatif. Hapus atau koreksi transaksi lanjutan lebih dulu.';
 }return null;
}
async function deleteTx(txid){
 if(!can())return;const t=data.transactions.find(x=>x.id===txid);if(!t)return;
 if(!confirm('Hapus transaksi '+t.event+' '+t.qty+' '+t.type+' tanggal '+fmt(t.date)+'?\\nData yang dihapus tidak dapat dikembalikan kecuali dari backup.'))return;
 const n=structuredClone(data);n.transactions=n.transactions.filter(x=>x.id!==txid);
 const err=validateLedger(n.transactions);if(err){alert(err);return}
 await persist(n);
}
function txHelp(){return '<section class="panel"><h2>Panduan Singkat Transaksi APD</h2><p class="muted">Pilih jenis transaksi sesuai kegiatan sebenarnya. Semua stok dihitung dari transaksi, tidak perlu mengisi jumlah di dashboard.</p><div class="inputgrid">'+Object.entries(EXPLAIN).map(([k,v])=>'<div class="card"><b>'+esc(k)+'</b><p class="muted">'+esc(v)+'</p></div>').join('')+'</div><p class="notice"><b>Contoh:</b> Beli 10 helm → MASUK BARU (10). Berikan 1 ke Afid → SERAH BARU (1, penerima Afid). Afid keluar, helm dikembalikan → KEMBALI LAYAK (1, dari Afid). Berikan ke karyawan lain → SERAH BEKAS (1, pilih penerima baru).</p></section>'}
function usersPage(){return '<section class="panel"><h2>Hak Akses Pengguna</h2><p>Akun pengguna sama dengan dua website Manpower. Pemilik mengelola akses pada sistem Supabase. Role untuk website APD disimpan terpisah dari KTA–TRA dan KMB.</p><div class="notice">Pemilik: seluruh data. Editor: pencatatan dan perubahan. Pelihat: hanya baca. Setiap pengguna harus didaftarkan agar dapat mengakses data APD.</div><button class="btn" onclick="exportBackup()">Download Backup JSON</button></section>'}
function openPerson(pid){if(!can())return;selected=pid||null;dialog='person';render()}function openTx(){if(!can())return;dialog='tx';render();updateTxHelp('MASUK BARU')}function closeDialog(){dialog='';render()}
function updateTxHelp(event){let el=document.querySelector('#txExplanation');if(el)el.textContent=EXPLAIN[event]||''}
function modal(){let p=data.people.find(x=>x.id===selected)||{};let options=data.people.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>').join('');return '<div class="modalback" onclick="if(event.target===this)closeDialog()"><div class="dialog"><div class="toolbar"><h2 style="flex:1">'+(dialog==='detail'?'Detail APD '+esc(p.name):dialog==='person'?'Data Manpower':'Mutasi / Serah Terima APD')+'</h2><button class="btn" onclick="closeDialog()">✕</button></div>'+(dialog==='detail'?'<p>'+esc(p.position)+' • '+esc(p.site)+' • '+badge(p.status)+'</p>'+TYPES.map(t=>'<div class="card" style="margin:10px 0"><b>'+t+'</b><p>Dimiliki: '+held(p.id,t)+' • Penggantian: '+(due(p.id,t)?fmt(due(p.id,t)):'Belum ada penerimaan')+'</p></div>').join('')+(canEdit()?'<button class="btn primary" onclick="openPerson(\''+p.id+'\')">Edit Manpower</button>':''):dialog==='person'?'<form onsubmit="savePerson(event)"><div class="inputgrid"><label>Nama<input name="name" required value="'+esc(p.name||'')+'"></label><label>Jabatan<input name="position" required value="'+esc(p.position||'')+'"></label><label>Jobsite<input name="site" required value="'+esc(p.site||'')+'"></label><label>Status<select name="status"><option '+(p.status!=='KELUAR'?'selected':'')+'>AKTIF</option><option '+(p.status==='KELUAR'?'selected':'')+'>KELUAR</option></select></label><label>Tanggal Keluar<input name="exitDate" type="date" value="'+esc(p.exitDate||'')+'"></label><label>Keterangan<input name="notes" value="'+esc(p.notes||'')+'"></label></div><p class="notice">Jika keluar, catat juga pengembalian atau APD dibawa melalui Mutasi APD agar jejak barang jelas.</p><button class="btn primary" type="submit">Simpan</button></form>':'<form onsubmit="saveTx(event)"><div class="inputgrid"><label>Tanggal<input name="date" type="date" value="'+today()+'" required></label><label>Jenis<select name="type">'+TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Transaksi<select name="event" onchange="updateTxHelp(this.value)">'+EVENTS.map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Jumlah<input name="qty" type="number" min="1" value="1" required></label><label>Pemegang Lama<select name="from"><option value="">–</option>'+options+'</select></label><label>Penerima<select name="to"><option value="">–</option>'+options+'</select></label><label>Kondisi<select name="condition"><option>BARU</option><option>BEKAS LAYAK</option><option>RUSAK</option></select></label><label>Lokasi / Gudang<input name="location"></label><label>PIC<input name="pic"></label><label>Nomor Bukti<input name="doc"></label><label>Keterangan<input name="note"></label></div><div class="notice" id="txExplanation">Pilih jenis transaksi untuk melihat petunjuk.</div><p class="muted">Dari = karyawan pemegang lama. Kepada = karyawan penerima. Jumlah = banyaknya APD, bukan stok tersisa.</p><button class="btn primary" type="submit">Simpan Mutasi</button></form>')+'</div></div>'}
async function sync(){if(!db||!user)return;const {data:r,error}=await db.from('apd_state').select('data,revision').eq('id','main').maybeSingle();if(error)throw error;if(r){data=r.data;rev=r.revision}else if(canEdit()){const {data:r2,error:e2}=await db.from('apd_state').insert({id:'main',data:SEED,revision:0,updated_by:user.email}).select('data,revision').single();if(e2)throw e2;data=r2.data;rev=r2.revision}render()}
async function persist(next){if(!can())return;busy=true;render();try{let q=db.from('apd_state').update({data:next,revision:rev+1,updated_at:new Date().toISOString(),updated_by:user.email}).eq('id','main').eq('revision',rev).select('revision');let {data:r,error}=await q;if(error)throw error;if(!r?.length)throw Error('Ada perubahan dari perangkat lain. Data akan dimuat ulang agar tidak tertimpa.');data=next;rev=r[0].revision}catch(e){alert('Gagal menyimpan: '+e.message);await sync()}finally{busy=false;render()}}
async function savePerson(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let n=structuredClone(data);if(selected){Object.assign(n.people.find(p=>p.id===selected),f)}else n.people.push({...f,id:id()});dialog='';await persist(n)}
async function saveTx(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.qty=Number(f.qty);let x=inv(f.type);if(['SERAH BARU','SERAH BEKAS'].includes(f.event)&&!f.to)return alert('Pilih penerima APD.');if(['KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR'].includes(f.event)&&!f.from)return alert('Pilih pemegang sebelumnya.');if(f.event==='SERAH BARU'&&x.new<f.qty)return alert('Stok baru tidak cukup.');if(['SERAH BEKAS','MUSNAH'].includes(f.event)&&x.used<f.qty)return alert('Stok bekas tidak cukup.');if(['KEMBALI LAYAK','KEMBALI RUSAK','DIBAWA KELUAR'].includes(f.event)&&held(f.from,f.type)<f.qty)return alert('APD yang dipegang tidak cukup.');let n=structuredClone(data);n.transactions.push({...f,id:id()});const err=validateLedger(n.transactions);if(err){alert('Transaksi tidak dapat disimpan: '+err);return}dialog='';await persist(n)}
function exportBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Backup_APD_KMB_'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}
async function login(){const email=prompt('Email akun KMB:');if(!email)return;const password=prompt('Password:');if(!password)return;let {error}=await db.auth.signInWithPassword({email,password});if(error)alert(error.message);else await initSession()}
async function logout(){await db.auth.signOut();user=null;role='viewer';data=structuredClone(SEED);render()}
async function initSession(){let {data:a}=await db.auth.getUser();user=a.user;if(!user){render();return}let {data:r,error}=await db.from('app_access_roles').select('role').eq('app_id',APP).eq('email',user.email.toLowerCase()).maybeSingle();role=error?'viewer':r?.role||'viewer';if(!r){alert('Akun belum diberi akses Monitoring APD. Hubungi Pemilik.');await logout();return}await sync()}
async function start(){let conf=window.KMB_SUPABASE_CONFIG;if(!conf||!window.supabase){root.innerHTML='Koneksi database tidak tersedia';return}db=window.supabase.createClient(conf.url,conf.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});try{await initSession()}catch(e){root.innerHTML='<section class="panel">Gagal membuka database: '+esc(e.message)+'</section>'}db.auth.onAuthStateChange((_ev,s)=>{if(!s?.user&&user){user=null;role='viewer';render()}})}
render();start();setInterval(()=>{if(user&&!busy)sync().catch(console.warn)},30000);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script></body></html>
