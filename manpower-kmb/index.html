@media (max-width:560px){#upPick{place-items:end center;padding:0}#upPick .upk{border-radius:20px 20px 0 0}}</style><style id="css">
/* Layout: white sidebar + lavender content; gradient KPI row, then 12-col card grid (charts, resumes, recruitment tables). Mirrors the KTA-TRA / KMB monitoring pages. */
:root {
  --bg: #F2F1FA; --card: #FFFFFF; --card-2: #F7F6FD; --side: #FFFFFF;
  --ink: #1E1B3A; --ink-2: #4B4868; --muted: #8A87A6; --line: #E8E6F3;
  --primary: #6D28D9; --primary-2: #8B5CF6; --primary-soft: #EFE9FE; --primary-ink: #5B21B6;
  --g1a: #7C3AED; --g1b: #A78BFA; --g2a: #2563EB; --g2b: #60A5FA; --g3a: #EF4F5F; --g3b: #FB9A9A; --g4a: #F7871F; --g4b: #FDBE74;
  --c1: #7C3AED; --c2: #3B82F6; --c3: #F06A6A; --c4: #F59E42; --c5: #A78BFA;
  --good: #15803D; --good-soft: #DCFCE7; --warn: #B45309; --warn-soft: #FEF3C7; --crit: #DC2626; --crit-soft: #FEE2E2; --info: #2563EB; --info-soft: #DBEAFE;
  --track: #ECEAF6; --grid: #EFEDF7;
  --f: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --side-w: 248px; --r: 14px; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Sidebar */
.side { position: fixed; inset: 0 auto 0 0; width: var(--side-w); background: var(--side); border-right: 1px solid var(--line); z-index: 30; display: flex; flex-direction: column; overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); transition: transform .25s ease; }
.brand { display: flex; gap: 12px; align-items: center; padding: 20px 20px 18px; }
.brand .lg { font-size: 11px !important; width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--g1a), var(--g1b)); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }
.brand b { display: block; font-size: 15.5px; font-weight: 800; line-height: 1.2; }
.brand span { font-size: 12px; color: var(--muted); }
.nav { padding: 6px 12px; display: grid; gap: 2px; }
.nav .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.nav button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.nav button:hover { background: var(--card-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--primary-soft); color: var(--primary-ink); }
.nav button .ct { margin-left: auto; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 10px; background: var(--card-2); color: var(--muted); border: 1px solid var(--line); }
.nav button .ct.al { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.side-foot { margin-top: auto; padding: 16px 20px 22px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.side-foot b { color: var(--ink-2); display: block; }
.scrim { position: fixed; inset: 0; background: rgba(18,16,40,.45); z-index: 25; }

.main { margin-left: var(--side-w); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 12px; height: 60px; background: rgba(242,241,250,.92); backdrop-filter: blur(8px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.top .ttl { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ibtn { border: 1px solid var(--line); background: var(--card); width: 38px; height: 38px; border-radius: 10px; display: none; place-items: center; cursor: pointer; color: var(--ink-2); }
.btn { border: 0; border-radius: 10px; padding: 9px 15px; font-size: 13.5px; font-weight: 700; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
.btn-p { background: var(--primary); color: #fff; }
.btn-p:hover { filter: brightness(1.08); }
.btn-g { background: var(--card); color: var(--ink-2); border: 1px solid var(--line); }
.content { padding-block: 22px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1440px; }
@media (min-width: 1100px) { .content { padding-left: 26px; padding-right: 26px; } }
@media (max-width: 1023px) {
  .side { transform: translateX(-100%); } body.nav-open .side { transform: none; }
  .main { margin-left: 0; } .ibtn { display: grid; }
}
@media (min-width: 1024px) { .scrim { display: none; } }
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* Header */
.head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 18px; }
.eyebrow { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--primary); }
h1 { font-size: clamp(22px, 2.6vw, 28px); font-weight: 800; margin: 4px 0 2px; letter-spacing: -.01em; text-wrap: balance; }
.head p { margin: 0; color: var(--muted); font-size: 13px; }
.upd { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; display: flex; gap: 10px; align-items: center; }
.upd i { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; box-shadow: 0 0 0 4px rgba(34,197,94,.2); }
.upd small { display: block; font-size: 10.5px; color: var(--muted); }
.upd b { font-size: 12.5px; }
.srcnote { background: var(--primary-soft); color: var(--ink); border-radius: 10px; padding: 9px 14px; font-size: 13px; margin-bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
.srcnote.err { background: var(--crit-soft); color: var(--crit); }
.srcnote button { background: none; border: 0; color: var(--primary-ink); text-decoration: underline; cursor: pointer; padding: 0; font-size: 13px; font-weight: 600; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 480px) { .kpis { grid-template-columns: minmax(0, 1fr); } }
.kpi { position: relative; overflow: hidden; border-radius: var(--r); padding: 18px 20px 20px; color: #fff; display: flex; gap: 16px; align-items: center; min-height: 108px; }
.kpi::after { content: ""; position: absolute; width: 130px; height: 130px; border-radius: 50%; right: -28px; top: -44px; background: rgba(255,255,255,.14); }
.kpi::before { content: ""; position: absolute; width: 80px; height: 80px; border-radius: 50%; right: 40px; bottom: -50px; background: rgba(255,255,255,.08); }
.kpi.k1 { background: linear-gradient(120deg, var(--g1a), var(--g1b)); }
.kpi.k2 { background: linear-gradient(120deg, var(--g2a), var(--g2b)); }
.kpi.k3 { background: linear-gradient(120deg, var(--g3a), var(--g3b)); }
.kpi.k4 { background: linear-gradient(120deg, var(--g4a), var(--g4b)); }
.kpi .ic { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; flex-shrink: 0; font-weight: 800; font-size: 18px; }
.kpi .lb { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .92; }
.kpi .v { font-size: 30px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .ds { font-size: 12px; opacity: .9; }

/* Cards */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.s12 { grid-column: span 12; } .s8 { grid-column: span 8; } .s7 { grid-column: span 7; } .s6 { grid-column: span 6; } .s5 { grid-column: span 5; } .s4 { grid-column: span 4; }
@media (max-width: 1100px) { .s8, .s4, .s7, .s5 { grid-column: span 12; } }
@media (max-width: 860px) { .s6 { grid-column: span 12; } }
.card { background: var(--card); border-radius: var(--r); padding: 20px; min-width: 0; border: 1px solid var(--line); }
.ch { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.ch .eyebrow { font-size: 10px; }
h2 { font-size: 15.5px; font-weight: 800; margin: 2px 0 0; }
.ch p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; white-space: nowrap; border: 1px solid var(--line); color: var(--ink-2); background: var(--card); display: inline-flex; gap: 6px; align-items: center; }
.pill.live { background: var(--primary-soft); color: var(--primary-ink); border-color: transparent; }
.pill.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.red { background: var(--crit-soft); color: var(--crit); border-color: transparent; }

/* Charts */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { fill: var(--muted); font-size: 11px; font-family: var(--f); }
.chart svg text.val { fill: var(--primary-ink); font-weight: 800; font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; }
.donut { position: relative; max-width: 250px; margin: 6px auto 0; }
.donut svg { width: 100%; height: auto; display: block; }
.donut .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.donut .c b { font-size: 30px; font-weight: 800; line-height: 1; }
.donut .c span { font-size: 12px; color: var(--muted); }

/* Applicant summary */
.apps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .apps { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.app { background: var(--card-2); border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
.app b { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.app span { font-size: 12px; color: var(--muted); }
.app.pr b { color: var(--primary); } .app.ok b { color: var(--good); } .app.hd b { color: var(--warn); } .app.no b { color: var(--crit); }
.reasons { margin-top: 14px; display: grid; gap: 8px; }

/* Bars */
.hbars { display: grid; gap: 12px; }
.hb { display: grid; grid-template-columns: minmax(90px, 130px) minmax(0, 1fr) 28px; gap: 12px; align-items: center; font-size: 12.5px; }
.hb .t { color: var(--ink-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .tr { height: 18px; }
.hb .f { display: block; height: 100%; border-radius: 4px; min-width: 4px; }
.hb .v { font-weight: 800; font-variant-numeric: tabular-nums; }

/* Resume vacant */
.rgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .rgrid { grid-template-columns: minmax(0, 1fr); } }
.rcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--card); display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 2px rgba(30,27,58,.04); }
.rcard .hd { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; }
.rcard .nb { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); color: #fff; display: grid; place-items: center; font-size: 12.5px; flex-shrink: 0; }
.rcard .l1 { font-size: 12.5px; font-weight: 700; }
.rcard .l2 { font-size: 12.5px; color: var(--ink-2); }
.rcard .l3 { font-size: 11.5px; color: var(--muted); }
.rcard .more { margin-top: auto; padding-top: 4px; align-self: flex-start; border: 0; background: none; font-weight: 800; font-size: 12.5px; color: var(--primary-ink); cursor: pointer; padding-left: 0; }

/* Tables */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-size: 11px; font-weight: 700; color: var(--ink-2); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--card); }
table.t td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
table.t td.b { font-weight: 800; color: var(--ink); }
table.t td.nw { white-space: nowrap; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr:last-child td { border-bottom: 0; }
table.mpp th { background: var(--card-2); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
table.mpp td { padding: 8px 10px; }
table.full td { font-size: 11.5px; } table.full td.b, table.full td.vac { white-space: nowrap; }
tr.grpr td { background: var(--primary-soft); color: var(--primary-ink); font-weight: 800; font-size: 12px; padding: 8px 10px; }
tr.subr td { color: var(--ink-2); font-weight: 700; font-size: 11.5px; padding: 6px 10px; background: var(--card-2); }
table.mpp td.vac { background: var(--crit-soft); color: var(--crit); font-weight: 800; }
.dd { display: inline-block; font-weight: 800; font-size: 11.5px; padding: 3px 8px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.dd.crit { background: var(--crit-soft); color: var(--crit); } .dd.warn { background: var(--warn-soft); color: var(--warn); } .dd.good { background: var(--good-soft); color: var(--good); } .dd.info { background: var(--info-soft); color: var(--info); } .dd.mute { background: var(--card-2); color: var(--muted); }
.stt { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
.stt.open { background: var(--crit-soft); color: var(--crit); } .stt.cont { background: var(--warn-soft); color: var(--warn); } .stt.close { background: var(--good-soft); color: var(--good); }
.pg { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.pg .tr { flex: 1; height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; }
.pg .tr i { display: block; height: 100%; background: linear-gradient(90deg, var(--g1a), var(--g1b)); border-radius: 3px; }
.pg b { font-size: 12px; font-weight: 800; font-variant-numeric: tabular-nums; }
.kl { display: grid; gap: 6px; min-width: 230px; }
.kl div { display: grid; grid-template-columns: minmax(90px, 1fr) auto; gap: 10px; font-size: 11.5px; }
.kl .nm { font-weight: 700; color: var(--ink); }
.kl .nm.off { font-weight: 500; color: var(--muted); }
.kl .st { text-align: right; color: var(--muted); white-space: nowrap; }
.kl .st.pr { color: var(--primary-ink); } .kl .st.hd { color: var(--warn); } .kl .st.ok { color: var(--good); font-weight: 700; }
.ket { font-size: 11.5px; color: var(--ink-2); min-width: 220px; white-space: pre-line; }

/* Status boxes */
.sbx { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sbx div { background: var(--card-2); border-radius: 10px; padding: 12px 14px; }
.sbx b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.sbx span { font-size: 11.5px; color: var(--muted); }
.sbx .r b { color: var(--crit); } .sbx .a b { color: var(--warn); } .sbx .g b { color: var(--good); }

/* Units */
.units { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .units { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.units div { background: var(--card-2); border-radius: 10px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.units b { font-size: 18px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }

/* Toolbar & chips */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.toolbar input[type="search"], .toolbar select { font: inherit; font-size: 13px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
.toolbar input[type="search"] { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--card-2); padding: 4px; border-radius: 10px; border: 1px solid var(--line); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--primary-ink); box-shadow: 0 1px 3px rgba(30,27,58,.12); }
.hs { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.hs.pr { background: var(--primary-soft); color: var(--primary-ink); } .hs.hd { background: var(--warn-soft); color: var(--warn); } .hs.no { background: var(--crit-soft); color: var(--crit); } .hs.ok { background: var(--good-soft); color: var(--good); } .hs.hist { background: var(--card-2); color: var(--muted); border: 1px solid var(--line); }
.empty { padding: 26px; text-align: center; color: var(--muted); }
.small { font-size: 12px; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); margin: 12px 0 0; max-width: 90ch; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(18,16,40,.5); display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--card); border-radius: 16px; width: min(720px, 100%); max-height: 86vh; overflow: auto; padding: 22px; border: 1px solid var(--line); }
.dialog .x { float: right; border: 1px solid var(--line); background: var(--card-2); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; font-size: 18px; line-height: 1; }
.pos { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.pos h4 { margin: 0 0 4px; font-size: 14px; }
body { background: var(--bg); }
.head-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn:disabled { opacity: .55; cursor: default; }
.btn-d { background: var(--crit); color: #fff; }
.btn-d:hover { filter: brightness(1.06); }
.ab { border: 1px solid var(--line); background: var(--card); color: var(--primary-ink); border-radius: 7px; height: 28px; min-width: 28px; padding: 0 7px; display: inline-grid; place-items: center; cursor: pointer; font-size: 10.5px; font-weight: 800; }
.ab:hover { background: var(--primary-soft); }
.ab.out { color: var(--crit); }
.ab.out:hover { background: var(--crit-soft); }
.acts { display: inline-flex; gap: 6px; }
.fsec { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--primary); margin: 18px 0 8px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
@media (max-width: 560px) { .fgrid { grid-template-columns: minmax(0, 1fr); } }
.fld { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fld.full { grid-column: 1 / -1; }
.fld label { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.fld input, .fld select, .fld textarea { font: inherit; font-size: 13.5px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); width: 100%; }
.fld textarea { resize: vertical; line-height: 1.45; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: 2px solid var(--primary-2); outline-offset: 0; border-color: transparent; }
.fld small { font-size: 11.5px; color: var(--muted); }
.fld.chk label { display: flex; gap: 8px; align-items: center; font-weight: 600; }
.factions { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
.ferr { margin-top: 14px; background: var(--crit-soft); color: var(--crit); border-radius: 9px; padding: 9px 12px; font-size: 13px; font-weight: 600; }
#toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 30px rgba(30,27,58,.25); max-width: calc(100vw - 32px); }
#toast.err { background: var(--crit); }
#saving { position: fixed; inset: 0; z-index: 80; background: rgba(242,241,250,.6); display: grid; place-items: center; }
#saving > div { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 22px; display: flex; gap: 12px; align-items: center; font-weight: 700; box-shadow: 0 10px 30px rgba(30,27,58,.15); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--primary-soft); border-top-color: var(--primary); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.role { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-top: 10px; display: grid; gap: 2px; }
.role b { font-size: 13.5px; } .role span { font-size: 12.5px; color: var(--muted); }
.printing .tw { overflow: visible !important; }
.printing #printBtn { visibility: hidden; }
.btn-y { background: #F7C948; color: #1E1B3A; }
.btn-y:hover { filter: brightness(1.04); }
.btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 9px; }
.btn.red { color: var(--crit); }
.mhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin: 6px 0 18px; }
.mhead h1 { margin: 2px 0; }
.mhead p { margin: 0; color: var(--muted); font-size: 13px; }
.mtools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.mtools input, .mtools select { font: inherit; font-size: 13.5px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); min-width: 0; }
.mtools input { width: 220px; max-width: 100%; }
.mstats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
@media (max-width: 760px) { .mstats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mstats div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.mstats b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.mstats span { font-size: 11.5px; color: var(--muted); }
table.mt th { font-size: 12px; color: var(--ink-2); padding: 12px 12px; }
table.mt td { padding: 14px 12px; font-size: 12.5px; color: var(--ink); }
table.mt td:nth-child(2), table.mt td:nth-child(3) { white-space: nowrap; }
table.mt td .small { white-space: nowrap; }
table.mt tr:hover td { background: var(--card-2); }
.vacn { color: var(--crit); font-weight: 800; }
.dash { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--card-2); color: var(--muted); font-size: 12px; }
.pcount { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 1px 2px rgba(30,27,58,.06); }
.pcount:hover { border-color: var(--primary-2); }
.plist { display: grid; margin-top: 8px; min-width: 210px; }
.plist div { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.plist b { font-weight: 700; } .plist span { color: var(--muted); white-space: nowrap; } .plist .off b { font-weight: 400; color: var(--muted); } .plist .on b { font-weight: 800; color: var(--ink); }
.ptkc { min-width: 140px; }
td .pg { min-width: 130px; }
.pgl { font-size: 11px; color: var(--ink-2); margin-top: 4px; white-space: nowrap; }
.kp { display: inline-block; font-size: 11px; font-weight: 800; padding: 5px 10px; border-radius: 14px; line-height: 1.25; max-width: 110px; }
.kp.crit { background: #FDEBD3; color: #9A4A0B; } .kp.warn { background: var(--warn-soft); color: var(--warn); } .kp.good { background: var(--good-soft); color: var(--good); } .kp.mute { background: var(--card-2); color: var(--ink-2); }
.cm-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.cm-h h2 { font-size: 19px; margin: 0; }
.cm-h .x { float: none; }
.cm-sum { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.cm-sum b { display: block; font-size: 16px; } .cm-sum span { font-size: 12.5px; color: var(--muted); }
.cm-list { display: grid; gap: 12px; }
.cc { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.cc-h { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.cc-h b { font-size: 15px; }
.cc-meta { display: flex; gap: 8px; align-items: center; margin-top: 5px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.cc-pg { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 12px; }
.cc-pg .tr { flex: 0 1 380px; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.cc-pg .tr i { display: block; height: 100%; background: linear-gradient(90deg, var(--g1a), var(--g1b)); }
.cc-pg span { color: var(--muted); }
.cc-note { margin-top: 8px; font-size: 12.5px; color: var(--ink-2); }
.hs.no { background: var(--crit-soft); color: var(--crit); }
@media print {
  .side, .top, .scrim, #toast, #printBtn, .mtools, .acts, .btn, .modal { display: none !important; }
  .main { margin: 0 !important; }
  .content { max-width: none; padding: 0 !important; }
  body { background: #fff; }
  .tw { overflow: visible !important; }
  .card, .kpi, .rcard, .mstats div, tr { break-inside: avoid; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
.fchip { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--primary-soft); color: var(--primary-ink); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
.fchip button { border: 0; background: var(--card); color: var(--crit); font-weight: 700; font-size: 12px; padding: 4px 10px; border-radius: 8px; cursor: pointer; }
.rcard .more.on { color: var(--good); }
.legend b { margin-left: 2px; }
#sumCard { scroll-margin-top: 76px; }
table.rk tfoot td { border-top: 2px solid var(--line); background: var(--card-2); padding: 12px 10px; color: var(--ink); }
table.rk td { vertical-align: middle; }
table.rk td .pg { min-width: 140px; }
.fgrid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 760px) { .fgrid.c3 { grid-template-columns: minmax(0, 1fr); } }
.dialog:has(.fgrid.c3) { width: min(1020px, 100%); }
.cm-back { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0 14px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.upw { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 40px; border: 1px dashed var(--line); border-radius: 9px; padding: 6px 8px; }
.upw small { font-size: 11px; color: var(--muted); }
.upbtn { cursor: pointer; }
.upx { border: 0; background: var(--crit-soft); color: var(--crit); width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-weight: 800; }
.upst { display: inline-flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.spin.sm { width: 14px; height: 14px; border-width: 2px; }
.fchip2 { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; color: var(--primary-ink); background: var(--primary-soft); border-radius: 7px; padding: 4px 9px; text-decoration: none; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fchip2:hover { text-decoration: underline; }
.cc-files { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
td .cc-files { margin-top: 0; min-width: 150px; }
.cc-dates { margin-top: 8px; font-size: 11.5px; color: var(--muted); }
.jchip { display: inline-flex; align-items: center; gap: 7px; font-weight: 800; font-size: 12.5px; color: var(--jc); background: var(--jbg); border: 1px solid var(--jbd); padding: 4px 11px 4px 9px; border-radius: 20px; white-space: nowrap; }
.jchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--jc); }
.stiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .stiles { grid-template-columns: minmax(0, 1fr); } }
.stile { position: relative; overflow: hidden; border-radius: 12px; padding: 14px; color: #fff; display: flex; gap: 12px; align-items: center; min-height: 82px; }
.stile::after { content: ""; position: absolute; width: 90px; height: 90px; border-radius: 50%; right: -26px; top: -34px; background: rgba(255,255,255,.16); }
.stile .sic { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.24); display: grid; place-items: center; font-weight: 800; flex-shrink: 0; font-size: 15px; }
.stile b { display: block; font-size: 26px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stile span:not(.sic) { font-size: 12px; opacity: .95; line-height: 1.25; display: block; }
.t-open { background: linear-gradient(120deg, #E11D48, #FB7185); }
.t-cont { background: linear-gradient(120deg, #D97706, #FBBF24); }
.t-close { background: linear-gradient(120deg, #059669, #34D399); }
.t-soon { background: linear-gradient(120deg, #EA580C, #FDBA74); }
.t-late { background: linear-gradient(120deg, #B91C1C, #F87171); }
.t-done { background: linear-gradient(120deg, #2563EB, #60A5FA); }
.units2 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .units2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.units2 > div { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--ubg); border: 1px solid var(--ubd); border-left: 4px solid var(--uc); }
.units2 .uic { width: 32px; height: 32px; border-radius: 9px; background: var(--uc); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.units2 .un { flex: 1; font-size: 12.5px; color: var(--ink-2); font-weight: 600; min-width: 0; }
.units2 b { font-size: 20px; font-weight: 800; color: var(--uc); font-variant-numeric: tabular-nums; }
.vdlg { width: min(940px, 100%); }
.vbody { margin-top: 14px; display: grid; gap: 12px; justify-items: center; }
.vimg { max-width: 100%; border-radius: 10px; border: 1px solid var(--line); }
.vpage { width: 100%; max-width: 860px; height: auto; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 2px 8px rgba(30,27,58,.08); }
.steps2 { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }

#sumCard { position: relative; overflow: hidden; }
#sumCard::before { content: ""; position: absolute; left: 50%; top: 55%; width: min(460px, 62%); aspect-ratio: 520 / 433; transform: translate(-50%, -50%) rotate(-6deg); background: var(--stamp-open) center / contain no-repeat; opacity: .09; pointer-events: none; z-index: 0; }
#sumCard > * { position: relative; z-index: 1; }
#sumCard .tw table.t th { background: transparent; }
.units2 .uic { width: 40px; height: 40px; border-radius: 11px; } .units2 .uic svg { width: 26px; height: 26px; }

/* Compact unit population on each dashboard: preserve data, reduce visual footprint. */
.unit-compact { padding: 14px 16px; }
.unit-compact .ch { margin-bottom: 10px; align-items: center; }
.unit-compact .ch h2 { font-size: 14px; }
.unit-compact .ch p { font-size: 11px; }
.unit-compact .pill { font-size: 10px; padding: 3px 8px; }
.unit-compact .units2 { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 7px; }
.unit-compact .units2 > div { min-height: 44px; gap: 7px; padding: 7px 9px; border-left-width: 3px; border-radius: 9px; }
.unit-compact .units2 .uic { width: 25px; height: 25px; border-radius: 7px; }
.unit-compact .units2 .uic svg { width: 16px; height: 16px; }
.unit-compact .units2 .un { font-size: 11px; line-height: 1.25; overflow-wrap: anywhere; }
.unit-compact .units2 b { font-size: 16px; }
@media (max-width: 520px) {
  .unit-compact { padding: 12px; }
  .unit-compact .units2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .unit-compact .units2 > div { min-height: 42px; padding: 6px 8px; }
}
@media print {
  .unit-compact .units2 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}

.gbanner::before { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: min(68%, 760px); background: var(--art) right center / auto 100% no-repeat; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 35%); mask-image: linear-gradient(90deg, transparent 0%, #000 35%); }
.gbanner::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--gac); }
.gb-t { position: relative; display: grid; gap: 2px; }
.gb-t span { font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--gac); }
.gb-t b { font-size: clamp(26px, 3.4vw, 40px); font-weight: 800; letter-spacing: -.02em; line-height: 1.1; color: var(--ink); }
.gb-t b em { font-style: normal; font-weight: 700; color: var(--ink-2); font-size: .6em; }
.gb-t small { font-size: 13px; color: var(--ink-2); }
.gb-kta-tra { --gbg: linear-gradient(90deg, #fff 30%, #EEE8FD); --gac: #7C3AED; }
.gb-bupr-ampah { --gbg: linear-gradient(90deg, #fff 30%, #E6EFFD); --gac: #2563EB; }
.gb-mbj { --gbg: linear-gradient(90deg, #fff 30%, #FCE6E8); --gac: #E11D48; }
.gb-kmb { --gbg: linear-gradient(90deg, #fff 30%, #FDEFDC); --gac: #EA7A12; }
@media (max-width: 640px) { .gbanner { min-height: 112px; padding: 16px 18px; } .gbanner::before { width: 100%; opacity: .45; } }
@media print { .gbanner { box-shadow: none; } }
.brand .lg { font-size: 20px !important; }

#lockScr { position: fixed; inset: 0; z-index: 45; display: grid; place-items: center; padding: 16px; background: linear-gradient(180deg, #F4F3FB, #E9E7F6); }
#lockScr .lk { max-width: 460px; text-align: center; background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 32px 26px; box-shadow: 0 18px 48px rgba(30,27,58,.12); }
#lockScr .lkm { width: 48px; height: 48px; border-radius: 14px; background: var(--primary); color: #fff; display: inline-grid; place-items: center; font-weight: 800; font-size: 24px; margin-bottom: 12px; }
#lockScr h2 { margin: 0 0 8px; font-size: 21px; } #lockScr p { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; line-height: 1.6; }
body.locked > *:not(#lockScr):not(#toast):not(.modal):not(#modal) { visibility: hidden; }
@media print { body.locked * { display: none !important; } }
.shl { display: flex; gap: 8px; flex-wrap: wrap; } .shl input { flex: 1 1 260px; min-width: 0; font: inherit; font-size: 13px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2, #F7F6FC); color: var(--ink); }

/* Parser: sheets = { sheetName: [[cell,...],...] } (row 0 = Excel row 1, col 0 = column A).
   Dates arrive as Excel serial numbers. Only non-sensitive fields are kept. */
function parseSheets(sheets, cfg) {
  cfg = cfg || (typeof PARSE_CFG !== 'undefined' ? PARSE_CFG : {});
  const names = Object.keys(sheets);
  const find = (re) => names.find((n) => re.test(n));
  const str = (v) => (v === null || v === undefined || v === 0 || v === '0') ? null : (String(v).trim() || null);
  const iso = (v) => {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number' && v > 20000 && v < 80000) {
      const d = new Date(Math.round((v - 25569) * 864e5));
      return d.toISOString().slice(0, 10);
    }
    return null;
  };
  const stage = (v) => { const d = iso(v); if (d) return d; const s = str(v); return s; };

  // ---- MPP (planning) ----
  const mppName = find(cfg.mpp || /MPP/i);
  if (!mppName) throw new Error(`Sheet "${cfg.mppLabel || 'MPP'}" tidak ditemukan di file ini.`);
  const mpp = sheets[mppName];
  const positions = [];
  let section = null, group = null;
  for (let i = 1; i < mpp.length; i++) {
    const r = mpp[i] || [];
    const a = r[0], b = r[1], c = r[2];
    if (typeof a === 'number' && a > 0 && (str(b) || str(c))) {
      positions.push({
        no: a, section, group,
        nama: str(b) || 'Vacant',
        jabatan: str(c),
        ket: str(r[3]),
        pic: str(r[4]),
        ptk: str(r[5]),
        aju: iso(r[6]),
        stages: [7, 8, 9, 10, 11, 12, 13].map((k) => stage(r[k])),
        due: iso(r[14]),
        status: str(r[15]),
        close: iso(r[16]),
      });
    } else if (typeof a !== 'number' && (c === null || c === undefined || c === '') && ((typeof a === 'string' && a.trim()) || (typeof b === 'string' && b.trim()))) {
      const t = (typeof a === 'string' && a.trim()) ? a.trim() : b.trim();
      if (/^vacant$/i.test(t) || /TIDAK ADA/i.test(t)) continue;
      if (/section|penanggung|di luar/i.test(t)) { section = t; group = t; } else { group = t; }
    }
  }

  if (cfg.autoSection) {
    const fam = (j) => { const t = String(j || '').toLowerCase();
      if (/admin|clerk|planner|supervisor|leader|foreman|head|superintendent/.test(t)) return ['Plant Admin & Leader', 'Admin & Leader'];
      if (/magang|intern|ojt/.test(t)) return ['Program Magang', 'Magang'];
      if (/weld/.test(t)) return ['Maintenance Section', 'Welder'];
      if (/helper/.test(t)) return ['Maintenance Section', 'Helper'];
      if (/mekanik|mechanic|electric|tyre/.test(t)) return ['Maintenance Section', 'Mekanik'];
      return ['Maintenance Section', 'Lainnya']; };
    positions.forEach((p) => { if (!p.section) { const f = fam(p.jabatan); p.section = f[0]; p.group = f[1]; } });
    // Keterangan di sheet jobsite KMB sering berisi asal karyawan / catatan, bukan nama pelamar
    const noteOnly = /^(searching|mencari|onsite|on site|menunggu|kmb$|lokal|pinjam)/i;
    positions.forEach((p) => {
      const lines = String(p.ket || '').split(/\n+/).map((x) => x.trim()).filter(Boolean);
      const vac = /^vacant$/i.test(p.nama || '');
      if ((!vac && !p.status) || !lines.some((l) => !noteOnly.test(l))) p.cands = (!vac && /close/i.test(p.status || '')) ? [{ name: p.nama, status: 'Diterima', sumber: null, stage: 7, note: null }] : [];
    });
  }

  // ---- Karyawan (MP Aktif / MP Out) ----
  const norm = (v) => String(v == null ? '' : v).toLowerCase().replace(/\s+/g, ' ').trim();
  const people = (name, withOut) => {
    if (!name) return [];
    const rows = sheets[name];
    let hr = -1;
    for (let i = 0; i < Math.min(rows.length, 12) && hr < 0; i++) { const r = (rows[i] || []).map(norm); if (r.includes('nama') && r.includes('jabatan')) hr = i; }
    const H = hr >= 0 ? (rows[hr] || []).map(norm) : [];
    const col = (test, dflt) => { const k = H.findIndex((h) => h && test(h)); return k >= 0 ? k : dflt; };
    const C = {
      nama: col((h) => h === 'nama', 4), jabatan: col((h) => h === 'jabatan', 8), dept: col((h) => h.startsWith('departemen'), 9),
      level: col((h) => h === 'level', 10), kontrak: col((h) => h.startsWith('status kontrak'), 11), akhir: col((h) => h.startsWith('akhir kontrak'), 12),
      poh: col((h) => h === 'poh', 13), masuk: col((h) => h.startsWith('tanggal') && h.includes('masuk'), 16), jk: col((h) => h.startsWith('jenis kelamin'), 18),
      kategori: col((h) => h === 'keterangan', 26), site: col((h) => h === 'site', -1), tempat: col((h) => h.startsWith('tempat') && h.includes('bekerja'), -1),
      keluar: col((h) => h.startsWith('tanggal keluar'), 57),
    };
    const out = [];
    for (let i = (hr >= 0 ? hr + 1 : 5); i < rows.length; i++) {
      const r = rows[i] || [];
      if (typeof r[0] !== 'number') continue;
      const nama = r[C.nama];
      if (typeof nama !== 'string' || !nama.trim()) continue;
      const tempat = C.tempat >= 0 ? str(r[C.tempat]) : null;
      if (cfg.site && !cfg.site.test(tempat || '')) continue;
      const p = {
        nama: nama.trim(),
        jabatan: str(r[C.jabatan]), dept: str(r[C.dept]), level: str(r[C.level]), kontrak: str(r[C.kontrak]),
        akhir: iso(r[C.akhir]), poh: str(r[C.poh]), masuk: iso(r[C.masuk]), jk: str(r[C.jk]),
        kategori: str(r[C.kategori]), site: C.site >= 0 ? str(r[C.site]) : tempat,
      };
      if (withOut) p.keluar = iso(r[C.keluar]);
      out.push(p);
    }
    return out;
  };
  const aktif = people(find(/aktif/i), false);
  const keluar = people(find(/out|keluar/i), true);

  // ---- Unit (DASHBOARD) ----
  const units = [];
  const dashName = find(/dashboard/i);
  if (dashName && cfg.unitBlock) {
    const d = sheets[dashName];
    for (let i = 0; i < d.length; i++) {
      const r = d[i] || []; const j = r.findIndex((v) => typeof v === 'string' && cfg.unitBlock.test(v.trim()));
      if (j < 0 || !(d[i + 1] && norm(d[i + 1][j]) === 'unit')) continue;
      for (let k = i + 2; k < d.length; k++) {
        const n = (d[k] || [])[j];
        if (typeof n === 'string' && /^total/i.test(n.trim())) break;
        if (typeof n === 'string' && n.trim()) units.push({ unit: n.trim(), jumlah: typeof d[k][j + 1] === 'number' ? d[k][j + 1] : 0 });
      }
      break;
    }
  } else if (dashName) {
    const d = sheets[dashName];
    let hr = -1, hc = -1;
    for (let i = 0; i < d.length && hr < 0; i++) {
      const r = d[i] || [];
      for (let j = 0; j < r.length; j++) if (typeof r[j] === 'string' && /^jenis unit$/i.test(r[j].trim())) { hr = i; hc = j; break; }
    }
    if (hr >= 0) {
      for (let i = hr + 1; i < d.length; i++) {
        const r = d[i] || [];
        const n = r[hc];
        if (typeof n !== 'string' || !n.trim()) break;
        if (/^total$/i.test(n.trim())) break;
        units.push({ unit: n.trim(), jumlah: typeof r[hc + 1] === 'number' ? r[hc + 1] : 0 });
      }
    }
  }

  return { positions, aktif, keluar, units };
}

// ---------- helpers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const isoOf = (y, m, d) => new Date(Date.UTC(y, m, d)).toISOString().slice(0, 10);
const TODAY = isoOf(now.getFullYear(), now.getMonth(), now.getDate());
const dnum = (iso) => iso ? Date.parse(iso + 'T00:00:00Z') / 864e5 : null;
const diff = (a, b) => (a && b) ? Math.round(dnum(a) - dnum(b)) : null;
const fmt = (iso) => { if (!iso) return '–'; const [y, m, d] = iso.split('-'); return `${String(+d).padStart(2, '0')} ${MONTHS[+m - 1]} ${y}`; };
const isDate = (v) => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
const isVacant = (p) => /^vacant$/i.test(p.nama || '');
const hasPTK = (p) => !!(p.ptk && p.aju);
const isOpen = (p) => hasPTK(p) && /^(open|continue)$/i.test(p.status || '');
const isClose = (p) => hasPTK(p) && /^close$/i.test(p.status || '');
const normName = (s) => (s || '').toLowerCase().replace(/[^a-z]/g, '');
function stageIdx(p) { let k = 0; p.stages.forEach((s, i) => { if (s) k = i + 1; }); return k; }
function ketPTK(p) {
  if (!hasPTK(p)) return 'TIDAK ADA PENGAJUAN';
  if (/close/i.test(p.status || '')) return 'SELESAI';
  if (!p.due) return '';
  const r = diff(p.due, TODAY);
  return r <= 0 ? 'JATUH TEMPO' : r <= 7 ? 'HAMPIR JATUH TEMPO' : 'ON TRACK';
}

// ---------- candidates ----------
function reasonOf(note) {
  const n = (note || '').toLowerCase();
  if (/menolak|tolak/.test(n)) return 'Menolak offering';
  if (/respon|respond|tidak aktif|no response/.test(n)) return 'Tidak ada respon';
  if (/kabur|mundur|resign|keluar/.test(n)) return 'Mundur / kabur';
  if (/interview/.test(n)) return 'Tidak lolos interview user';
  if (/psiko/.test(n)) return 'Tidak lolos psikotes';
  if (/mcu|medical/.test(n)) return 'Tidak lolos MCU';
  return 'Tidak lolos';
}
function classify(note) {
  const n = (note || '').toLowerCase();
  if (!n) return 'pr';
  if (/hold/.test(n)) return 'hd';
  if (/tidak|menolak|tolak|kabur|mundur|gagal|no response|batal/.test(n)) return 'no';
  return 'pr';
}
function splitLine(line) {
  const i = line.search(/\s-|-\s/);
  if (i < 0) return { name: line.trim(), note: '' };
  return { name: line.slice(0, i).trim(), note: line.slice(i).replace(/^\s*-\s*/, '').trim() };
}
function candidates(p) {
  const out = [];
  const lines = (p.ket || '').split(/\n+/).map((s) => s.trim()).filter(Boolean);
  const hired = !isVacant(p) ? normName(p.nama) : null;
  lines.forEach((l) => {
    const { name, note } = splitLine(l);
    let st = classify(note);
    if (hired && normName(name) === hired) st = 'ok';
    else if (isClose(p) && st === 'pr') st = 'no';
    out.push({ name, note, st, reason: st === 'no' ? (note ? reasonOf(note) : 'Tidak terpilih') : '' });
  });
  if (isClose(p) && hired && !out.some((c) => c.st === 'ok')) out.push({ name: p.nama, note: '', st: 'ok', reason: '' });
  (p.hist || []).forEach((h) => { if (!out.some((c) => normName(c.name) === normName(h.name))) out.push({ ...h, fromHist: true }); });
  return out;
}
const ST_LBL = { pr: 'Proses', hd: 'Hold', no: 'Tidak lolos', ok: 'Diterima' };
function candStatusText(c, p) {
  const si = stageIdx(p);
  if (c.st === 'ok') return 'Diterima';
  if (c.st === 'no') { const n = (c.note || '').toLowerCase(); const lb = /respon/.test(n) ? 'No Response' : /menolak|tolak/.test(n) ? 'Menolak OL' : /kabur|mundur/.test(n) ? 'Mundur' : 'Tidak Lolos'; return `${lb} • Tidak Aktif`; }
  if (c.st === 'hd') return `Hold • ${STAGE_UP[si]} ${STAGE_PCT[si]}%`;
  return `Aktif • ${STAGE_UP[si]} ${STAGE_PCT[si]}%`;
}
// Keep candidates that disappear between Excel versions (same position no. + PTK) so failed applicants stay on record.
function mergeHistory(oldD, newD) {
  if (!oldD || !oldD.positions) return newD;
  newD.positions.forEach((p) => {
    const o = oldD.positions.find((x) => x.no === p.no && x.ptk && x.ptk === p.ptk);
    if (!o) return;
    const now = candidates(p).map((c) => normName(c.name));
    const hist = (o.hist || []).slice();
    candidates({ ...o, hist: [] }).forEach((c) => {
      if (now.includes(normName(c.name)) || hist.some((h) => normName(h.name) === normName(c.name))) return;
      if (c.st === 'ok') return;
      const st = c.st === 'no' ? 'no' : 'no';
      hist.push({ name: c.name, note: c.note || 'Tidak terpilih', st, reason: c.st === 'no' ? c.reason : 'Tidak terpilih' });
    });
    if (hist.length) p.hist = hist;
  });
  return newD;
}

// ---------- derived ----------
function derive() {
  const P = DATA.positions;
  const planning = P.length, vacant = P.filter(isVacant).length, actual = planning - vacant;
  const open = P.filter(isOpen).sort((a, b) => (diff(a.due, TODAY) ?? 9999) - (diff(b.due, TODAY) ?? 9999));
  const cont = P.filter((p) => hasPTK(p) && /^continue$/i.test(p.status || ''));
  const closed = P.filter(isClose);
  const ket = {}; P.forEach((p) => { const k = ketPTK(p); ket[k] = (ket[k] || 0) + 1; });
  const openCands = []; open.forEach((p) => candidates(p).forEach((c) => openCands.push({ ...c, p })));
  const allCands = []; P.filter(hasPTK).forEach((p) => candidates(p).forEach((c) => allCands.push({ ...c, p })));
  // pipeline: active/hold candidates at their position's current stage; positions with no active candidate count once
  const pipe = STAGES.map(() => 0).concat([0]);
  closed.forEach((p) => { if (p.close && p.close.slice(0, 7) === TODAY.slice(0, 7)) pipe[8]++; });
  open.forEach((p) => { const act = candidates(p).filter((c) => c.st === 'pr' || c.st === 'hd').length; pipe[stageIdx(p)] += Math.max(act, act ? 0 : 1); });
  const vacJab = {}; P.filter(isVacant).forEach((p) => { const j = (p.jabatan || '–').trim(); (vacJab[j] = vacJab[j] || []).push(p); });
  const unitTot = DATA.units.reduce((a, b) => a + b.jumlah, 0);
  return { P, planning, vacant, actual, open, cont, closed, ket, openCands, allCands, pipe, vacJab, unitTot };
}

// ---------- charts ----------
function areaChart(vals) {
  const W = 640, H = 250, L = 30, R = 16, T = 22, B = 30;
  const max = Math.max(1, ...vals); const top = Math.max(5, Math.ceil(max));
  const x = (i) => L + (W - L - R) * i / (vals.length - 1);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const pts = vals.map((v, i) => [x(i), y(v)]);
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; const cx = (x0 + x1) / 2; d += ` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`; }
  const area = `${d} L${x(vals.length - 1)} ${y(0)} L${x(0)} ${y(0)} Z`;
  let g = '';
  for (let v = 0; v <= top; v++) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary-2)" stop-opacity=".32"/><stop offset="1" stop-color="var(--primary-2)" stop-opacity=".04"/></linearGradient></defs>`;
  g += `<path d="${area}" fill="url(#ag)"/><path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>`;
  pts.forEach(([px, py], i) => { g += `<circle cx="${px}" cy="${py}" r="4.5" fill="var(--card)" stroke="var(--primary)" stroke-width="2.5"><title>${STAGE_TIP[i]}: ${vals[i]}</title></circle><text class="val" x="${px}" y="${py - 11}" text-anchor="middle">${vals[i]}</text><text x="${px}" y="${H - 8}" text-anchor="middle">${STAGE_SHORT[i]}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Jumlah kandidat per tahap rekrutmen">${g}</svg></div>`;
}
function donutChart(actual, vacant) {
  const tot = Math.max(1, actual + vacant), r = 80, cx = 110, cy = 110, sw = 30, C = 2 * Math.PI * r, gap = 6;
  const la = C * actual / tot, lv = C * vacant / tot;
  const seg = (len, off, col, t) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-dasharray="${Math.max(0, len - gap)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${t}</title></circle>`;
  return `<div class="donut"><svg viewBox="0 0 220 220" role="img" aria-label="Actual ${actual}, vacant ${vacant}">${seg(la, 0, 'var(--c1)', `Actual ${actual}`)}${vacant ? seg(lv, la, 'var(--c3)', `Vacant ${vacant}`) : ''}</svg>
  <div class="c"><b class="num">${Math.round(actual / tot * 100)}%</b><span>${actual} dari ${tot} terisi</span></div></div>
  <div class="legend"><span><i style="background:var(--c1)"></i>Actual ${actual}</span><span><i style="background:var(--c3)"></i>Vacant ${vacant}</span></div>`;
}
function hbars(entries, colorFn) {
  const mx = Math.max(1, ...entries.map((e) => e[1]));
  return `<div class="hbars">${entries.map(([k, v], i) => `<div class="hb"><span class="t" title="${esc(k)}">${esc(k)}</span><span class="tr"><span class="f" style="width:${v / mx * 100}%;background:${colorFn(i)}"></span></span><span class="v">${v}</span></div>`).join('')}</div>`;
}

function masaKerja(a, b) {
  if (!a) return '';
  const s = new Date(a + 'T00:00:00Z'), e = new Date((b || TODAY) + 'T00:00:00Z');
  let y = e.getUTCFullYear() - s.getUTCFullYear(), m = e.getUTCMonth() - s.getUTCMonth(), d = e.getUTCDate() - s.getUTCDate();

  return `${y} Tahun ${m} Bulan ${d} hari`;
}

async function commit(mutate, okMsg) {
  if (!CAN_EDIT || SAVING) return false;
  const next = JSON.parse(JSON.stringify(STATE));
  mutate(next);
  next.positions.forEach((p, i) => { p.no = i + 1; });
  next.meta = { ...(next.meta || {}), updated: TODAY };
  SAVING = true; showSaving(true);
  try { sessionStorage.setItem('mp5-flash', okMsg || 'Perubahan tersimpan.'); sessionStorage.setItem('mp5-page', ui.page); } catch (e) {}
  try {
    await ART.publish(buildDoc(next));
    STATE = next; DATA = next; render();
    return true;
  } catch (e) {
    try { sessionStorage.removeItem('mp5-flash'); } catch (er) {}
    const c = e && e.code;
    if (c === 'conflict') toast('Ada versi yang lebih baru. Halaman dimuat ulang, silakan ulangi perubahan.', true);
    else if (c === 'not_writer' || c === 'not_granted' || c === 'consent_required' || c === 'not_declared' || c === 'capability_disabled') { CAN_EDIT = false; ROLE = 'Pelihat'; render(); toast('Akun ini hanya bisa melihat. Perubahan tidak disimpan.', true); }
    else if (c === 'rate_limited') toast('Terlalu sering menyimpan. Tunggu sebentar lalu coba lagi.', true);
    else toast('Gagal menyimpan: ' + ((e && e.message) || 'coba lagi.'), true);
    return false;
  } finally { SAVING = false; showSaving(false); }
}

  else if (f.type === 'textarea') inp = `<textarea id="${id}" name="${f.k}" rows="${f.rows || 4}" placeholder="${esc(f.ph || '')}">${esc(val)}</textarea>`;
  else if (f.type === 'date') inp = (val && !isDate(val)) ? `<input id="${id}" name="${f.k}" type="text" value="${esc(val)}" placeholder="YYYY-MM-DD">` : `<input id="${id}" name="${f.k}" type="date" value="${esc(val)}">`;
  else if (f.type === 'number') inp = `<input id="${id}" name="${f.k}" type="number" min="0" step="1" value="${esc(val)}" ${f.req ? 'required' : ''}>`;

  else inp = `<input id="${id}" name="${f.k}" type="text" value="${esc(val)}" ${f.list ? `list="dl_${f.k}"` : ''} placeholder="${esc(f.ph || '')}" ${f.req ? 'required' : ''} autocomplete="off">${f.list ? `<datalist id="dl_${f.k}">${f.list.map((o) => `<option value="${esc(o)}"></option>`).join('')}</datalist>` : ''}`;

function readForm() {

document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'frm') return;
  e.preventDefault();
  const v = readForm();
  const all = (FORM.sections || [{ fields: FORM.fields }]).flatMap((g) => g.fields);
  const miss = all.filter((f) => f.req && (v[f.k] === null || v[f.k] === ''));
  const er = document.getElementById('ferr');
  if (miss.length) { er.textContent = 'Lengkapi: ' + miss.map((f) => f.label).join(', ') + '.'; er.hidden = false; return; }
  const bad = all.filter((f) => f.type === 'date' && v[f.k] && !isDate(v[f.k]) && !f.freeText);
  if (bad.length) { er.textContent = 'Format tanggal harus YYYY-MM-DD: ' + bad.map((f) => f.label).join(', ') + '.'; er.hidden = false; return; }
  const ok = await FORM.onSave(v);
  if (ok !== false) closeModal();
});

function csvOf(head, rows) { const q = (v) => { const s = v == null ? '' : String(v); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }; return '﻿' + [head].concat(rows).map((r) => r.map(q).join(',')).join('\r\n'); }

}

async function printPDF() {
  let top = false; try { top = window.top === window.self; } catch (e) { top = false; }
  if (top) { window.print(); return; }
  if (typeof html2canvas === 'undefined' || !window.jspdf) { toast('Modul print belum termuat. Coba lagi sebentar.', true); return; }
  const btn = document.getElementById('printBtn'); if (btn) btn.disabled = true;
  toast('Menyiapkan PDF…');
  try {
    const el = document.getElementById('view');
    document.body.classList.add('printing');
    const svgs = [...el.querySelectorAll('svg')].map((s) => { const r = s.getBoundingClientRect(); const prev = [s.getAttribute('width'), s.getAttribute('height')]; s.setAttribute('width', Math.round(r.width)); s.setAttribute('height', Math.round(r.height)); return [s, prev]; });
    const base = el.getBoundingClientRect().top, elH = el.getBoundingClientRect().height;
    const blocks = [...el.querySelectorAll('tr, .kpi, .rcard, .mstats > div, .app, .sbx > div, .units > div, .hb, .cc, .chart, .donut, .legend, .head, .mhead, .ch, .fchip, .toolbar, p, h1, h2, .eyebrow, .pg, .plist > div, .kl > div')]
      .map((e) => { const r = e.getBoundingClientRect(); return [r.top - base, r.bottom - base]; }).filter(([a, b]) => b > a);
    let canvas;
    try { canvas = await html2canvas(el, { scale: 2, backgroundColor: '#F2F1FA', useCORS: true, onclone: (d) => d.body.classList.add('printing') }); }
    finally { svgs.forEach(([s, [w, h]]) => { if (w === null) s.removeAttribute('width'); else s.setAttribute('width', w); if (h === null) s.removeAttribute('height'); else s.setAttribute('height', h); }); }
    document.body.classList.remove('printing');
    const pdf = new window.jspdf.jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
    const stampImg = await stampForPdf();
    const pw = 210, ph = 297, m = 8, iw = pw - m * 2;
    const pxPerMm = canvas.width / iw, pageH = Math.floor((ph - m * 2) * pxPerMm);
    const k = canvas.height / elH;
    const iv = blocks.map(([a, b]) => [a * k, b * k]);
    const cands = [...new Set(iv.flatMap(([a, b]) => [Math.round(a), Math.round(b)]))].sort((a, b) => a - b);
    const safe = (c) => !iv.some(([a, b]) => c > a + 2 && c < b - 2);
    for (let y = 0, pg = 0; y < canvas.height - 4; pg++) {
      let end = y + pageH;
      if (end >= canvas.height) end = canvas.height;
      else {
        let best = -1;
        for (const c of cands) { if (c > y + pageH * 0.35 && c <= y + pageH && safe(c)) best = c; }
        if (best > 0) end = best;
      }
      const h = end - y;
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
      c.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (pg) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', m, m, iw, h / pxPerMm);
      if (stampImg) { try { pdf.saveGraphicsState(); pdf.setGState(new pdf.GState({ opacity: stampImg.op })); pdf.addImage(stampImg.url, 'PNG', (pw - stampImg.w) / 2, (ph - stampImg.h) / 2, stampImg.w, stampImg.h); pdf.restoreGraphicsState(); } catch (er) {} }
      y = end;
    }
    const name = PAGES.find((p) => p.id === ui.page).label.replace(/[^A-Za-z0-9]+/g, '_');
    await save(`${name}_KMB_${TODAY}.pdf`, pdf.output('blob'));
  } catch (e) { document.body.classList.remove('printing'); await printFallback(); }
  finally { if (btn) btn.disabled = false; }
}

function pageMPP(D) {
  const q = ui.mq.toLowerCase();
  const idxs = D.P.map((p, i) => [p, i]).filter(([p]) => {
    if (ui.mf !== 'semua') { if (!hasPTK(p) || (p.status || '').toLowerCase() !== ui.mf) return false; }
    return !q || `${p.nama} ${p.jabatan} ${p.section} ${p.group} ${p.ket} ${p.ptk}`.toLowerCase().includes(q);
  });
  const cols = 19 + (CAN_EDIT ? 1 : 0);
  let body = '', lastS, lastG;
  idxs.forEach(([p, i]) => {
    if (ui.mf === 'semua' && !q) {
      if (p.section !== lastS) { body += `<tr class="grpr"><td colspan="${cols}">${esc(p.section || '')}</td></tr>`; lastS = p.section; lastG = p.section; }
      if (p.group !== lastG) { body += `<tr class="subr"><td colspan="${cols}">${esc(p.group)}</td></tr>`; lastG = p.group; }
    }

const closeModal = () => { document.getElementById('modal').hidden = true; FORM = null; };

document.addEventListener('click', (e) => {
  const t = e.target;
  const g = t.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  if (t.closest('#menuBtn')) { const o = document.body.classList.toggle('nav-open'); document.getElementById('scrim').hidden = !o; return; }
  if (t.id === 'scrim') { document.body.classList.remove('nav-open'); t.hidden = true; return; }

  if (t.closest('#upBtn') || t.closest('[data-sync]')) { if (CAN_EDIT) document.getElementById('fileIn').click(); return; }
  if (t.closest('#colBtn')) { ui.allCols = !ui.allCols; render(); return; }
  if (t.closest('#fCancel') || t.id === 'mClose' || t.id === 'modal') { closeModal(); return; }
  if (t.closest('#fDanger') && FORM && FORM.dangerFn) { FORM.dangerFn(); return; }
  const ep = t.closest('[data-epos]'); if (ep && CAN_EDIT) { mppForm(+ep.dataset.epos); return; }
  if (t.closest('#addPos') && CAN_EDIT) { mppForm(null); return; }
  const em = t.closest('[data-emp]'); if (em && CAN_EDIT) { const [k, i] = em.dataset.emp.split(':'); mpForm(k, +i); return; }
  const am = t.closest('[data-addmp]'); if (am && CAN_EDIT) { mpForm(am.dataset.addmp, null); return; }
  const mo = t.closest('[data-mpout]'); if (mo && CAN_EDIT) { mpOutForm(+mo.dataset.mpout); return; }
  const eu = t.closest('[data-eunit]'); if (eu && CAN_EDIT) { unitForm(+eu.dataset.eunit); return; }
  if (t.closest('#addUnit') && CAN_EDIT) { unitForm(null); return; }
  const cv = t.closest('[data-csv]'); if (cv) { exportCSV(cv.dataset.csv); return; }
  if (t.closest('#xlsxBtn')) { exportXLSX(); return; }
  if (t.closest('#bkBtn')) { save(`Backup_Manpower_KMB_${TODAY}.json`, JSON.stringify(STATE, null, 1)); return; }
  if (t.closest('#rsBtn') && CAN_EDIT) { document.getElementById('rsIn').click(); return; }

document.getElementById('fileIn').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file || !CAN_EDIT) return;
  if (typeof XLSX === 'undefined') { toast('Pembaca Excel belum termuat. Coba lagi sebentar.', true); return; }
  try {
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const sheets = {};
    wb.SheetNames.forEach((n) => {
      const ws = wb.Sheets[n]; if (!ws['!ref']) { sheets[n] = []; return; }
      const rg = XLSX.utils.decode_range(ws['!ref']); const rows = [];
      for (let r = 0; r <= Math.min(rg.e.r, 1500); r++) { const row = []; for (let c = 0; c <= Math.min(rg.e.c, 60); c++) { const cell = ws[XLSX.utils.encode_cell({ r, c })]; row.push(cell && cell.t !== 'e' ? cell.v : null); } rows.push(row); }
      sheets[n] = rows;
    });
    const parsed = mergeHistory(STATE, parseSheets(sheets));

// ================= v6: structured applicants per position (Pelamar) =================
const C_STATUS = ['Aktif', 'Hold', 'No Response', 'Tidak Lolos', 'Menolak OL', 'Mundur', 'Diterima'];
const C_SUMBER = ['Online', 'Job Portal', 'Referral', 'Walk-in', 'Agency / Vendor', 'Internal', 'Lainnya'];
const ST_OF = (s) => s === 'Aktif' ? 'pr' : s === 'Hold' ? 'hd' : s === 'Diterima' ? 'ok' : 'no';
const C_BADGE = { Aktif: 'pr', Hold: 'hd', Diterima: 'ok' };
function statusFromNote(note) {
  const n = (note || '').toLowerCase();
  if (!n) return 'Aktif';
  if (/hold/.test(n)) return 'Hold';
  if (/respon|no response/.test(n)) return 'No Response';
  if (/menolak|tolak/.test(n)) return 'Menolak OL';
  if (/kabur|mundur|resign|batal/.test(n)) return 'Mundur';
  if (/tidak|gagal/.test(n)) return 'Tidak Lolos';
  return 'Aktif';
}
function materialize(p) {
  if (Array.isArray(p.cands)) return p;
  const base = Math.max(0, stageIdx(p));
  const hired = !isVacant(p) ? normName(p.nama) : null;
  const out = [];
  (p.ket || '').split(/\n+/).map((s) => s.trim()).filter(Boolean).forEach((l) => {
    const { name, note } = splitLine(l);
    let status = statusFromNote(note);
    if (hired && normName(name) === hired) status = 'Diterima';
    else if (isClose(p) && status === 'Aktif') status = 'Tidak Lolos';
    out.push({ name, status, sumber: null, stage: status === 'Diterima' ? 7 : base, note: note || null });
  });
  if (isClose(p) && hired && !out.some((c) => c.status === 'Diterima')) out.push({ name: p.nama, status: 'Diterima', sumber: null, stage: 7, note: null });
  p.cands = out;
  return p;
}
function ketFromCands(cs) { return cs.map((c) => c.note ? `${c.name} - ${c.note}` : (c.status === 'Aktif' || c.status === 'Diterima') ? c.name : `${c.name} - ${c.status}`).join('\n') || null; }
STATE.positions.forEach(materialize);

function candidates(p) {
  materialize(p);
  const out = p.cands.map((c) => { const st = ST_OF(c.status); return { name: c.name, note: c.note || '', st, status: c.status, sumber: c.sumber, stage: c.stage ?? stageIdx(p), reason: st === 'no' ? (c.status === 'Tidak Lolos' ? (c.note ? reasonOf(c.note) : 'Tidak lolos') : c.status === 'No Response' ? 'Tidak ada respon' : c.status === 'Menolak OL' ? 'Menolak offering' : c.status === 'Mundur' ? 'Mundur / kabur' : 'Tidak lolos') : '' }; });
  (p.hist || []).forEach((h) => { if (!out.some((c) => normName(c.name) === normName(h.name))) out.push({ ...h, status: h.status || 'Tidak Lolos', stage: h.stage ?? stageIdx(p), fromHist: true }); });
  return out;
}
function candStatusText(c, p) {
  const s = c.stage ?? stageIdx(p);
  if (c.st === 'ok') return 'Diterima';
  if (c.st === 'no') return `${c.status || 'Tidak Lolos'} • Tidak Aktif`;
  return `${c.st === 'hd' ? 'Hold' : 'Aktif'} • ${STAGE_UP[s]} ${STAGE_PCT[s]}%`;
}
const inFlight = (c) => c.st === 'pr' || c.st === 'hd' || c.status === 'No Response';
// Progress posisi = tahap terakhir yang sudah diisi, baik di data posisi maupun di pelamar yang masih aktif / diterima (walau berkas belum diupload)
function progIdx(p) { let k = stageIdx(p); try { candidates(p).forEach((c) => { if (c.st !== 'no' && !c.fromHist) k = Math.max(k, Math.min(7, Number(c.stage) || 0)); }); } catch (e) {} return k; }
function topStage(p) { const a = candidates(p).filter((c) => c.st === 'pr' || c.st === 'hd'); return a.length ? Math.max(...a.map((c) => c.stage)) : stageIdx(p); }

function derive() {
  const P = DATA.positions;
  const planning = P.length, vacant = P.filter(isVacant).length, actual = planning - vacant;
  const open = P.filter(isOpen).sort((a, b) => (diff(a.due, TODAY) ?? 9999) - (diff(b.due, TODAY) ?? 9999));
  const cont = P.filter((p) => hasPTK(p) && /^continue$/i.test(p.status || ''));
  const closed = P.filter(isClose);
  const ket = {}; P.forEach((p) => { const k = ketPTK(p); ket[k] = (ket[k] || 0) + 1; });
  const openCands = []; open.forEach((p) => candidates(p).forEach((c) => openCands.push({ ...c, p })));
  const allCands = []; P.forEach((p) => candidates(p).forEach((c) => allCands.push({ ...c, p })));
  const pipe = STAGES.map(() => 0).concat([0]);
  open.forEach((p) => { const act = candidates(p).filter((c) => c.st === 'pr' || c.st === 'hd'); if (act.length) act.forEach((c) => { pipe[c.stage]++; }); else pipe[stageIdx(p)]++; });
  closed.forEach((p) => { if (p.close && p.close.slice(0, 7) === TODAY.slice(0, 7)) pipe[8]++; });
  const vacJab = {}; P.filter(isVacant).forEach((p) => { const j = (p.jabatan || '–').trim(); (vacJab[j] = vacJab[j] || []).push(p); });
  const unitTot = DATA.units.reduce((a, b) => a + b.jumlah, 0);
  return { P, planning, vacant, actual, open, cont, closed, ket, openCands, allCands, pipe, vacJab, unitTot };
}
function resumeVacant(D) {
  const entries = Object.entries(D.vacJab).sort((a, b) => b[1].length - a[1].length);
  return `<div class="rgrid">${entries.map(([j, ps]) => {
    const cs = ps.flatMap((p) => candidates(p)); const act = cs.filter((c) => c.st === 'pr' || c.st === 'hd');
    const hi = Math.max(0, ...ps.map(topStage));
    const byStage = {}; act.forEach((c) => { const k = STAGE_UP[c.stage]; byStage[k] = (byStage[k] || 0) + 1; });
    ps.forEach((p) => { if (!candidates(p).some((c) => c.st === 'pr' || c.st === 'hd')) { const k = STAGE_UP[stageIdx(p)]; byStage[k] = (byStage[k] || 0) + 1; } });
    return `<div class="rcard"><div class="hd"><span class="nb">${ps.length}</span>${esc(j)}</div>
      <div class="l1">${act.length} pelamar untuk ${ps.length} vacant</div>
      <div class="l3">${cs.length} kandidat tercatat • ${cs.filter((c) => c.st === 'no').length} tidak lolos</div>
      <div class="l3">${Object.entries(byStage).map(([k, n]) => `${n}× ${k}`).join(' • ')}</div>
      <button type="button" class="more ${ui.jf === j ? 'on' : ''}" data-detail="${esc(j)}">${ui.jf === j ? 'Sedang difilter ✓' : 'Lihat detail →'}</button></div>`;
  }).join('') || '<div class="empty">Tidak ada posisi vacant.</div>'}</div>`;
}

function pipeSeries(ps) {
  const act = STAGES.map(() => 0), off = STAGES.map(() => 0);
  ps.forEach((p) => candidates(p).forEach((c) => { const s = Math.min(7, Math.max(0, c.stage ?? stageIdx(p))); if (c.st === 'pr' || c.st === 'hd') act[s]++; else if (c.st === 'no') off[s]++; }));
  return { act, off };
}
function pipeChart(act, off) {
  const W = 640, H = 260, L = 30, R = 16, T = 24, B = 30;
  const max = Math.max(1, ...act, ...off); const top = Math.max(4, Math.ceil(max));
  const x = (i) => L + (W - L - R) * i / (act.length - 1);
  const y = (v) => T + (H - T - B) * (1 - v / top);
  const path = (vals) => { const pts = vals.map((v, i) => [x(i), y(v)]); let d = `M${pts[0][0]} ${pts[0][1]}`; for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; const cx = (x0 + x1) / 2; d += ` C${cx} ${y0} ${cx} ${y1} ${x1} ${y1}`; } return [d, pts]; };
  const [da, pa] = path(act), [dn, pn] = path(off);
  const step = top <= 6 ? 1 : top <= 12 ? 2 : 5;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L - 10}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  g += `<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--primary-2)" stop-opacity=".30"/><stop offset="1" stop-color="var(--primary-2)" stop-opacity=".03"/></linearGradient></defs>`;
  g += `<path d="${da} L${x(act.length - 1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="url(#ag)"/>`;
  g += `<path d="${dn}" fill="none" stroke="var(--c3)" stroke-width="2" stroke-dasharray="5 4"/><path d="${da}" fill="none" stroke="var(--primary)" stroke-width="2.5"/>`;
  pn.forEach(([px, py], i) => { g += `<circle cx="${px}" cy="${py}" r="4" fill="var(--card)" stroke="var(--c3)" stroke-width="2"><title>${STAGES[i]}: ${off[i]} tidak aktif</title></circle>`; if (off[i]) g += `<text x="${px + 9}" y="${py + 4}" style="fill:var(--crit);font-weight:800;font-size:11px">${off[i]}</text>`; });
  pa.forEach(([px, py], i) => { g += `<circle cx="${px}" cy="${py}" r="4.5" fill="var(--card)" stroke="var(--primary)" stroke-width="2.5"><title>${STAGES[i]}: ${act[i]} aktif</title></circle><text class="val" x="${px}" y="${py - 11}" text-anchor="middle">${act[i]}</text><text x="${px}" y="${H - 8}" text-anchor="middle">${STAGE_SHORT[i]}</text>`; });
  const ta = act.reduce((a, b) => a + b, 0), tn = off.reduce((a, b) => a + b, 0);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Pelamar aktif dan tidak aktif per tahap">${g}</svg></div>
    <div class="legend"><span><i style="background:var(--primary)"></i>Aktif / Hold <b>${ta}</b></span><span><i style="background:var(--c3)"></i>Tidak aktif <b>${tn}</b></span><span class="small">Total ${ta + tn} pelamar PTK open</span></div>`;
}

// ================= v8: rekap manpower per jabatan (auto) =================
function rekapJabatan(P) {
  const key = (j) => (j || '–').toLowerCase().replace(/middle/g, 'midle').split(/\s+/).filter(Boolean).sort().join(' ');
  const m = new Map();
  P.forEach((p) => {
    const k = key(p.jabatan);
    if (!m.has(k)) m.set(k, { labels: {}, plan: 0, act: 0, vac: 0, open: 0, pel: 0, secs: new Set() });
    const r = m.get(k); const lb = (p.jabatan || '–').trim(); r.labels[lb] = (r.labels[lb] || 0) + 1;
    r.plan++; if (isVacant(p)) r.vac++; else r.act++;
    if (isOpen(p)) r.open++;
    if (isOpen(p)) r.pel += candidates(p).filter((c) => c.st === 'pr' || c.st === 'hd').length;
    if (p.section) r.secs.add(p.section);
  });
  return [...m.values()].map((r) => ({ ...r, jabatan: Object.entries(r.labels).sort((a, b) => b[1] - a[1])[0][0], secs: [...r.secs] }));
}
function rekapBlock(D) {
  const rows = rekapJabatan(D.P);
  const tot = rows.reduce((a, r) => ({ plan: a.plan + r.plan, act: a.act + r.act, vac: a.vac + r.vac }), { plan: 0, act: 0, vac: 0 });
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const bar = (a, b) => `<div class="pg"><span class="tr"><i style="width:${pct(a, b)}%;${a < b ? '' : 'background:var(--good)'}"></i></span><b>${pct(a, b)}%</b></div>`;
  const sel = (a, b) => a - b === 0 ? '<span class="dd good">0</span>' : `<span class="dd crit">${a - b}</span>`;
  return `<div class="card" style="margin-bottom:18px"><div class="ch"><div><div class="eyebrow">Rekapitulasi</div><h2>Rekapitulasi MPP vs MPA per Jabatan</h2><p>MPP = Manpower Planning, MPA = Manpower Actual (posisi MPP yang sudah terisi nama). Otomatis dari MPP KMB.</p></div><span class="pill">MPP ${tot.plan} • MPA ${tot.act}</span></div>
  <div class="tw"><table class="t rk"><thead><tr><th>No</th><th>Jabatan</th><th class="n">MPP</th><th class="n">MPA</th><th class="n">Selisih</th><th>% Pemenuhan</th></tr></thead><tbody>
  ${rows.map((r, i) => `<tr><td class="n">${i + 1}</td><td>${jabChip(r.jabatan)}</td><td class="n b">${r.plan}</td><td class="n">${r.act}</td><td class="n">${sel(r.act, r.plan)}</td><td>${bar(r.act, r.plan)}</td></tr>`).join('')}
  </tbody><tfoot><tr><td></td><td class="b">Total</td><td class="n b">${tot.plan}</td><td class="n b">${tot.act}</td><td class="n b">${sel(tot.act, tot.plan)}</td><td>${bar(tot.act, tot.plan)}</td></tr></tfoot></table></div></div>`;
}

async function openFile(id, name) {

        const vp = pg.getViewport({ scale: sc }); const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height; c.className = 'vpage';

function mpNorm(s) { return String(s || '').toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim(); }

  return d[a.length][b.length];
}
function mpScore(x, y) {
  if (!x || !y) return 0;
  if (x === y) return 100;

  if (s.every((t, i) => l[i] === t)) return 90;                       // "bepri agung" ~ "bepri agung nugroho"
  if (mpLev(x, y) <= 2 && Math.min(x.length, y.length) >= 5) return 80; // "selamet hariadi" ~ "slamet heriadi"
  if (s.length === 1 && l[0].startsWith(s[0]) && s[0].length >= 3) return 60; // "adi" ~ "aditya"
  if (tx[0] === ty[0] && tx[0].length >= 4 && s.slice(1).every((t) => l.some((u) => mpLev(t, u) <= 1))) return 70;

}

    const a = pick.has(i) ? src[pick.get(i)] : null;

// uploaded files live in a private Supabase bucket; '/_blob/<id>' links are served from there
const _fetch = window.fetch.bind(window);
window.fetch = async function (u, o) {
  if (typeof u === 'string' && u.startsWith('/_blob/')) {
    const id = decodeURIComponent(u.slice(7));
    if (!WEB.sb || !CAN_EDIT) return new Response('', { status: 403 });
    const { data, error } = await WEB.sb.storage.from(WEB_BUCKET).download(id);
    if (error || !data) return new Response('', { status: /not.?found|404/i.test((error && error.message) || '') ? 404 : 403 });
    const type = data.type || (/\.pdf$/i.test(id) ? 'application/pdf' : /\.png$/i.test(id) ? 'image/png' : /\.webp$/i.test(id) ? 'image/webp' : /\.jpe?g$/i.test(id) ? 'image/jpeg' : '');
    return new Response(data, { status: 200, headers: { 'content-type': type } });
  }
  return _fetch(u, o);
};
const WEB_ASSETS = { async upload(f) {
  const ext = (f.name.match(/\.[A-Za-z0-9]+$/) || [''])[0].toLowerCase();
  const id = (WEB_ID === 'main' ? '' : WEB_ID + '/') + (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)) + ext;
  const { error } = await WEB.sb.storage.from(WEB_BUCKET).upload(id, f, { contentType: f.type, upsert: false });
  if (error) { const e = new Error(error.message); e.code = /size|large/i.test(error.message) ? 'too_large' : /policy|security|denied|unauthor/i.test(error.message) ? 'not_granted' : 'error'; throw e; }
  return { id, contentType: f.type };
} };

  if (r.error) throw r.error;
  const row = (r.data || [])[0] || null;
  WEB.noAccess = !row;

  WEB.empty = true; return false;
}

async function commit(mutate, okMsg) {
  if (!CAN_EDIT || SAVING || !WEB.sb) return false;
  const next = JSON.parse(JSON.stringify(STATE));
  mutate(next);
  next.positions.forEach((p, i) => { p.no = i + 1; });
  next.meta = { ...(next.meta || {}), updated: TODAY };
  SAVING = true; showSaving(true);
  let reopen = null; try { reopen = sessionStorage.getItem('mp5-cands'); sessionStorage.removeItem('mp5-cands'); } catch (e) {}
  try {
    const cur = SHARE_KEY ? {data:{updated_at:WEB.ver}} : await WEB.sb.from(WEB_TABLE).select('updated_at').eq('id', WEB_ID).maybeSingle();
    if (cur.error) throw cur.error;
    if ((cur.data ? cur.data.updated_at : null) !== WEB.ver) { await webLoad(); toast('Data baru saja diubah editor lain. Data terbaru sudah dimuat, silakan ulangi perubahan.', true); return false; }
    const r = SHARE_KEY ? await WEB.sb.rpc('monitoring_guest_write',{p_token:SHARE_KEY,p_id:WEB_ID,p_data:next,p_old:WEB.ver}) : await WEB.sb.from(WEB_TABLE).upsert({ id: WEB_ID, data: next, updated_at: new Date().toISOString(), updated_by: WEB.user.email }).select('updated_at').single();
    if (r.error) throw r.error;
    WEB.ver = SHARE_KEY ? r.data : r.data.updated_at;
    setState(next);
    toast(okMsg || 'Perubahan tersimpan.');
    if (reopen !== null && DATA.positions[+reopen]) setTimeout(() => openCands(+reopen), 60);
    return true;
  } catch (e) {
    const m = (e && e.message) || '';
    toast(/policy|security|permission|denied/i.test(m) ? 'Akun ini tidak punya akses edit.' : 'Gagal menyimpan: ' + (m || 'periksa koneksi lalu coba lagi.'), true);
    return false;
  } finally { SAVING = false; showSaving(false); }
}

async function webInit() {
  authBtn();
  if (!window.supabase || !window.supabase.createClient) { WEB.offline = true; monitoringStatus('Layanan data tidak terhubung','Gagal memuat koneksi database. Coba buka di Safari/Chrome, lalu tekan Coba Muat Ulang.'); return; }
  WEB.sb = window.supabase.createClient(WEB_CFG.url, WEB_CFG.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'kta-web-auth' } });
  if(SHARE_KEY){
    const check=await Promise.race([
      WEB.sb.rpc('monitoring_guest_check',{p_token:SHARE_KEY}),
      new Promise(resolve=>setTimeout(()=>resolve({error:{message:'Koneksi terlalu lama. Periksa sinyal lalu muat ulang.'}}),16000))
    ]);
    if(check.error) { monitoringStatus('Tidak dapat memeriksa link',check.error.message||'Server tidak merespons.'); return; }
    const g=(check.data||[]).find(v=>v.app_id===WEB_ROLE_APP);
    GUEST_ROLE=g?g.access_role:'';
    if(GUEST_ROLE&&window.KMBRememberedAccess)window.KMBRememberedAccess.remember(WEB_ROLE_APP,SHARE_KEY,GUEST_ROLE);
    if(!GUEST_ROLE){ monitoringStatus('Link tidak berlaku','Minta Pemilik membuat link baru melalui Bagikan → Link tanpa login.'); return; }
  }
  // Link berbagi memegang token izin sendiri. Jangan menunggu Auth email di HP (dapat menggantung pada sinyal lemah).
  if (!SHARE_KEY) {
    try {
      const authState = await Promise.race([WEB.sb.auth.getSession(), new Promise(resolve=>setTimeout(()=>resolve({data:null}),8000))]);
      WEB.user = (authState.data && authState.data.session && authState.data.session.user) || null;
    } catch (e) { WEB.user = null; }
  } else { WEB.user = null; }
  try {
    const received=await Promise.race([
      webLoad().then(()=>({ok:true})),
      new Promise(resolve=>setTimeout(()=>resolve({error:'Koneksi data terlalu lama'}),20000))
    ]);
    if(received.error){monitoringStatus('Data belum dapat dimuat','Server lambat merespons. Periksa sinyal lalu ketuk Coba Muat Ulang.');return;}
  } catch (e) {
    monitoringStatus('Data belum dapat dimuat',(e&&e.message)||'Periksa koneksi dan muat ulang.');
    return;
  }
  await applyRole();
  WEB.ready = true; render(); loadMppSheetTitle();
  if (WEB.noAccess && !CAN_EDIT) lockWeb();
  setInterval(() => { if (!CAN_EDIT && !document.hidden && WEB.sb) { webLoad().catch(() => {}); if (PROJ.sites) loadAllSites(); } }, 60000);
  if (CAN_EDIT && WEB.empty && !WEB.noAccess) await commit(() => {}, 'Data awal tersimpan di server.');
  WEB.sb.auth.onAuthStateChange((ev, s) => {
    const nu = (s && s.user) || null;
    if ((nu && nu.email) === (WEB.user && WEB.user.email)) return;
    WEB.user = nu;
    setTimeout(async () => { await applyRole(); try { await webLoad(); if (PROJ.sites) loadAllSites(); } catch (er) {} if (CAN_EDIT && WEB.empty && !WEB.noAccess) commit(() => {}, 'Data awal tersimpan di server.'); if (ev === 'SIGNED_IN') toast(`Masuk sebagai ${nu.email} (${ROLE}).`); if (ev === 'SIGNED_OUT') toast('Anda sudah keluar.'); }, 0);
  });
  watchState();
