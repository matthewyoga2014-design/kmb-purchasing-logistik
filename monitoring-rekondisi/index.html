<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoring Rekondisi Vessel &amp; Dolly · KMB</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
/* VOICE: portal monitoring KMB — rapi, tenang, kartu putih di atas abu.
   IDEA: satu pintu monitoring; pilih jobsite (vendor) lalu masuk dashboard-nya.
   PICTURE: kartu jobsite + angka rekap + tabel unit dengan progress plan vs aktual.
   COLOUR and TYPE: abu #ececef, putih, merah KMB #e03b3b hanya untuk navigasi & tombol; status punya warna sendiri. Outfit.
   LAYOUT: sidebar kartu putih kiri, topbar kanan, breadcrumb, eyebrow merah, judul besar. */
:root{color-scheme:light;
--bg:#ececef;--card:#fff;--ink:#17171c;--mut:#6b6b78;--line:#e7e7ec;--soft:#f6f6f8;
--brand:#e03b3b;--brand2:#c92f2f;--brandbg:#fdeaea;--black:#1d1d22;
--sNot:#6b7280;--sNotBg:#eff0f3;
--sOp:#2563eb;--sOpBg:#e8efff;
--sLag:#b45309;--sLagBg:#fff2d9;
--sLate:#b91c1c;--sLateBg:#fde3e3;
--sDone:#15803d;--sDoneBg:#e2f5e8;
--sDoneL:#7c3aed;--sDoneLBg:#efe8ff;
--lav:#ece7fb}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Outfit,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,h4{margin:0;line-height:1.1;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.ic{flex:none;vertical-align:middle}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{padding:18px 0 18px 18px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;height:100vh;overflow:auto}
.scard{background:var(--card);border-radius:18px;padding:14px}
.brand{display:flex;gap:12px;align-items:center;padding:18px 16px}
.logo{width:46px;height:46px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 22px Outfit;flex:none}
.brand b{display:block;font-weight:700;font-size:17px}
.brand small{color:var(--mut);font-size:12.5px;line-height:1.3;display:block}
.back{display:flex;align-items:center;gap:6px;background:var(--brandbg);color:var(--brand);font-weight:600;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14px}
.sec{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.08em;margin:14px 8px 6px}
.nav a,.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:10px;text-decoration:none;font-weight:500;color:var(--ink);background:none;border:0;cursor:pointer;text-align:left;font-size:14.5px}
.nav a:hover,.nav button:hover{background:var(--soft)}
.nav a.on{background:var(--brand);color:#fff;font-weight:600}
.nav a.sub{padding-left:16px;font-size:14px}
.nav .cnt{margin-left:auto;background:var(--brandbg);color:var(--brand);font-size:11.5px;font-weight:700;border-radius:20px;padding:1px 8px}
.nav a.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.nav .add{color:var(--brand);font-weight:600}
.nav a.sel{background:var(--brandbg);color:var(--brand);font-weight:600}
.sec .ctx{display:inline-flex;align-items:center;gap:4px;background:var(--brandbg);color:var(--brand);border-radius:20px;padding:1px 4px 1px 8px;letter-spacing:0;text-transform:none;font-size:11.5px}
.sec .ctx button{border:0;background:none;color:var(--brand);cursor:pointer;font-weight:800;padding:0 4px;min-height:auto}
/* main */
.main{padding:18px clamp(14px,2.4vw,32px) 48px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.top .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap;text-decoration:none;font-size:14px}
.btn:hover{border-color:#c9c9d2}
.btn.pr{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.pr:hover{background:var(--brand2)}
.btn.dark{background:var(--black);color:#fff;border-color:var(--black)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--brand)}
.btn.sm{padding:4px 11px;min-height:32px;font-size:13px;border-radius:8px}
.btn.pill{border-radius:30px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid #f3a6a6;outline-offset:2px}
.user{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:30px;padding:5px 16px 5px 5px;border:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;background:var(--brandbg);color:var(--brand);display:grid;place-items:center;font-weight:700}
.user small{display:block;color:var(--mut);font-size:11.5px;line-height:1.1}
.user b{font-size:14px;font-weight:600;line-height:1.2;display:block}
.user i{font-style:normal;color:var(--brand);font-size:12px;font-weight:600}
.burger{display:none}
.crumb{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.crumb a,.crumb button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 12px;color:var(--brand);text-decoration:none;cursor:pointer}
.eyebrow{color:var(--brand);font-weight:700;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
.head h1{font-size:clamp(30px,3.6vw,46px);font-weight:800;letter-spacing:-.02em;margin:4px 0 6px;text-wrap:balance}
.head p{margin:0;color:#3c3c46}
.panel{background:var(--card);border-radius:18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:16px 20px 8px;flex-wrap:wrap}
.ph h3{font-size:18px;font-weight:700;flex:1 1 auto}
.ph .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ph .hint{flex-basis:100%;color:var(--mut);font-size:12.5px;margin-top:-4px}
.pb{padding:10px 20px 18px}
.redlink{color:var(--brand);font-weight:600;font-size:14px;text-decoration:none;background:none;border:0;cursor:pointer}
/* filter bar */
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:14px;padding:10px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:30px;padding:5px 14px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:34px}
.chip.on{background:var(--black);color:#fff;border-color:var(--black)}
.fbar select,.fbar input,.ph select,.ph input{border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-height:38px;background:var(--card);font-size:14px}
.fbar .finfo{margin-left:auto;color:var(--mut);font-size:13px;flex:1 1 240px;text-align:right}
.nw td{white-space:nowrap}
/* kpis */
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px;border:1px solid transparent;cursor:pointer;text-align:left}
.kpi:hover{border-color:#d6d6de}
.kpi.on{border-color:var(--black)}
.kpi .l{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:#3c3c46}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.kpi .v{font-size:clamp(28px,3vw,38px);font-weight:800;line-height:1.1;margin-top:6px}
.kpi .p{font-size:13.5px;font-weight:600;color:var(--mut)}
.pvsa{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.legend{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-weight:500;font-size:14px}
.legend b{text-align:right;font-weight:700}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
/* jobsite cards (beranda) */
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.jc{background:var(--card);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.jc .t{display:flex;justify-content:space-between;align-items:flex-start}
.tile{width:46px;height:46px;border-radius:12px;background:var(--brandbg);color:var(--brand);display:grid;place-items:center}
.tag{background:var(--black);color:#fff;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px}
.jc h3{font-size:19px}
.jc .s{color:var(--mut);font-size:13.5px;margin-top:-4px}
.jc .mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center;background:var(--soft);border-radius:12px;padding:8px 4px}
.jc .mini small{display:block;font-size:11px;color:var(--mut);font-weight:600;line-height:1.2}
.jc .mini b{font-size:19px;font-weight:800}
.jc .bot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.jc.add{border:2px dashed #d3d3db;background:transparent;align-items:center;justify-content:center;text-align:center;cursor:pointer;min-height:220px;color:var(--mut)}
/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px 12px;background:var(--soft);color:#3c3c46;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th.c,td.c{text-align:center}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td b{font-weight:600}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafafb}
td.lav{background:var(--lav);text-align:center;font-weight:600}
.bar{height:8px;border-radius:5px;background:#ececf1;position:relative;min-width:110px;margin-top:4px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bar>em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--black)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-not{background:var(--sNotBg);color:var(--sNot)}.b-op{background:var(--sOpBg);color:var(--sOp)}.b-lag{background:var(--sLagBg);color:var(--sLag)}.b-late{background:var(--sLateBg);color:var(--sLate)}.b-done{background:var(--sDoneBg);color:var(--sDone)}.b-donel{background:var(--sDoneLBg);color:var(--sDoneL)}
.b-type{border-radius:6px;color:#fff;font-weight:700;letter-spacing:.02em}.b-vessel{background:#0e7490}.b-dolly{background:#475569}
/* segmented filter, gaya web MPP */
.seg2{display:inline-flex;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:2px}
.seg2 button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;color:#3c3c46;cursor:pointer;min-height:36px}
.seg2 button:hover{background:var(--soft)}
.seg2 button.on{background:var(--brandbg);color:var(--brand)}
.segrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.c-not{color:var(--sNot)}.c-op{color:var(--sOp)}.c-lag{color:var(--sLag)}.c-late{color:var(--sLate)}.c-done{color:var(--sDone)}.c-donel{color:var(--sDoneL)}.cm{color:var(--mut)}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--brandbg);color:var(--brand);border-radius:10px;padding:10px 14px;font-weight:700;margin-top:10px}
.list{display:flex;flex-direction:column}
.list div{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.list b{font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.st small{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.st b{font-size:24px;font-weight:800;display:block;line-height:1.2}
.st i{font-style:normal;font-size:12px;font-weight:600}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qa button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;font-weight:600;text-align:left;font-size:14px}
.qa button:hover{border-color:var(--brand);color:var(--brand)}
.qa button svg{color:var(--brand)}
.qa button:disabled{opacity:.45;cursor:not-allowed}
.note{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--card);border-radius:14px;padding:12px 18px;font-size:13.5px}
.note b{font-weight:700}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.empty h3{color:var(--ink);margin-bottom:6px}
.warn{background:var(--sLagBg);color:#7a4300;border-radius:12px;padding:10px 14px}
.ok{background:var(--soft);border-radius:12px;padding:10px 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* forms */
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fg .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13.5px}
label.f span.h{font-weight:400;color:var(--mut);font-size:12.5px}
input,select,textarea{border:1px solid #dcdce3;border-radius:10px;padding:8px 11px;background:var(--card);min-height:42px;font-size:15px}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{min-height:auto;width:18px;height:18px;accent-color:var(--brand)}
.inl{display:flex;gap:8px;align-items:center;font-weight:500}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1 1 170px;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brandbg)}
.seg small{display:block;color:var(--mut)}
.edt input{min-height:36px;padding:4px 8px;font-size:14px;width:100%}
.edt td{padding:4px 6px}.ckt tr.pt td{background:#fef6e7}.seg2 label.sh{cursor:pointer}.seg2 label.sh input{position:absolute;opacity:0;width:0;height:0}.seg2 label.sh span{display:block;padding:7px 18px;font-size:14px;color:#3c3c46;border-radius:9px;font-weight:600}.seg2 label.sh:has(input:checked) span{background:var(--brandbg);color:var(--brand)}details.panel summary{cursor:pointer}
/* modal */
.mw{position:fixed;inset:0;background:rgba(20,20,28,.45);display:grid;place-items:start center;padding:4vh 12px;z-index:50;overflow:auto}
.mw[hidden]{display:none}
.mb{background:var(--card);border-radius:18px;width:min(900px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.mb.wide{width:min(1180px,100%)}
.mb>header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mb>header h3{flex:1;font-size:19px}
.mb>header button{background:var(--soft);border:0;border-radius:50%;cursor:pointer;width:36px;height:36px}
.mbody{padding:18px 20px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding-top:14px;flex-wrap:wrap}
.toast{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--black);color:#fff;padding:10px 14px;border-radius:12px;max-width:360px}
.toast div.err{background:var(--sLate)}
/* unit detail */
.info{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.info div{background:var(--soft);border-radius:10px;padding:8px 12px}
.info small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.info b{font-weight:600}
.tline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tline div{border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.tline small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.tline b{font-size:17px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 12px}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.gantt{display:grid;grid-template-columns:minmax(160px,280px) minmax(0,1fr) 56px;gap:6px 12px;align-items:center;font-size:13.5px}
.gtrack{position:relative;height:24px;background:var(--soft);border-radius:6px}
.gtrack i{position:absolute;height:7px;border-radius:4px}
.gtrack .po{top:2px;background:#cfcfd8}
.gtrack .pr{top:9px;background:var(--sOp)}
.gtrack .ac{top:16px;background:var(--sDone)}
.gtrack .td{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--black)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gal figure{margin:0;background:var(--soft);border-radius:10px;overflow:hidden;cursor:pointer}
.gal img{width:100%;height:110px;object-fit:cover;display:block}
.gal figcaption{font-size:11.5px;padding:4px 8px;color:var(--mut)}
.thumbs{display:flex;gap:4px;flex-wrap:wrap}
.thumbs img{width:34px;height:34px;object-fit:cover;border-radius:6px;cursor:pointer;background:var(--soft)}
.gdlink{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 6px;border-radius:6px;background:var(--soft);font-size:11px;font-weight:600;color:var(--brand)}
.gal .gdlink{width:100%;height:110px}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.flow .st{flex:1 1 110px;background:var(--card)}
.flow .ar{align-self:center;color:var(--mut);font-weight:800}
.loading{padding:60px;text-align:center;color:var(--mut)}

/* job sheet grid (mirip Excel Time Frame Job Sheet) */
.jsg{border-collapse:separate;border-spacing:0;font-size:12px;width:auto}
.jsg th,.jsg td{border-right:1px solid #e3e3ea;border-bottom:1px solid #e3e3ea;padding:4px 6px;white-space:nowrap;background:#fff}
.jsg th{background:var(--soft);text-transform:none;letter-spacing:0;font-size:11.5px;text-align:center}
.jsg .d{min-width:25px;width:25px;padding:0;text-align:center;font-size:10.5px;height:28px}
.jsg td.pl{background:#cfe0ff}.jsg td.ac{background:var(--sDone);color:#fff;font-weight:700}.jsg td.ap{background:#bfe8cc;color:#14532d;font-weight:600}
.jsg td.lt{background:var(--sLateBg)}.jsg td.og{background:repeating-linear-gradient(45deg,#e4e4ea 0 3px,#fff 3px 6px)}
.jsg .td{box-shadow:inset 2px 0 0 var(--black),inset -2px 0 0 var(--black)}.jsg th.sun{color:var(--sLate)}
.jsg .sk{position:sticky;z-index:2}.jsg td.sk{background:#fff}.jsg th.sk{background:var(--soft)}
.jsg .sk0{left:0;min-width:450px;text-align:right}.jsg .sk1{left:0;min-width:38px;max-width:38px;text-align:center}
.jsg .sk2{left:38px;min-width:250px;max-width:250px;white-space:normal}.jsg .sk3{left:288px;min-width:48px;max-width:48px;text-align:center}
.jsg .sk4{left:336px;min-width:52px;max-width:52px;text-align:center}.jsg .sk5{left:388px;min-width:62px;max-width:62px;text-align:right;box-shadow:2px 0 0 #cfcfd8}
.jsg tr.sum td{background:#fafafb;font-weight:600}.jsg tr.sum td.sk{background:#fafafb}.jsg .pr2{color:var(--sOp)}.jsg .ar2{color:var(--sDone)}
.jsg tr.jtot td{background:var(--soft);font-weight:700}
.jleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:0 0 10px}.jleg i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
@media(max-width:700px){.jsg .sk{position:static}}
@media(max-width:1200px){.kgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

(function(){
const SUPA={url:"https://yoviojbfyvgpllxisjvy.supabase.co",key:"sb_publishable_I26enb2Kz8iF4WFdH8vixA_8kek-kM9"};
const GAS_DEFAULT="https://script.google.com/macros/s/AKfycbzwpzVCf86e1bU_7CT1jB9VwLa-Y9vhlHbkcMgculpE8-XATAySbzZarv1kUc-_aqgq/exec";
const LS="rekon-gas",CK="rekon-cache";
const gasUrl=()=>{try{return localStorage.getItem(LS)||(GAS_DEFAULT.startsWith("@@")?"":GAS_DEFAULT)}catch(e){return GAS_DEFAULT.startsWith("@@")?"":GAS_DEFAULT}};
const COLS=["jobsites","units","tf","updates","issues","mols","categories","roles","templates","settings","drive","logs"];
let SB=null,SESSION=null,WHO=null,REV=0;const STATE={};COLS.forEach(c=>STATE[c]={});
const subs={},queue=[];let flushing=false,pollT=null;
const $g=id=>document.getElementById(id);
const clone=d=>JSON.parse(JSON.stringify(d??{}));
const rid=()=>{const a=crypto.getRandomValues(new Uint8Array(10));return"r"+[...a].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,19)};
async function call(op,body){
  const tok=(await SB.auth.getSession()).data.session?.access_token;const url=gasUrl();
  if(!url)throw new Error("Alamat Apps Script belum diisi");
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),op==="upload"||op==="download"?180000:45000);
  try{const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({op,token:tok,...body}),redirect:"follow",signal:ctl.signal});
    if(!r.ok)throw new Error("Server Drive tidak menjawab (HTTP "+r.status+")");
    let j;try{j=await r.json()}catch(e){throw new Error("Respons Apps Script bukan JSON. Periksa deployment Web App (Execute as: Me, Who has access: Anyone).")}
    if(!j||!j.ok){const e=new Error(j?.error||"Apps Script menolak permintaan");e.code=j?.code;throw e}return j}
  catch(e){if(e.name==="AbortError")throw new Error("Server Drive terlalu lama menjawab. Periksa koneksi.");throw e}finally{clearTimeout(tm)}}
function saveCache(){try{if(WHO)localStorage.setItem(CK,JSON.stringify({email:WHO.email,who:WHO,rev:REV,data:STATE}))}catch(e){}}
function loadCache(email){try{const c=JSON.parse(localStorage.getItem(CK)||"null");return c&&c.email===email?c:null}catch(e){return null}}
function snap(c,q){let docs=Object.entries(STATE[c]||{}).map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));
  if(q.ob)docs.sort((a,b)=>{const x=a.data()[q.ob],y=b.data()[q.ob];return(x>y?1:x<y?-1:0)*(q.dir==="desc"?-1:1)});if(q.lim)docs=docs.slice(0,q.lim);
  return{docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}}
function emit(c){(subs[c]||[]).forEach(s=>{try{s.cb(snap(c,s.q))}catch(e){console.error(e)}})}
function emitAll(){COLS.forEach(emit)}
async function pull(force){if(queue.length||flushing)return;
  try{const j=await call("state",{rev:force?0:REV});if(!j.same&&j.data){COLS.forEach(c=>STATE[c]=j.data[c]||{});REV=j.rev;emitAll();saveCache()}}catch(e){if(force)throw e}}
function enqueue(o){queue.push(o);flush()}
async function flush(){if(flushing)return;flushing=true;
  try{while(queue.length){const ops=queue.splice(0,60);let tries=0;
    for(;;){try{const j=await call("write",{ops});const expect=REV+1;REV=j.rev;if(j.rev!==expect)setTimeout(()=>pull(true),50);break}
      catch(e){if(e.code==="readonly"||e.code==="forbidden"||++tries>3){window.__rekonToast&&__rekonToast("Gagal menyimpan ke Drive: "+(e.message||e));break}await new Promise(r=>setTimeout(r,1500*tries))}}}
   saveCache()}finally{flushing=false}}
addEventListener("beforeunload",e=>{if(queue.length||flushing){e.preventDefault();e.returnValue=""}});
function putDoc(c,id,d){STATE[c]=STATE[c]||{};STATE[c][id]=clone(d);emit(c);enqueue({t:"put",col:c,id,data:STATE[c][id]})}
function query(c,q){return{
  orderBy:(f,dir)=>query(c,{...q,ob:f,dir}),limit:n=>query(c,{...q,lim:n}),where:()=>query(c,q),
  get:async()=>snap(c,q),
  onSnapshot(cb){const s={cb,q};(subs[c]=subs[c]||[]).push(s);setTimeout(()=>cb(snap(c,q)),0);return()=>{subs[c]=(subs[c]||[]).filter(x=>x!==s)}},
  add:async d=>{const id=rid();putDoc(c,id,d);return{id}},
  doc:id=>{id=id||rid();return{id,path:c+"/"+id,
    get:async()=>{const d=STATE[c]?.[id];return{id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}},
    set:async d=>putDoc(c,id,d),
    update:async d=>{if(!STATE[c]?.[id])throw{code:"invalid_argument",message:"Dokumen tidak ada"};putDoc(c,id,{...STATE[c][id],...clone(d)})},
    delete:async()=>{if(STATE[c])delete STATE[c][id];emit(c);enqueue({t:"del",col:c,id})}}}}}
const b64of=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=()=>rej(r.error);r.readAsDataURL(f)});
const urlCache={};
const canW=()=>!!WHO&&(WHO.role==="owner"||WHO.role==="editor");
const API={
  db:{collection:c=>query(c,{})},
  user:{isOwner:async()=>WHO?.role==="owner",canEdit:async()=>canW(),can:async n=>n==="data.write"?canW():null,id:async()=>WHO?.email||null,me:async()=>({name:WHO?.email||""}),
    profiles:async ids=>Object.fromEntries(ids.map(i=>[i,{name:i}])),search:async()=>[],
    addAccess:async(email,role)=>call("setRole",{email,role}),listAccess:async()=>(await call("roles",{})).roles,
    signOut:async()=>{try{localStorage.removeItem(CK)}catch(_){}await SB.auth.signOut();location.reload()},
    driveSearch:"https://drive.google.com/drive/search?q=%22Web%20Monitoring%20Rekondisi%22"},
  assets:{
    upload:async(file,dirs)=>{const j=await call("upload",{name:file.name,mime:file.type||"application/octet-stream",b64:await b64of(file),dirs:dirs||[]});if(!j||!j.id)throw new Error("Google Drive tidak mengembalikan ID berkas");return{id:j.id,sizeBytes:j.size,contentType:j.mime,drive:j.url}},
    delete:async id=>{try{await call("trash",{id})}catch(e){}},
    signedUrl:async(id)=>urlCache[id]||(urlCache[id]=(async()=>{const j=await call("download",{id});const bin=atob(j.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return URL.createObjectURL(new Blob([u],{type:j.mime||"image/jpeg"}))})())},
  downloads:{save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);return{status:"saved"}}},
  mcp:null};
let readyRes;const READY=new Promise(r=>readyRes=r);
window.claude={use:async n=>{await READY;return API[n]??null}};
function gate(kind,msg){const g=$g("gate");g.hidden=false;const em=SESSION?.user?.email||"";
  $g("gBody").innerHTML=kind==="login"?`<form id="gForm" class="gform"><label class="f">Email<input type="email" id="gEm" autocomplete="email" required placeholder="nama@email.com"></label><label class="f">Password<input type="password" id="gPw" autocomplete="current-password"></label><button class="btn pr" type="submit">Masuk</button><p class="gmsg" id="gMsg">${msg||"Masuk dengan akun Portal Monitoring. Kosongkan password untuk menerima kode 6 angka lewat email."}</p></form>`
   :kind==="setup"?`<p>Alamat Google Apps Script belum diisi. Tempel URL <b>/exec</b> dari deployment Apps Script Web Monitoring Rekondisi (lihat README di folder <code>monitoring-rekondisi</code>).</p><form id="gSet" class="gform"><label class="f">URL Apps Script<input type="url" id="gUrl" required placeholder="https://script.google.com/macros/s/…/exec" value="${gasUrl()}"></label><button class="btn pr" type="submit">Simpan</button></form>`
   :`<p>${msg}</p><p class="gmsg">Masuk sebagai <b>${em}</b></p><div class="gform"><button class="btn pr" type="button" onclick="location.reload()">Coba lagi</button><button class="btn" type="button" id="gSetBtn">Ganti URL Apps Script</button><button class="btn" type="button" id="gOut">Keluar</button></div>`;
  const f=$g("gForm");if(f){if(window.KMBOtp&&KMBOtp.hidePassword)KMBOtp.hidePassword($g("gPw"),{submit:f.querySelector("[type=submit]")});f.onsubmit=async e=>{e.preventDefault();const email=$g("gEm").value.trim().toLowerCase(),pw=$g("gPw").value;$g("gMsg").textContent="Memproses…";
    const r=pw?await SB.auth.signInWithPassword({email,password:pw}):await SB.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});
    $g("gMsg").textContent=r.error?(/invalid login/i.test(r.error.message)?"Email atau password salah.":"Gagal masuk: "+r.error.message):pw?"Berhasil masuk…":"Kode masuk dikirim ke "+email+".";if(!pw&&!r.error&&window.KMBOtp)KMBOtp.prompt(SB,email,{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false})}}
  const s=$g("gSet");if(s)s.onsubmit=e=>{e.preventDefault();try{localStorage.setItem(LS,$g("gUrl").value.trim())}catch(_){}location.reload()};
  const sb=$g("gSetBtn");if(sb)sb.onclick=()=>gate("setup");
  const o=$g("gOut");if(o)o.onclick=()=>API.user.signOut()}
async function start(){
  if(!window.supabase?.createClient){gate("error","Tidak bisa memuat layanan login. Periksa koneksi lalu muat ulang.");return}
  SB=window.supabase.createClient(SUPA.url,SUPA.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SESSION=(await SB.auth.getSession()).data.session;
  let first=true;SB.auth.onAuthStateChange((ev,s)=>{if(first){first=false;return}if(ev==="SIGNED_IN"&&!SESSION||ev==="SIGNED_OUT")location.reload();SESSION=s});
  if(!SESSION){gate("login");return}
  if(!gasUrl()){gate("setup");return}
  const openApp=()=>{$g("gate").hidden=true;readyRes();pollT=pollT||setInterval(()=>{if(!document.hidden)pull(false)},20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull(false)})};
  const cached=loadCache(SESSION.user?.email);
  if(cached&&cached.who&&cached.data){WHO=cached.who;REV=cached.rev||0;COLS.forEach(c=>STATE[c]=cached.data[c]||{});openApp();
    call("whoami",{}).then(w=>{const ch=w.role!==WHO.role;WHO=w;saveCache();if(ch)location.reload();else pull(false)}).catch(e=>{if(e.code==="forbidden"){try{localStorage.removeItem(CK)}catch(_){}location.reload()}})}
  else{const gm=document.querySelector("#gBody .gmsg");if(gm)gm.textContent="Menghubungkan ke Google Drive… (hanya saat pertama kali)";
    try{WHO=await call("whoami",{})}catch(e){gate("error",e.code==="forbidden"?"Web ini pribadi milik Pemilik. Akun ini belum diberi akses.":"Tidak bisa terhubung ke Google Drive: "+e.message);return}
    try{await pull(true)}catch(e){}saveCache();openApp()}}
start();
})();

function subscribe(){
 const pending=new Set(COLS);const t=setTimeout(()=>{if(!S.loaded){S.slow=true;render()}},10000);
 COLS.forEach(c=>S.db.collection(c).onSnapshot(snap=>{
  const arr=snap.docs.map(d=>({...d.data(),id:d.id}));
  if(c==='tf'||c==='roles'||c==='templates')D[c]=Object.fromEntries(arr.map(x=>[x.id,x]));

  else D[c]=arr;
  if(!snap.metadata.fromCache)pending.delete(c);
  if(!pending.size&&!S.loaded){S.loaded=true;S.slow=false;clearTimeout(t)}
  invalidate();schedule();
 },e=>{pending.delete(c);if(!pending.size){S.loaded=true;clearTimeout(t)}toast('Gagal memuat '+c+': '+(e.message||e.code),'err');schedule()}));

}

function sched(stages,start){const tot=sum(stages||[],s=>s.dur)||1;let c=0;return(stages||[]).map(s=>{const dur=Math.max(0.5,+s.dur||0.5);const o={name:String(s.name||''),dur,weight:dur/tot*100,c0:c,c1:c+dur};c+=dur;if(start){o.start=workDate(start,Math.floor(o.c0));o.end=workDate(start,Math.max(Math.floor(o.c0),Math.ceil(o.c1)-1))}return o})}

function unitCalc(u,at){
 at=at||today();const tf=D.tf[u.id];const start=tf?.start||'';
 const cur=sched(tf?.current,start);const ostart=tf?.originalStart||start;const org=sched(tf?.original||tf?.current,ostart);
 const am=actualMap(u.id,at);const act=cur.map((s,i)=>Math.min(100,am[i]||0));
 let actual=sum(cur,(s)=>0);cur.forEach((s,i)=>actual+=s.weight*act[i]/100);
 const plan=planAt(cur,start,at),oplan=planAt(org,ostart,at);
 const doneN=act.filter(a=>a>=100).length,idx=act.findIndex(a=>a<100);
 const tEnd=start&&cur.length?cur.at(-1).end:null,oEnd=ostart&&org.length?org.at(-1).end:null;
 const done=!!u.doneVerified&&(!u.doneDate||u.doneDate<=at);
 const tol=+(D.settings.tolerance??5);
 let status;
 if(done)status=(tEnd&&u.doneDate>tEnd)?'Selesai Terlambat':'Selesai';
 else if(!cur.length||(!start&&actual<=0)||(start&&start>at))status='Belum Mulai';
 else if(!start)status='On Progress';
 else if(cur.some((s,i)=>act[i]<100&&s.end<at))status='Terlambat';
 else if(actual+tol<plan)status='Tertinggal';
 else status='On Progress';
 return{tf,start,cur,org,act,actual:done?100:actual,plan:done?100:plan,oplan,dev:done?0:actual-plan,doneN,total:cur.length,idx,stage:idx>=0?cur[idx]:null,tEnd,oEnd,status,group:grp(status),allDone:cur.length>0&&idx<0,rev:tf?.rev||0,done}}

async function ensureCat(name){name=String(name||'').trim();if(!name||cats().some(c=>c.toLowerCase()===name.toLowerCase()))return;const id='CAT-'+name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40);await put('categories',id,{name,at:new Date().toISOString(),by:S.uid||''});log('Tambah kategori',id,name)}

function stats(us){const cs=us.map(calc);const c=g=>cs.filter(x=>x.group===g).length;return{n:us.length,not:c('Belum Mulai'),op:c('On Progress'),lag:cs.filter(x=>x.status==='Tertinggal').length,late:c('Terlambat'),done:c('Selesai'),started:cs.filter(x=>x.start).length,running:cs.filter(x=>x.start||x.actual>0).length,plan:cs.filter(x=>x.start).length?sum(cs.filter(x=>x.start),x=>x.plan)/cs.filter(x=>x.start).length:0,actual:cs.filter(x=>x.start||x.actual>0).length?sum(cs.filter(x=>x.start||x.actual>0),x=>x.actual)/cs.filter(x=>x.start||x.actual>0).length:0}}

const REPS={daily:'Daily Progress Report',weekly:'Weekly Progress Report',pva:'Plan vs Actual Report',dev:'Deviation Report',iss:'Rekap Permasalahan',issdone:'Rekap Penyelesaian Masalah',mol:'MOL Report',js:'Rekap Per Jobsite',pop:'Rekap Populasi Unit'};
function buildRep(){const R=S.rep;const d=R.date||today();const jid=R.js==='all'?null:R.js;const us=assigned().filter(u=>!jid||u.jobsiteId===jid).sort((a,b)=>a.code.localeCompare(b.code));const ft=x=>Math.round(x)+'%';
 switch(R.type){
 case'daily':return{cols:['Unit','Jenis','Jobsite','Tahapan berjalan','Plan %','Aktual %','Deviasi','Progress hari ini','Laporan shift 1','Laporan shift 2','Kendala','Status'],rows:us.map(u=>{const c=unitCalc(u,d),p=unitCalc(u,addDays(d,-1));const up=[...D.laps,...D.updates.filter(x=>!x.lapId)].filter(x=>x.unitId===u.id&&x.date===d&&!x.void);const sh=n=>up.filter(x=>x.shift==n).map(x=>x.notes).filter(Boolean).join('; ')||'-';return[u.code,u.type,jsName(u.jobsiteId),c.stage?(c.idx+1)+'. '+c.stage.name:'-',ft(c.plan),ft(c.actual),Math.round(c.dev)+'%','+'+r1(c.actual-p.actual)+'%',sh(1),sh(2),up.map(x=>x.kendala).filter(Boolean).join('; ')||'-',c.status]})};
 case'weekly':{const s=addDays(d,-6);return{cols:['Unit','Jenis','Jobsite','Aktual awal','Aktual akhir','Kemajuan','Plan akhir','Deviasi','Masalah baru','Masalah open','Status'],rows:us.map(u=>{const a=unitCalc(u,addDays(s,-1)),b=unitCalc(u,d);const iss=issuesOf(i=>i.unitId===u.id);return[u.code,u.type,jsName(u.jobsiteId),ft(a.actual),ft(b.actual),'+'+r1(b.actual-a.actual)+'%',ft(b.plan),Math.round(b.dev)+'%',iss.filter(i=>i.date>=s&&i.date<=d).length,iss.filter(i=>i.status!=='Closed').length,b.status]}),sub:'Minggu '+fd(s)+' – '+fd(d)}}
 case'pva':return{cols:['Unit','Jenis','Jobsite','Mulai','Original plan %','Revised plan %','Aktual %','Dev vs original','Dev vs revised','Revisi','Target original','Target revisi','Status'],rows:us.map(u=>{const c=unitCalc(u,d);return[u.code,u.type,jsName(u.jobsiteId),fd(c.start),ft(c.oplan),ft(c.plan),ft(c.actual),Math.round(c.actual-c.oplan)+'%',Math.round(c.actual-c.plan)+'%',c.rev,fd(c.oEnd),c.rev?fd(c.tEnd):'-',c.status]})};
 case'dev':{const rows=[];us.forEach(u=>{const c=unitCalc(u,d);if(!c.start)return;c.cur.forEach((s,i)=>{const o=c.org[i]||s;const dv=o.end?dd(o.end,s.end):0;const late=c.act[i]<100&&s.end<d;if(dv||late||(c.act[i]<100&&s.start<=d))rows.push([u.code,(i+1)+'. '+s.name,fd(o.start),fd(o.end),fd(s.end),(dv>0?'+':'')+dv+' hr',ft(c.act[i]),late?'Terlambat '+dd(s.end,d)+' hr':c.act[i]>=100?'Selesai':'Berjalan'])})});return{cols:['Unit','Tahapan','Mulai original','Selesai original','Selesai berlaku','Geser target','Aktual','Keterangan'],rows}}

async function save(filename,data){if(!S.dl){toast('Unduhan tidak tersedia di tampilan ini','err');return}try{await S.dl.save({filename,data})}catch(e){if(e?.code!=='declined')toast('Gagal mengunduh: '+(e?.message||e?.code),'err')}}
function xlsxSave(filename,sheets){if(!window.XLSX)return toast('Library Excel belum termuat','err');const wb=XLSX.utils.book_new();for(const[n,aoa,w]of sheets){const ws=XLSX.utils.aoa_to_sheet(aoa);if(w)ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)}return save(filename,new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'})))}
function pdfSave(filename,title,sub,cols,rows){if(!window.jspdf)return toast('Library PDF belum termuat','err');const{jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});const W=doc.internal.pageSize.getWidth();
 doc.setFillColor(224,59,59);doc.roundedRect(24,20,30,30,6,6,'F');doc.setTextColor(255);doc.setFontSize(16);doc.text('M',33,41);doc.setTextColor(23,23,28);doc.setFontSize(15);doc.text(title,64,32);doc.setFontSize(9);doc.setTextColor(107);doc.text(sub,64,46);
 doc.autoTable({head:[cols],body:rows.map(r=>r.map(v=>String(v??''))),startY:64,styles:{fontSize:7.5,cellPadding:3,overflow:'linebreak'},headStyles:{fillColor:[246,246,248],textColor:[60,60,70],fontStyle:'bold'},alternateRowStyles:{fillColor:[252,252,253]},margin:{left:24,right:24},didDrawPage:()=>{doc.setFontSize(7.5);doc.setTextColor(120);doc.text('Monitoring Rekondisi Vessel & Dolly · dicetak '+new Date().toLocaleString('id-ID'),24,doc.internal.pageSize.getHeight()-14)}});
 return save(filename,doc.output('blob'))}
function nd(v){if(v==null||v==='')return'';if(typeof v==='number'&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);return p?`${p.y}-${pad(p.m)}-${pad(p.d)}`:''}const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${pad(m[2])}-${pad(m[3])}`;m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return`${m[3]}-${pad(m[2])}-${pad(m[1])}`;return''}

/* parse KMB "TIME FRAME JOB SHEET" (Grafik Vessel / Grafik Dolly) */
function parseJobSheet(sh,name){const a=sheetAoa(sh);let type=/dolly/i.test(name)?'Dolly':/vessel/i.test(name)?'Vessel':'';const flat=a.map(r=>r.map(x=>String(x).trim()));
 if(!type){if(flat.some(r=>r.includes('DOLLY IN')))type='Dolly';else if(flat.some(r=>r.includes('VESSEL IN')))type='Vessel'}
 let hr=-1,cNo=-1,cDesc=-1,cDays=-1;for(let i=0;i<a.length&&hr<0;i++){const r=flat[i];const d=r.findIndex(x=>/^description$/i.test(x));if(d>=0){hr=i;cDesc=d;cNo=r.findIndex(x=>/^no$/i.test(x));cDays=r.findIndex(x=>/^days$/i.test(x))}}
 if(hr<0||cDays<0||!type)return null;const st=[];
 for(let i=hr+1;i<a.length;i++){const r=a[i];if(/monitoring lead time/i.test(flat[i].join(' ')))break;const no=+r[cNo];const dur=+r[cDays];const nm=String(r[cDesc]||'').trim();if(no>0&&nm&&dur>0)st.push({no,name:nm,dur})}
 st.sort((x,y)=>x.no-y.no);const model=(()=>{for(const r of flat){const k=r.findIndex(x=>/^model$/i.test(x));if(k>=0)return r.slice(k+1).find(Boolean)||''}return''})();
 return st.length?{type,stages:st.map(s=>({name:s.name,dur:s.dur})),model}:null}

  return{u,code,date,shift,stage:no-1,stageName:st?.[no-1]?.name||'',pct:+p,notes:String(col(r,'laporan')),checklist:String(col(r,'checklist')),kendala:String(col(r,'kendala')),err}}).filter(i=>i.err!=='skip');

function ulPop(){pickFile((wb,fn)=>{const out=[];wb.SheetNames.forEach(n=>{const a=sheetAoa(wb.Sheets[n]);let hdr=null,type='';
 a.forEach(r=>{const f=r.map(x=>String(x).trim());const j=f.join(' ');if(/populasi\s+vessel/i.test(j))type='Vessel';if(/populasi\s+dolly/i.test(j))type='Dolly';
  const ci=f.findIndex(x=>/code unit/i.test(x));if(ci>=0){hdr={code:ci,cat:f.findIndex(x=>/^category$/i.test(x)),man:f.findIndex(x=>/^manufactur/i.test(x)),model:f.findIndex(x=>/^model$/i.test(x)),sn:f.findIndex(x=>/serial/i.test(x)),rem:f.findIndex(x=>/^remark$/i.test(x)),ven:f.findIndex(x=>/^vendor$/i.test(x)),pos:f.findIndex(x=>/^position$/i.test(x))};return}
  if(hdr&&/^[A-Z]{2,}\d{3,}$/i.test(f[hdr.code])){const code=f[hdr.code].toUpperCase();const t=type||(/^DL/.test(code)||/dolly/i.test(f[hdr.cat])?'Dolly':'Vessel');out.push({code,type:t,manufacturer:f[hdr.man]||'',model:f[hdr.model]||'',sn:f[hdr.sn]||'',remark:hdr.rem>=0?f[hdr.rem]:'',vendorPrev:hdr.ven>=0?f[hdr.ven]:'',position:hdr.pos>=0?f[hdr.pos]:'',note:hdr.pos>=0?(f[hdr.pos+1]||''):'',category:f[hdr.cat]||''})}})});
 const seen=new Set();for(let i=out.length-1;i>=0;i--){if(seen.has(out[i].code))out.splice(i,1);else seen.add(out[i].code)}

 else if(t.dataset.role){const id=t.dataset.role;guard(async()=>{if(S.user?.addAccess)await S.user.addAccess(id,t.value==='Viewer'?'viewer':'editor');await put('roles',id,{role:t.value,at:new Date().toISOString(),by:S.uid||''})}).then(ok=>{if(ok){log('Ubah peran',id,t.value);toast('Peran diperbarui')}})}});

})();
